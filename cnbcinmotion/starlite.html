<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starlite - TS test</title>
<!--
  Test page: can the Drive-proof pipeline play a plain MPEG-TS HLS source?

  The CNBC page consumes fMP4, which mp4box.js demuxes directly. This source
  (starlite.best) serves MPEG-TS, so there is an extra stage in front:

    .ts segment
      -> mux.js  mp4.Transmuxer   TS  -> fMP4 (init + media segments)
      -> mp4box.js                 fMP4 -> H.264 / AAC elementary samples
      -> WebCodecs VideoDecoder    ES   -> VideoFrame
      -> canvas                    newest frame, painted on a rAF gate

  Nothing here touches an MSE <video> element for video, which is the whole
  point: the element freezes in Drive, so video is decoded independently.

  Params:
    ?url=<playlist>   source playlist (default: the starlite.best stream)
    ?fps=30           canvas paint cap (default 30)
    ?audio=0          decode video only, skip the audio path
    ?stats=0          hide the diagnostics panel
-->
<script src="https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  #overlay {
    position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    color: #fff; background: rgba(0,0,0,0.55); cursor: pointer;
    font: 600 17px/1 system-ui; letter-spacing: .4px;
  }
  #overlay.gone { display: none; }

  #err {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 26;
    max-width: 88%; padding: 9px 15px; border-radius: 12px;
    background: rgba(120,20,20,0.85); color: #fff; font-size: 12px; letter-spacing: .2px;
  }
  #err:empty { display: none; }

  #stats {
    position: absolute; left: 12px; top: 12px; z-index: 25; min-width: 178px;
    padding: 10px 12px; border-radius: 12px; color: #d8dade;
    background: rgba(20,22,26,0.62); border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font: 500 11px/1.55 ui-monospace, Menlo, monospace; letter-spacing: .3px;
  }
  #stats b { color: #fff; font-weight: 600; }
  #stats .k { color: #8f9298; }
  #stats.hidden { display: none; }
  #stats .sep { height: 1px; margin: 6px 0; background: rgba(255,255,255,0.09); }
  .ok { color: #6ee7a0; } .bad { color: #ff8f8f; } .mid { color: #ffd479; }

  #ctl {
    position: absolute; right: 12px; top: 12px; z-index: 25; display: flex; gap: 8px;
  }
  #ctl button {
    appearance: none; border: 1px solid rgba(255,255,255,0.12); cursor: pointer;
    padding: 9px 14px; border-radius: 999px; color: #d8dade;
    background: rgba(20,22,26,0.62); font: 600 11px/1 system-ui; letter-spacing: .5px;
    text-transform: uppercase;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #ctl button:active { transform: scale(0.95); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="frame"></canvas>
  <div id="overlay">Tap to start</div>
  <div id="ctl">
    <button type="button" id="btnTone" title="Play a 1kHz tone through the same output chain">Tone</button>
    <button type="button" id="btnLive">Live</button>
    <button type="button" id="btnStats">Stats</button>
  </div>
  <div id="stats"></div>
  <div id="err"></div>
</div>
<script>
'use strict';

// How much already-downloaded media to keep ahead of playback. This is the
// cushion that makes audio smooth: it is what absorbs a slow segment fetch, a
// decode hiccup, or a repaint without the listener hearing a gap.
const BUFFER_TARGET_S = 12;

const Q = new URLSearchParams(location.search);
const DEFAULT_URL =
  'https://starlite.best/api/stream/ddo5142011/2+%7BKwUO8:5$41m/livetv.epg/qkihgakk.ss.m3u8';

const SRC = {
  url:  Q.get('url') || DEFAULT_URL,
  fps:  Math.max(1, Math.min(60, parseInt(Q.get('fps') || '30', 10) || 30)),
  audio: Q.get('audio') !== '0',
  // Amplification for a quiet source. The default lifts this feed's -30dB mean
  // to roughly programme level; the limiter downstream stops the peaks clipping.
  gain: Math.max(0.5, Math.min(20, parseFloat(Q.get('gain') || '4') || 4)),
  stats: Q.get('stats') !== '0',
};

const wrap   = document.getElementById('wrap');
const pan    = document.getElementById('frame');
const statsEl= document.getElementById('stats');
const errBox = document.getElementById('err');
const overlay= document.getElementById('overlay');

function setError(m) { if (m) errBox.textContent = m; }

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const S = {
  stage: 'idle',
  stats: SRC.stats,        // the panel renders off this; SRC.stats is the URL knob
  base: SRC.url,          // playlist URL after redirects: segment paths resolve against it
  segs: [],               // [{ url, dur }]
  cursor: 0,
  lastUrl: null,          // last segment consumed, so the sliding window is tracked by URL
  target: 4,              // EXT-X-TARGETDURATION, seconds
  edgeLen: 0,             // total seconds held in the live window
  fetching: false,
  started: false,
  // transmux / demux
  tm: null, mbox: null, filePos: 0,
  tmEvents: 0, inits: 0, medias: 0, feeds: 0, initFed: false,   // mux.js -> mp4box hand-off
  vTrack: null, aTrack: null, vDesc: null, aDesc: null,
  // video
  vdec: null, fq: [],            // decoded frames waiting for their due time
  pend: [], vT0: -1, mediaEnd: 0,   // video chunks, media-clock anchor, newest media time
  // audio
  adec: null, actx: null, aPend: [], ring: null, gain: null, limiter: null,
  analyser: null, aBuf: null, aOutRms: 0, ctxNote: '', ringPending: false,
  audioPath: '', modErr: '', sproc: null, pushAudio: null,
  aQueue: 0, aUnderruns: 0,
  aFrames: 0, aSeconds: 0, aRms: 0, aSrcRms: 0, aSrcPeak: 0, aHead: null,  // level of decoded + played samples
  // counters
  segsFetched: 0, segBytes: 0, samples: 0, frames: 0, drawn: 0, drops: 0,
  fetchLog: [],
  decFps: 0, paintFps: 0, lastDecT: 0, lastPaintT: 0,
  width: 0, height: 0, codec: '-', segLag: 0,
  paintTimer: null, gaps: [], frameIv: 0, lastFrameDue: -1,   // judder samples + learned frame interval
  t0: 0, err: '',
};

const has = (k) => typeof window[k] !== 'undefined';
function libs() {
  const miss = [];
  if (!has('muxjs') || !muxjs.mp4 || !muxjs.mp4.Transmuxer) miss.push('mux.js');
  if (!has('MP4Box')) miss.push('mp4box.js');
  if (!has('VideoDecoder') || !has('EncodedVideoChunk')) miss.push('WebCodecs VideoDecoder');
  if (SRC.audio && (!has('AudioDecoder') || !has('AudioData'))) miss.push('WebCodecs AudioDecoder');
  return miss;
}

// ---------------------------------------------------------------------------
// Playlist
// ---------------------------------------------------------------------------
function parsePlaylist(text) {
  const segs = [];
  let dur = 0, target = 4;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    if (line.indexOf('#EXT-X-TARGETDURATION:') === 0) {
      target = parseFloat(line.slice(17)) || target;
    } else if (line.indexOf('#EXTINF:') === 0) {
      dur = parseFloat(line.slice(8));
    } else if (line.indexOf('#') !== 0) {
      segs.push({ url: line, dur: dur || target });
      dur = 0;
    }
  }
  return { segs, target };
}

async function loadPlaylist() {
  const r = await fetch(S.base, { cache: 'no-store' });
  if (!r.ok) throw new Error('playlist HTTP ' + r.status);
  // The starlite URL 301s to a CDN host; segment paths are relative to that.
  S.base = r.url || S.base;
  const { segs, target } = parsePlaylist(await r.text());
  if (!segs.length) throw new Error('no segments in playlist');
  S.target = target;
  S.segs = segs;
  S.edgeLen = segs.reduce((a, s) => a + s.dur, 0);
  return segs.length;
}

// ---------------------------------------------------------------------------
// MPEG-TS -> fMP4 (mux.js) -> elementary samples (mp4box)
// ---------------------------------------------------------------------------
function feedMp4(bytes) {
  if (!S.mbox) return;
  S.feeds++;
  try {
    const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
    ab.fileStart = S.filePos;
    S.mbox.appendBuffer(ab);
    S.filePos += ab.byteLength;
    if (!S.vTrack) setupTracks();
  } catch (e) { S.feedErr = (e && e.stack) || String(e); setError('demux: ' + e.message); }
}

function setupTracks() {
  const info = S.mbox.getInfo();
  if (!info) return;
  S.infoTracks = { v: (info.videoTracks || []).length, a: (info.audioTracks || []).length,
                   brands: (info.brands || []).join(',') };
  const vt = info.videoTracks && info.videoTracks[0];
  if (!vt) return;
  S.vTrack = vt;
  const at = info.audioTracks && info.audioTracks[0];
  S.aTrack = at || null;

  // getInfo() hands back a summary; the sample-entry box tree (where avcC and
  // esds live) only comes back from getTrackById(). Reaching for .mdia on the
  // info object throws, because it is not there.
  S.vdec.configure(buildVideoConfig(S.mbox.getTrackById(vt.id)));
  if (at && SRC.audio) setupAudio(S.mbox.getTrackById(at.id));

  S.mbox.setExtractionOptions(vt.id, null, { nbSamples: 90 });
  if (at && SRC.audio) S.mbox.setExtractionOptions(at.id, null, { nbSamples: 200 });
  S.mbox.onSamples = onSamples;
  S.mbox.start();   // without start() mp4box never releases samples
}

function buildVideoConfig(trak) {
  const entry = trak.mdia.minf.stbl.stsd.entries[0];
  S.vDesc = avcCDescription(entry && entry.avcC);
  const codec = trak.codec || (entry && entry.avcC
    ? 'avc1.' + hex2(entry.avcC.AVCProfileIndication) + hex2(entry.avcC.profile_compatibility) + hex2(entry.avcC.AVCLevelIndication)
    : 'avc1.64001f');
  S.codec = codec;
  const cfg = { codec, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' };
  if (S.vDesc) cfg.description = S.vDesc;
  return cfg;
}

// avcC record -> the flat AVCDecoderConfigurationRecord WebCodecs wants
function avcCDescription(avcC) {
  if (!avcC || !avcC.SPS || !avcC.SPS.length || !avcC.PPS || !avcC.PPS.length) return undefined;
  const parts = [avcC.configurationVersion, avcC.AVCProfileIndication,
    avcC.profile_compatibility, avcC.AVCLevelIndication,
    0xFC | (avcC.lengthSizeMinusOne & 3), 0xE0 | avcC.SPS.length];
  for (const s of avcC.SPS) parts.push((s.nalu.length >> 8) & 255, s.nalu.length & 255, ...s.nalu);
  parts.push(avcC.PPS.length);
  for (const p of avcC.PPS) parts.push((p.nalu.length >> 8) & 255, p.nalu.length & 255, ...p.nalu);
  return new Uint8Array(parts);
}

function hex2(n) { return (n == null ? 0 : n).toString(16).padStart(2, '0'); }

function onSamples(id, user, samples) {
  S.samples += samples.length;
  // Every append begins at a segment boundary, and HLS segments open with a
  // keyframe, even when the packager omits mp4box's is_sync flags. Without
  // this the decoder key-waits and stalls.
  let first = true;
  for (const s of samples) {
    if (!s || !s.data || !s.data.byteLength) continue;
    const raw = new Uint8Array(s.data.buffer.slice(s.data.byteOffset, s.data.byteOffset + s.data.byteLength));
    const sync = !!s.is_sync || first;
    first = false;
    if (id === S.vTrack.id) {
      const ts = Math.round((s.cts * 1e6) / (S.vTrack.timescale || 90000));
      const sec = s.cts / (S.vTrack.timescale || 90000);
      // Anchor the media clock so this first frame is due RIGHT NOW. Joining
      // mid-stream means the timestamps already read tens of seconds; anchoring
      // at t=0 would leave every frame due 40s in the future and nothing would
      // ever decode.
      if (S.vT0 < 0) S.vT0 = Date.now() - sec * 1000;
      if (sec > S.mediaEnd) S.mediaEnd = sec;      // newest media time downloaded
      S.pend.push({ kind: 'v', sync, ts, due: S.vT0 + sec * 1000, raw });
    } else if (S.aTrack && S.adec) {
      // Audio gets its own queue, paced on the same media clock. Sharing the
      // video queue lets audio evict video (AAC frames outnumber video ~2:1),
      // and feeding it unpaced delivers a whole 11.5s burst at once, which runs
      // the scheduler far ahead of the audio clock and stutters.
      const sec = s.cts / (S.aTrack.timescale || 48000);
      const ts = Math.round(sec * 1e6);
      S.aPend.push({ sync, ts, due: S.vT0 >= 0 ? S.vT0 + sec * 1000 : 0, raw });
    }
  }
  // Bound each queue to the WORST-CASE buffer, not the target. Fetching happens
  // a whole segment at a time, so the buffer oscillates between the target and
  // target+segment (~12s -> 23.5s) rather than sitting at 12s. Capping at the
  // target overflowed every time a segment landed, and the overflow drops the
  // OLDEST entries - which are exactly the frames about to be shown, showing
  // up as multi-second stalls. These caps hold the full worst case.
  while (S.pend.length > 800) { S.pend.shift(); S.drops++; }
  while (S.aPend.length > 1700) { S.aPend.shift(); S.drops++; }
}

// Seconds of already-downloaded media ahead of what is being played right now.
// Negative means we have run past the download and are starved.
function buffered() {
  if (S.vT0 < 0 || !S.mediaEnd) return 0;
  const playing = (Date.now() - S.vT0) / 1000;   // media position, in seconds
  return S.mediaEnd - playing;
}

// Feed the video decoder on the media clock. Handing every sample straight to
// decode() makes the decoder sprint through a whole 288-frame segment in a few
// milliseconds and dump it all at once, so the canvas gets a bursty trickle
// instead of a steady picture - the paint gate almost never finds a frame
// waiting. Chunks are released only as their presentation time approaches, and
// anything already late is dropped rather than decoded.
function feedDecoders(now) {
  if (!S.vdec || S.vdec.state !== 'configured') return;
  while (S.pend.length && S.pend[0].due < now - 500) { S.pend.shift(); S.drops++; }
  while (S.pend.length && S.pend[0].due - now < 250) {
    if (S.vdec.decodeQueueSize > 6) break;
    const c = S.pend.shift();
    try {
      S.vdec.decode(new EncodedVideoChunk({ type: c.sync ? 'key' : 'delta', timestamp: c.ts, data: c.raw }));
    } catch (e) { /* decoder full or reconfigured */ }
  }
  // Audio rides the same clock but is released much further ahead of its due
  // time than video is. A ring buffer only smooths jitter if it actually holds
  // a cushion: releasing audio just before it is due leaves the ring sitting at
  // zero, so every hiccup on the decode path turns into a dropout. A ~1.5s
  // lookahead lets the ring build a real cushion.
  if (S.adec && S.adec.state === 'configured') {
    while (S.aPend.length && S.aPend[0].due && S.aPend[0].due < now - 500) { S.aPend.shift(); S.drops++; }
    while (S.aPend.length && S.aPend[0].due - now < 1500) {
      if (S.adec.decodeQueueSize > 40) break;
      const c = S.aPend.shift();
      try {
        S.adec.decode(new EncodedAudioChunk({ type: c.sync ? 'key' : 'delta', timestamp: c.ts, data: c.raw }));
      } catch (e) {}
    }
  }
}

// ---------------------------------------------------------------------------
// Audio: AAC -> AudioDecoder -> one continuous Web Audio stream.
//
// The obvious implementation - one AudioBuffer + one BufferSourceNode per AAC
// frame - is what this used to do, and it sounds bad. At 1024 samples a frame
// that is ~47 buffer sources per second, each scheduled independently, and any
// sub-block scheduling error becomes a discontinuity: a click or a warble on
// every boundary. It also allocated a buffer per frame and left the page
// scheduling the whole graph in bursts.
//
// Instead the decoder output is poured into a ring buffer inside an
// AudioWorklet, which pulls samples out at exactly one steady rate. One
// uninterrupted stream, no per-block seams, and the decoder can run ahead into
// the buffer while playback stays smooth.
// ---------------------------------------------------------------------------
const RING_WORKLET = `
class LoFiRing extends AudioWorkletProcessor {
  constructor(opts) {
    super();
    const cap = (opts.processorOptions && opts.processorOptions.capacity) || sampleRate * 4;
    this.cap = cap;
    this.nch = 2;
    this.ch = [new Float32Array(cap), new Float32Array(cap)];
    this.w = 0; this.r = 0; this.avail = 0;
    this.underruns = 0; this.primed = false;
    this.port.onmessage = (e) => {
      const frames = e.data;
      if (!frames || !frames.length) return;
      const n = frames[0].length;
      // Never write past the capacity. The ring is a fixed-size array, so an
      // overrun would lap the read pointer and silently destroy audio that has
      // not been played yet - the 4s ring could not hold a 11.5s segment.
      if (this.avail + n > this.cap) {
        const room = Math.max(0, this.cap - this.avail);
        for (let i = 0; i < room; i++) {
          for (let c = 0; c < this.nch; c++) this.ch[c][this.w] = frames[c][i];
          this.w = (this.w + 1) % this.cap;
        }
        this.avail += room;
        this.overruns = (this.overruns || 0) + (n - room);
        return;
      }
      for (let i = 0; i < n; i++) {
        for (let c = 0; c < this.nch; c++) this.ch[c][this.w] = frames[c][i];
        this.w = (this.w + 1) % this.cap;
      }
      this.avail += n;
      this.fed = true;   // audio is now flowing; starvation is meaningful
    };
  }
  process(inputs, outputs) {
    const out = outputs[0];
    if (!out || !out.length) return true;
    const n = out[0].length;
    let starved = false;
    // One read per SAMPLE POSITION, not per channel. Advancing the read
    // pointer inside the per-channel loop consumed 2 samples for every frame of
    // output on a stereo stream, so the ring drained at exactly double rate and
    // always ran dry - and the right channel got the wrong samples. Read the
    // position once, then fan it out to every channel.
    for (let i = 0; i < n; i++) {
      let l = 0, r = 0;
      if (this.avail > 0) {
        l = this.ch[0][this.r];
        r = this.ch[1][this.r];
        this.r = (this.r + 1) % this.cap;
        this.avail--;
      } else {
        starved = true;
      }
      out[0][i] = l;
      if (out.length > 1) out[1][i] = r;
      if (out.length > 2) for (let c = 2; c < out.length; c++) out[c][i] = l;
      // Track the level actually being played. Without this, a decoder that
      // happily outputs silence looks identical to a healthy one: the queue
      // fills, nothing underruns, and there is still no sound.
      this.sum = (this.sum || 0) + l * l;
      this.peak = Math.max(this.peak || 0, Math.abs(l));
      this.count = (this.count || 0) + 1;
      if (this.count >= 2048) { this.rms = Math.sqrt(this.sum / this.count); this.count = 0; this.sum = 0; }
    }
    // Report sparingly. process() runs every 128 samples - about 375 times a
    // second - and posting on every call floods the main thread with messages,
    // which starves requestAnimationFrame (so the video stops painting) and
    // starves the decoder feed (so the ring runs dry). A tick every ~10
    // quanta is plenty to watch the depth.
    this.tick = (this.tick || 0) + 1;
    // Only count a dropout once audio has actually been supplied. The graph is
    // built at tap time, well before the first segment is demuxed, so the ring
    // is legitimately empty for the first several seconds - that is silence
    // because there is nothing yet, not a gap in playback.
    if (starved && this.fed) {
      this.underruns++;
      if (this.tick > 8) { this.tick = 0; this.port.postMessage({ starved: 1, underruns: this.underruns }); }
    } else if (this.tick >= 8) {
      this.tick = 0;
      this.port.postMessage({ depth: this.avail / sampleRate, rms: this.rms });
    }
    return true;
  }
}
registerProcessor('lofi-ring', LoFiRing);
`;

let ringReady = false;

// Audio unlock. This has to happen INSIDE the tap handler: the AudioContext
// was previously created much later, when the first segment finished demuxing,
// which is a network callback and not a user gesture. Some engines (and strict
// autoplay policies) then leave the context suspended and every sample is
// thrown away - the picture plays and there is no sound at all, with no error
// anywhere. Creating and resuming it during the tap is the fix.
async function unlockAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!S.actx) S.actx = new AC();
  if (S.actx.state === 'suspended') { try { await S.actx.resume(); } catch (e) {} }
  // Some engines only fully unlock on a real source, so nudge it with a single
  // silent sample before anything is decoded.
  try {
    const b = S.actx.createBuffer(1, 1, 44100);
    const s = S.actx.createBufferSource();
    s.buffer = b; s.connect(S.actx.destination); s.start(0);
  } catch (e) {}
  if (!S.ring && !S.sproc) buildRing();
}

// A tone through the same output chain. If this is silent, audio is not
// reaching the speakers at all and the problem is the environment, not the
// decode path - which is otherwise indistinguishable from a quiet source.
function playTone() {
  if (!S.actx) { S.ctxNote = 'no context'; return; }
  if (S.actx.state === 'suspended') S.actx.resume().catch(() => {});
  const t = S.actx.currentTime;
  const o = S.actx.createOscillator();
  o.frequency.value = 1000;
  const g = S.actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
  g.gain.setValueAtTime(0.25, t + 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g);
  g.connect(S.actx.destination);
  o.start(t); o.stop(t + 0.55);
  S.ctxNote = 'tone played';
}

function setupAudio(track) {
  try {
    if (!S.actx) S.actx = new (window.AudioContext || window.webkitAudioContext)();
    if (S.actx.state === 'suspended') S.actx.resume().catch(() => {});
    const entry = track.mdia.minf.stbl.stsd.entries[0];
    S.aDesc = ascFromEsds(entry && entry.esds);
    const codec = 'mp4a.40.2';
    S.adec = new AudioDecoder({
      output: (data) => { queueAudio(data); data.close(); },
      error: (e) => { S.adec = null; },
    });
    const cfg = { codec, sampleRate: 48000, numberOfChannels: 2 };
    if (S.aDesc) cfg.description = S.aDesc;
    S.adec.configure(cfg);
    buildRing();
  } catch (e) { S.adec = null; }
}

// The worklet is inlined as a Blob so the page stays a single file.
// Idempotent: it is reached both from the tap (unlockAudio) and from
// setupAudio once the decoder appears. Running it twice builds a SECOND node
// which also connects to the destination - an orphan that never receives
// samples but still renders, and doubles the graph's pull rate.
//
// addModule() is not guaranteed to work: a blob: URL can be refused, and if it
// is, the old .catch() silently left the page with a perfect picture and no
// sound at all. So the failure is recorded and shown, and there are two
// fallbacks: a data: URL, then a ScriptProcessorNode, which needs no module
// loading and therefore cannot fail this way.
function buildRing() {
  if (S.ringPending || S.ring || S.sproc) return;
  const ctx = S.actx;
  S.ringPending = true;
  const src = RING_WORKLET;
  const urls = [
    URL.createObjectURL(new Blob([src], { type: 'application/javascript' })),
    'data:application/javascript;base64,' + btoa(src),
  ];
  const tryUrl = (i) => {
    if (i >= urls.length) { useScriptProcessor(); return; }
    ctx.audioWorklet.addModule(urls[i]).then(() => {
      S.ringPending = false;
      wireWorklet();
    }).catch((e) => {
      S.modErr = (S.modErr || '') + ' [' + (i ? 'data' : 'blob') + ': ' + (e && e.message) + ']';
      tryUrl(i + 1);
    });
  };
  tryUrl(0);

  function wireWorklet() {
    S.ring = new AudioWorkletNode(ctx, 'lofi-ring', {
      numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
      processorOptions: { capacity: ctx.sampleRate * 8 },
    });
    S.ring.port.onmessage = (e) => {
      const d = e.data || {};
      if (typeof d.depth === 'number') S.aQueue = d.depth;
      if (typeof d.rms === 'number') S.aRms = d.rms;
      if (d.starved) S.aUnderruns = d.underruns;
    };
    finishChain();
    S.audioPath = 'AudioWorklet';
  }

  // Last resort: the same ring, pulled by a ScriptProcessorNode. Deprecated,
  // but it is a built-in node type - no module loading, no blob URL, so it
  // cannot be blocked by the same policy.
  function useScriptProcessor() {
    S.ringPending = false;
    try {
      const sp = ctx.createScriptProcessor(2048, 1, 2);
      const cap = ctx.sampleRate * 8;
      const ch = [new Float32Array(cap), new Float32Array(cap)];
      let w = 0, r = 0, avail = 0, fed = false, under = 0;
      sp.onaudioprocess = (ev) => {
        const out = ev.outputBuffer;
        const n = out.length;
        let starved = false, sum = 0, cnt = 0;
        for (let i = 0; i < n; i++) {
          let l = 0, rr = 0;
          if (avail > 0) { l = ch[0][r]; rr = ch[1][r]; r = (r + 1) % cap; avail--; }
          else starved = true;
          out.getChannelData(0)[i] = l;
          if (out.numberOfChannels > 1) out.getChannelData(1)[i] = rr;
          sum += l * l; cnt++;
        }
        if (cnt) S.aOutRms = Math.sqrt(sum / cnt);
        if (starved && fed) { under++; S.aUnderruns = under; }
        S.aQueue = avail / ctx.sampleRate;
      };
      S.pushAudio = (planes) => {
        const n = planes[0].length;
        if (avail + n > cap) {
          const room = Math.max(0, cap - avail);
          for (let i = 0; i < room; i++) {
            ch[0][w] = planes[0][i]; ch[1][w] = planes[1][i]; w = (w + 1) % cap;
          }
          avail += room;
          return;
        }
        for (let i = 0; i < n; i++) {
          ch[0][w] = planes[0][i]; ch[1][w] = planes[1][i]; w = (w + 1) % cap;
        }
        avail += n; fed = true;
      };
      S.sproc = sp;
      finishChain();
      S.audioPath = 'ScriptProcessor (fallback)';
    } catch (e) {
      S.audioPath = 'unavailable';
      S.modErr = (S.modErr || '') + ' [sproc: ' + e.message + ']';
      S.ringPending = false;
    }
  }

  function finishChain() {
    const node = S.ring || S.sproc;
    if (!node) return;
    S.gain = ctx.createGain();
    S.gain.gain.value = SRC.gain;
    S.limiter = ctx.createDynamicsCompressor();
    S.limiter.threshold.value = -6;
    S.limiter.knee.value = 6;
    S.limiter.ratio.value = 12;
    S.limiter.attack.value = 0.003;
    S.limiter.release.value = 0.25;
    node.connect(S.gain);
    S.gain.connect(S.limiter);
    // An analyser AFTER the gain stage, so the level reported is the level
    // actually leaving the graph. Reading it inside the worklet instead would
    // measure the pre-gain signal and say nothing about audibility.
    S.analyser = ctx.createAnalyser();
    S.analyser.fftSize = 2048;
    S.aBuf = new Float32Array(S.analyser.fftSize);
    S.limiter.connect(S.analyser);
    S.analyser.connect(ctx.destination);
    ringReady = true;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }
}

// esds -> AudioSpecificConfig (2 bytes for AAC-LC 48k stereo is enough here)
function ascFromEsds(esds) {
  try {
    const dsi = esds && (esds.ES_Descriptor || esds.esd) &&
      (esds.ES_Descriptor.decSpecificInfo || (esds.esd && esds.esd.decSpecificInfo));
    if (dsi && dsi.length >= 2) return new Uint8Array(dsi);
  } catch (e) { /* fall through to the default */ }
  return new Uint8Array([0x11, 0x90]);   // AAC-LC, 48kHz, stereo
}

// Pour one decoded AAC frame into the ring buffer. No scheduling, no node
// allocation, no seams: the worklet is already pulling at the right rate.
function queueAudio(data) {
  if (!S.ring && !S.sproc) return;
  const n = data.numberOfFrames;
  const planes = [new Float32Array(n), new Float32Array(n)];
  for (let c = 0; c < 2; c++) {
    const src = Math.min(c, data.numberOfChannels - 1);
    data.copyTo(planes[c], { planeIndex: src, format: 'f32-planar' });
  }
  if (S.pushAudio) S.pushAudio(planes);
  else S.ring.port.postMessage(planes);
  S.aFrames++;
  S.aSeconds += n / (data.sampleRate || 48000);
  // Level of the DECODED samples, measured before the ring. If this is near
  // zero the decoder is producing silence and the problem is upstream of
  // playback; if it is healthy, the fault is in the output path.
  let sum = 0, peak = 0;
  for (let c = 0; c < 2; c++) {
    const pl = planes[c];
    for (let i = 0; i < n; i++) { const v = pl[i]; sum += v * v; if (Math.abs(v) > peak) peak = Math.abs(v); }
  }
  const rms = Math.sqrt(sum / (2 * n));
  S.aSrcRms = S.aSrcRms ? S.aSrcRms * 0.9 + rms * 0.1 : rms;
  S.aSrcPeak = Math.max(S.aSrcPeak || 0, peak);
  if (!S.aHead) S.aHead = Array.from(planes[0].slice(0, 24)).map((v) => +v.toFixed(5));
}

// ---------------------------------------------------------------------------
// Segment pump
//
// The live window slides: old segments fall off the front of the playlist as
// new ones appear, so position is tracked by URL, never by index. And the
// download is paced to the segment's own duration - decode runs far faster
// than real time, so an unpaced loop chews through the whole window in
// seconds and re-downloads the same segments forever.
// ---------------------------------------------------------------------------
function reanchor() {
  const i = S.segs.findIndex((s) => s.url === S.lastUrl);
  // -1 means our last segment has already slid out of the window.
  S.cursor = i >= 0 ? i + 1 : Math.max(0, S.segs.length - 2);
}

async function pump() {
  if (S.fetching) return;
  S.fetching = true;
  try {
    while (S.started) {
      if (S.cursor >= S.segs.length) {
        try { await loadPlaylist(); reanchor(); }
        catch (e) { setError('playlist: ' + e.message); await sleep(1500); continue; }
        if (S.cursor >= S.segs.length) { await sleep(600); continue; }  // edge not advanced yet
      }
      // Pace by BUFFER DEPTH, not by a fixed clock. Fetching one segment per
      // segment-duration means media arrives exactly when it is needed, so the
      // audio ring sits at zero and every hiccup becomes a dropout - measured
      // at 10.9s of audio decoded per 12.5s of wall clock. Instead, keep a real
      // cushion of already-downloaded media ahead of playback and let the
      // download idle whenever the buffer is deep enough.
      while (S.started && buffered() > BUFFER_TARGET_S) {
        await sleep(200);
      }

      const seg = S.segs[S.cursor];
      if (!seg) break;
      S.cursor++;
      S.lastUrl = seg.url;
      S.segLag = Math.max(0, S.segs.length - S.cursor);
      try {
        const abs = new URL(seg.url, S.base).href;
        const r = await fetch(abs, { cache: 'no-store' });
        if (!r.ok) throw new Error('segment HTTP ' + r.status);
        const buf = new Uint8Array(await r.arrayBuffer());
        S.segsFetched++;
        S.segBytes += buf.byteLength;
        if (S.fetchLog.length < 40) S.fetchLog.push({ t: Date.now(), dur: seg.dur,
          buffered: +buffered().toFixed(1) });
        S.tm.push(buf);
        // push() only feeds the parser. flush() is what tells mux.js the
        // segment ended, and that is what makes it remux and emit 'data' -
        // without it the transmuxer just buffers and nothing ever comes out.
        S.tm.flush();
      } catch (e) {
        setError('segment: ' + e.message);
        await sleep(500);
      }
    }
  } finally {
    S.fetching = false;
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------------------------------------------------------------------------
// Canvas paint gate: newest decoded frame, capped fps
// ---------------------------------------------------------------------------
function paintLoop(now) {
  requestAnimationFrame(paintLoop);
  // Date.now(), not the rAF timestamp: the rAF clock is performance.now()-based
  // and lives in a completely different range from the wall clock the media
  // due-times are built on, so comparing them makes nothing ever look due.
  feedDecoders(Date.now());
}

// Painting is driven by a timer aimed at each frame's own due time, not by
// rAF. rAF only fires about every 16.7ms, so a 25fps source (a frame every
// 40ms) is always caught at the NEXT rAF after it comes due - a fixed ~10ms
// late, every frame, forever. That is not judder you can filter out later; it
// is a 20fps picture no matter what the source says. Aiming a timeout at the
// due time hits the real cadence.
function schedulePaint() {
  if (S.paintTimer || !S.started) return;
  if (!S.fq.length) {
    S.paintTimer = setTimeout(function () { S.paintTimer = null; schedulePaint(); }, 10);
    return;
  }
  const wait = Math.max(0, S.fq[0].due - Date.now());
  S.paintTimer = setTimeout(function () {
    S.paintTimer = null;
    paintOne();
    schedulePaint();
  }, wait);
}

function paintOne() {
  if (!S.fq.length) return;
  const wall = Date.now();
  // Oldest DUE frame, first-in-first-out. Taking the newest discards everything
  // queued before it, which is a silent drop: the decoder runs a few frames
  // ahead, so a burst would collapse several frames into one and the picture
  // would show only some of what was decoded.
  if (S.fq[0].due && S.fq[0].due > wall) return;         // not due yet
  const box = S.fq.shift();
  const frame = box.frame;
  const w = frame.displayWidth || frame.codedWidth;
  const h = frame.displayHeight || frame.codedHeight;
  if (w && h && (w !== pan.width || h !== pan.height)) {
    pan.width = w; pan.height = h;
    S.width = w; S.height = h;
  }
  const ctx = pan.getContext('2d', { alpha: false });
  ctx.drawImage(frame, 0, 0, pan.width, pan.height);
  frame.close();
  S.drawn++;
  S.lastPaintT = wall;
  S.gaps.push(wall - (S.lastPaintGap || wall));
  S.lastPaintGap = wall;
}
function updateFps(now) {
  if (!S._fpsMark) { S._fpsMark = now; S._lastDec = 0; S._lastPaint = 0; return; }
  const dt = (now - S._fpsMark) / 1000;
  if (dt < 0.4) return;   // 0.4, not 0.5: a 500ms timer often lands just under
  S.decFps = (S.frames - S._lastDec) / dt;
  S.paintFps = (S.drawn - S._lastPaint) / dt;
  S._lastDec = S.frames; S._lastPaint = S.drawn;
  S._fpsMark = now;
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
async function start() {
  const miss = libs();
  if (miss.length) { setError('missing: ' + miss.join(', ')); S.stage = 'unsupported'; return; }

  S.stage = 'playlist';
  S.t0 = Date.now();
  try {
    await loadPlaylist();
    // Join several segments back from the edge. Combined with the buffer-depth
    // pacing, this is what lets the page build a cushion before playback has to
    // rely on it - starting at the very edge leaves nothing to absorb a hiccup.
    S.cursor = Math.max(0, S.segs.length - 6);
  } catch (e) {
    setError('playlist: ' + e.message);
    S.stage = 'error';
    return;
  }

  S.stage = 'demux';
  S.mbox = MP4Box.createFile();
  S.tm = new muxjs.mp4.Transmuxer({ keepOriginalTimestamps: false });
  // mux.js 6 is an EventEmitter and hands over one event per remuxed segment:
  //   event.initSegment - ftyp+moov, emitted when the track layout appears
  //   event.data        - the moof+mdat media segments
  // It fires at a SEGMENT BOUNDARY, so segment N's fMP4 only appears once N+1
  // has been pushed. Fine for live, where the next segment always follows, but
  // it is why a single push() produces nothing.
  S.tm.on('data', (event) => {
    S.tmEvents++;
    // The init segment (ftyp+moov) is only fed once. mux.js repeats it on
    // every event, and handing mp4box a second moov makes it rebuild its
    // sample tables against truns it has not seen - appendBuffer then throws
    // inside updateSampleLists and the whole pipeline stops.
    if (event.initSegment && !S.initFed) { S.inits++; S.initFed = true; feedMp4(new Uint8Array(event.initSegment)); }
    if (event.data) { S.medias++; feedMp4(new Uint8Array(event.data)); }
  });

  S.vdec = new VideoDecoder({
    output: (frame) => {
      S.frames++;
      // A short queue, not a single slot. The decoder runs a little ahead of
      // the wall clock, so the NEWEST frame is always a few ms in the future;
      // keeping only that one meant every paint check found "not due yet", a
      // newer frame replaced it, and nothing was ever shown. Holding a few
      // lets an already-due frame through.
      const sec = (frame.timestamp || 0) / 1e6;
      const due = S.vT0 >= 0 ? S.vT0 + sec * 1000 : 0;
      // Learn the source's real frame interval from the timestamps. A fixed cap
      // instead (say 30fps) against a 25fps source sets up a beat: the gate
      // reopens before the next frame is due, so every frame is shown late by a
      // different amount and the picture judders at a steady 50ms.
      if (S.lastFrameDue >= 0 && due > S.lastFrameDue) {
        const d = due - S.lastFrameDue;
        S.frameIv = S.frameIv ? S.frameIv * 0.9 + d * 0.1 : d;
      }
      S.lastFrameDue = due;
      S.fq.push({ frame, due });
      // The cap has to exceed the decoder's lookahead, or the overflow throws
      // away the frames that were due NEXT and the picture skips. With a 250ms
      // lead at 25fps that is ~7 frames, so hold comfortably more than that.
      while (S.fq.length > 12) { S.fq.shift().frame.close(); S.drops++; }
    },
    error: (e) => { setError('video decoder: ' + e.message); S.stage = 'error'; },
  });

  S.started = true;
  S.stage = 'live';
  setInterval(() => updateFps(Date.now()), 500);
  requestAnimationFrame(paintLoop);
  schedulePaint();
  pump();
  stats();
  setInterval(stats, 500);
}

overlay.addEventListener('click', async () => {
  overlay.classList.add('gone');
  await unlockAudio();     // must be inside the gesture
  start();
}, { once: true });

// If the engine suspends the context later (page backgrounded, tab switched),
// the next tap anywhere brings it back.
wrap.addEventListener('pointerdown', () => {
  if (S.actx && S.actx.state === 'suspended') S.actx.resume().catch(() => {});
}, true);

document.getElementById('btnTone').addEventListener('click', playTone);
document.getElementById('btnLive').addEventListener('click', () => {
  // Re-anchor on the live edge.
  S.lastUrl = null;
  S.cursor = S.segs.length;
  S.mediaEnd = 0;
  S.fq.forEach((f) => f.frame.close()); S.fq.length = 0;
});
document.getElementById('btnStats').addEventListener('click', () => {
  S.stats = !S.stats;
  statsEl.classList.toggle('hidden', !S.stats);
});

// ---------------------------------------------------------------------------
// Diagnostics
// ---------------------------------------------------------------------------
// Linear RMS -> dBFS, which is how broadcast levels are actually judged.
function dbfs(rms) {
  if (!rms || rms <= 0) return '-inf';
  const db = 20 * Math.log10(rms);
  return (db > 0 ? '+' : '') + db.toFixed(1) + ' dB';
}

// Level actually leaving the graph, measured after the gain and limiter.
function outRms() {
  if (!S.analyser || !S.aBuf) return 0;
  S.analyser.getFloatTimeDomainData(S.aBuf);
  let sum = 0;
  for (let i = 0; i < S.aBuf.length; i++) sum += S.aBuf[i] * S.aBuf[i];
  const r = Math.sqrt(sum / S.aBuf.length);
  S.aOutRms = S.aOutRms ? S.aOutRms * 0.8 + r * 0.2 : r;
  return S.aOutRms;
}

function stats() {
  if (!S.stats) return;
  const st = S.vdec ? S.vdec.state : '-';
  const queue = S.vdec && S.vdec.decodeQueueSize != null ? S.vdec.decodeQueueSize : 0;
  const cls = (v, good, warn) => v <= good ? 'ok' : (v <= warn ? 'mid' : 'bad');
  const el = (k, v, c) => '<div><span class="k">' + k + '</span> ' + (c ? '<span class="' + c + '">' + v + '</span>' : '<b>' + v + '</b>') + '</div>';
  const secs = S.segBytes ? (S.segBytes / 1048576).toFixed(1) : '0';
  const mbps = S.segsFetched ? ((S.segBytes * 8 / 1048576) / ((Date.now() - S.t0) / 1000)).toFixed(2) : '0';

  statsEl.innerHTML =
    '<div><b>starlite TS</b></div>' +
    el('stage', S.stage) +
    '<div class="sep"></div>' +
    el('codec', S.codec) +
    el('size', S.width ? S.width + 'x' + S.height : '-') +
    el('decoder', st, st === 'configured' ? 'ok' : 'bad') +
    el('queue', queue, queue > 30 ? 'bad' : (queue > 12 ? 'mid' : 'ok')) +
    '<div class="sep"></div>' +
    el('decode', S.decFps.toFixed(1) + ' fps', cls(S.decFps, 26, 15)) +
    el('paint', S.paintFps.toFixed(1) + ' fps', cls(S.paintFps, SRC.fps * 0.9, SRC.fps * 0.5)) +
    el('cap', SRC.fps + ' fps') +
    el('frames', S.drawn) +
    '<div class="sep"></div>' +
    el('segments', S.segsFetched) +
    el('edge lag', S.segLag + ' seg') +
    // Name the ACTUAL output path. "configured / silent" was the old wording,
    // and it hid the reason: a refused AudioWorklet module left the page
    // looking fine while producing nothing. Now the path is named outright and
    // any module-loading error is printed next to it.
    el('path', S.audioPath || 'not built', S.audioPath ? (S.audioPath.indexOf('fallback') > -1 ? 'mid' : 'ok') : 'bad') +
    (S.modErr ? el('module', S.modErr, 'bad') : '') +
    // The context state is the single most useful thing to see when sound is
    // missing: a suspended context plays a perfect picture in total silence.
    el('context', S.actx ? S.actx.state : 'none', S.actx && S.actx.state === 'running' ? 'ok' : 'bad') +
    el('decoder', S.adec ? S.adec.state : 'off', S.adec ? 'ok' : 'mid') +
    el('played', S.aSeconds.toFixed(1) + 's / ' + S.aFrames + ' buf') +
    el('ring', S.aQueue.toFixed(2) + 's' + (S.aUnderruns ? '  ' + S.aUnderruns + ' under' : ''),
       S.aUnderruns ? 'mid' : 'ok') +
    el('gain', SRC.gain.toFixed(1) + 'x' + (S.gain ? '' : ' (off)'), S.gain ? 'ok' : 'mid') +
    el('level', dbfs(S.aSrcRms) + ' in / ' + dbfs(outRms()) + ' out',
       outRms() > 0.03 ? 'ok' : 'bad') +
    '<div class="sep"></div>' +
    el('down', secs + ' MB @ ' + mbps + ' Mb/s');
}
if (!SRC.stats) statsEl.classList.add('hidden');
</script>
</body>
