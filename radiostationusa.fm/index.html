<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="unsafe-url">
<title>CNBC Audio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin: 0; background: #0a0a0c; color: #e8e8ec;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(1200px 600px at 50% -10%, #1a1f24, #0a0a0c 60%); }
  #card { position: relative; z-index: 1; text-align: center; padding: 32px; zoom: 1.69; }
  h1 {
    margin: 12px 0; font-size: 28px; font-weight: 700; letter-spacing: .5px;
    cursor: pointer; user-select: none; transition: color .25s; position: relative; z-index: 2;
  }
  h1:hover { color: #2E9BFF; }
  #status { margin: 0; color: #9a9aa2; font-size: 14px; min-height: 20px; cursor: pointer; user-select: none; transition: color .25s; position: relative; z-index: 2; }
  #status:hover { color: #2E9BFF; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #err { margin-top: 18px; color: #f66; font-size: 12px; white-space: pre-wrap; min-height: 16px; }
  #np { margin-top: 12px; display: none; text-align: center; }
  #np.on { display: block; animation: fadein .5s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  #art {
    display: block; margin: 0 auto; width: 96px; height: 96px; border-radius: 16px; object-fit: cover;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    cursor: pointer; user-select: none;
    transition: border-color .25s;
  }
  #art:hover { border-color: #2E9BFF; }
  #cut { margin: 0 auto 12px; color: #9a9aa2; font-size: 14px; max-width: 260px; }
  #vis {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 330px; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity .5s;
  }
  #vis.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div id="np">
      <img id="art" alt="">
    </div>
    <h1 id="title">CNBC Audio</h1>
    <div id="cut"></div>
    <p id="status">Loading&hellip;</p>
    <div id="err"></div>
  </div>
  <canvas id="vis"></canvas>
  <video id="video" controls muted playsinline preload="auto"></video>
</div>
<script>
  const video = document.getElementById('video');
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const artEl = document.getElementById('art');
  const errBox = document.getElementById('err');
  const vis = document.getElementById('vis');
  const ctx = vis.getContext('2d');
  let VW = 420, VH = 150;
  let PERIOD = 96, baseAmp = 40;
  let midY = 75, hist = null, pen = 0, period = PERIOD, amp = baseAmp;
  let raf = 0;
  const src = 'https://vofile.ru/usa/CNBC/playlist.m3u8';
  let started = false;

  let N = 52, BW = 6, GAP = 3;
  let levels = new Float32Array(N);
  let vel = new Float32Array(N);
  let tgt = new Float32Array(N);
  function rebuildBars() {
    N = Math.min(140, Math.max(36, Math.round(VW / 24)));
    GAP = VW > 1600 ? 8 : VW > 1000 ? 6 : 4;
    BW = (VW - (N - 1) * GAP) / N;
    levels = new Float32Array(N);
    vel = new Float32Array(N);
    tgt = new Float32Array(N);
  }

  function rebuild() {
    midY = VH / 2;
    hist = new Float32Array(VW + 1);
    for (let i = 0; i <= VW; i++) hist[i] = midY;
    PERIOD = Math.max(48, VW / 4.4);
    baseAmp = VH * 0.27;
    period = PERIOD;
    amp = baseAmp;
    pen = 0;
    rebuildBars();
  }

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = vis.getBoundingClientRect();
    VW = Math.max(1, Math.round(r.width));
    VH = Math.max(1, Math.round(r.height));
    vis.width = VW * dpr;
    vis.height = VH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuild();
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function refresh() { location.reload(); }

  function setError(msg) { errBox.textContent = 'Error: ' + msg; }
  function setLive() {}
  function setStatus(t) { status.textContent = t; }

  function autoReload() {
    let n = parseInt(sessionStorage.getItem('cnbcAutoReload') || '0', 10);
    if (n >= 100) {
      sessionStorage.removeItem('cnbcAutoReload');
      setStatus('Stuck - click "CNBC Audio" to reload');
      return;
    }
    n++;
    sessionStorage.setItem('cnbcAutoReload', String(n));
    setStatus('Stuck - reloading\u2026');
    setTimeout(refresh, 600);
  }

  let lastTime = -1;
  let stuck = 0;
  setInterval(() => {
    if (!started || video.paused || video.ended) { stuck = 0; lastTime = video.currentTime; return; }
    if (video.currentTime === lastTime) {
      stuck++;
      if (stuck >= 2) { stuck = 0; autoReload(); }
    } else {
      stuck = 0;
      lastTime = video.currentTime;
    }
  }, 500);

  let audioCtx = null, analyser = null, dataArray = null;

  function ensureCtx() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }

  let wireTries = 0;
  function wireAnalyser() {
    if (analyser || !audioCtx || !started) return;
    try {
      let srcNode = null;
      if (video.captureStream) {
        const stream = video.captureStream();
        if (!stream.getAudioTracks().length) {
          if (wireTries++ < 12) setTimeout(wireAnalyser, 300);
          return;
        }
        srcNode = audioCtx.createMediaStreamSource(stream);
      } else {
        srcNode = audioCtx.createMediaElementSource(video);
        srcNode.connect(audioCtx.destination);
      }
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.82;
      srcNode.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) {
      analyser = null;
    }
  }

  let phase = 0, synthStart = 0, synthetic = false;

  function synthTarget(i, t) {
    const base = 0.18 + 0.35 * Math.abs(Math.sin(t * 1.4 + i * 0.6));
    const wob = 0.45 * Math.abs(Math.sin(t * 3.1 + Math.sin(i * 0.9 + t) * 2.2));
    const spike = Math.pow(Math.max(0, Math.sin(t * 0.7 + i * 1.3) - 0.86) / 0.14, 2) * 0.5;
    return Math.min(1, base + wob + spike);
  }

  function drawBar(x, y, w, h) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 4);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function render() {
    raf = requestAnimationFrame(render);
    phase += 0.016;
    const midY = VH / 2;
    ctx.clearRect(0, 0, VW, VH);

    let alive = 0;
    if (analyser && dataArray) {
      analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < dataArray.length; i++) alive += dataArray[i];
      if (alive > 2000) synthetic = false;
      if (alive === 0) {
        if (!synthStart) synthStart = performance.now();
        else if (performance.now() - synthStart > 700) synthetic = true;
      } else {
        synthStart = 0;
      }
    } else {
      synthStart = 0;
      synthetic = true;
    }

    ctx.globalAlpha = 0.85;
    for (let i = 0; i < N; i++) {
      if (analyser && dataArray && !synthetic) {
        const idx = Math.floor(Math.pow(i / N, 1.6) * (dataArray.length * 0.75));
        tgt[i] = dataArray[idx] / 255;
      } else {
        tgt[i] = synthTarget(i, phase);
      }
      vel[i] += (tgt[i] - levels[i]) * 0.22;
      vel[i] *= 0.78;
      levels[i] += vel[i];
      const h = Math.max(2, levels[i] * (midY - 10));
      const x = i * (BW + GAP);
      const y = midY - h / 2;
      const grad = ctx.createLinearGradient(0, midY - h, 0, midY + h);
      grad.addColorStop(0, '#1d3a5c');
      grad.addColorStop(0.5, '#12293f');
      grad.addColorStop(1, '#0a1726');
      ctx.fillStyle = grad;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(41,90,140,0.25)';
      drawBar(x, y, BW, h);
      ctx.fillStyle = 'rgba(150,190,230,0.25)';
      ctx.shadowBlur = 0;
      ctx.fillRect(x, y, BW, 2);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(41,90,140,0.08)';
    ctx.fillRect(0, midY - 0.5, VW, 1);
  }

  function startVis() {
    vis.classList.add('on');
    if (!raf) render();
  }
  function stopVis() {
    vis.classList.remove('on');
    cancelAnimationFrame(raf);
    raf = 0;
  }

  function togglePlay() {
    if (!started) {
      started = true;
      ensureCtx();
      video.muted = false;
      video.play()
        .then(() => { setStatus('Live'); startVis(); wireAnalyser(); sessionStorage.setItem('cnbcAutoReload', '0'); })
        .catch(() => { started = false; setStatus('Tap again'); stopVis(); });
    } else {
      refresh();
    }
  }
  title.addEventListener('click', togglePlay);
  status.addEventListener('click', togglePlay);
  artEl.addEventListener('click', togglePlay);
  if (navigator.mediaSession) {
    try {
      navigator.mediaSession.setActionHandler('play', () => { if (video.paused) togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (!video.paused) togglePlay(); });
    } catch (e) {}
  }
  updateMediaSession('CNBC Audio');

  function start() {
    const native = !!(video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl') !== '');
    if (native) {
      video.src = src;
      video.addEventListener('loadedmetadata', () => {
        setLive();
        setStatus('Click to play');
      });
      video.addEventListener('error', () => setError(video.error && video.error.message));
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) { setError(data.type + ': ' + data.details + ' - reloading'); autoReload(); }
      });
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setLive();
        setStatus('Click to play');
      });
      hls.loadSource(src);
      hls.attachMedia(video);
    } else {
      setError('HLS is not supported in this browser');
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    start();
  } else {
    window.addEventListener('DOMContentLoaded', start);
  }

  const CNBC_GUID = '2b6effb8-eb0e-7421-d7bb-d843a9ff3ce1';
  const EPG_URL = 'https://lookaround-cache-prod.streaming.siriusxm.com/playbackservices/v1/live/lookAround';
  const ART_BASE = 'https://imgsrv-sxm-prod-device.streaming.siriusxm.com/';
  const LOGO_KEY = 'if/68/68a5fed8ea323a848dd0014bb8c9ddb3_1782186558.png';
  const np = document.getElementById('np');
  const cutEl = document.getElementById('cut');

  function artUrl(artKey, size) {
    const payload = JSON.stringify({ key: artKey, edits: [{ resize: { width: size, height: size } }] });
    return ART_BASE + btoa(payload);
  }

function updateMediaSession(title_, artist_, album_, artKey, size) {
    if (!(navigator.mediaSession && window.MediaMetadata)) return;
    const meta = { title: title_ };
    if (artist_) meta.artist = artist_;
    if (album_) meta.album = album_;
    if (artKey) meta.artwork = [{ src: artUrl(artKey, size), sizes: size + 'x' + size }];
    navigator.mediaSession.metadata = new MediaMetadata(meta);
  }

  function similar(a, b) {
    a = (a || '').toLowerCase(); b = (b || '').toLowerCase();
    if (a === b) return true;
    const wa = a.split(/\s+/), wb = b.split(/\s+/);
    const min = Math.min(wa.length, wb.length);
    let same = 0;
    while (same < min && wa[same] === wb[same]) same++;
    return same >= Math.min(2, min);
  }

  function renderEpg(cut, show) {
    let showName = (show && show.n) ? show.n : '';
    const cur = cut && !cut.ad ? cut : null;
    if (!showName && cur && cur.a) showName = cur.a;
    const key = (show && show.k && similar(showName, show.n)) ? show.k : LOGO_KEY;
    artEl.src = artUrl(key, 320);
    if (showName) {
      title.textContent = showName;
      document.title = showName + ' \u00b7 CNBC Audio';
    }
    const isBreak = cut && (cut.ad || /station break|advertisement/i.test(cut.n || ''));
    if (isBreak) {
      cutEl.textContent = 'Advertisement';
      cutEl.classList.add('ad');
      artEl.src = artUrl(LOGO_KEY, 320);
      updateMediaSession('Station break', '', '', LOGO_KEY, 640);
    } else if (cut) {
      cutEl.classList.remove('ad');
      cutEl.textContent = (cut.a && !similar(cut.a, showName) ? cut.a + ' \u00b7 ' : '') + (cut.n || '');
      updateMediaSession(cut.n || showName, cut.a || showName, showName, key, 640);
    }
    np.classList.add('on');
  }

  artEl.onerror = () => artEl.src = artUrl(LOGO_KEY, 320);

  function pollEpg() {
    const js = "fetch('" + EPG_URL + "',{mode:'cors'}).then(r=>r.json()).then(d=>{"
      + "var ch=d.channels['" + CNBC_GUID + "'];"
      + "var cuts=(ch&&ch.cuts)||[],shows=(ch&&ch.shows)||[];"
      + "var cut=cuts[cuts.length-1]||null,show=shows[shows.length-1]||null;"
      + "parent.postMessage({m:'epg',ok:true,cut:cut?{n:cut.name,a:cut.artistName,ad:!!cut.isAd}:null,show:show?{n:show.name,k:show.image.url}:null},'*');"
      + "}).catch(e=>parent.postMessage({m:'epg',ok:false,e:String(e)},'*'));";
    const f = document.createElement('iframe');
    f.sandbox = 'allow-scripts';
    f.style.display = 'none';
    f.srcdoc = '<scr' + 'ipt>' + js + '</scr' + 'ipt>';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 30000);
  }

  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.m !== 'epg') return;
    if (d.ok) renderEpg(d.cut, d.show);
    else {
      artEl.src = artUrl(LOGO_KEY, 160);
      updateMediaSession('CNBC Audio', '', '', LOGO_KEY, 640);
    }
  });

  artEl.src = artUrl(LOGO_KEY, 320);
  np.classList.add('on');
  pollEpg();
  setInterval(pollEpg, 60000);
</script>
</body>
</html>
