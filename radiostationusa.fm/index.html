<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="unsafe-url">
<title>CNBC Audio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin: 0; background: #0a0a0c; color: #e8e8ec;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(1200px 600px at 50% -10%, #1a1f24, #0a0a0c 60%); }
  #card { position: relative; z-index: 1; text-align: center; padding: 32px; zoom: 1.3; }
  #dot {
    width: 16px; height: 16px; border-radius: 50%; margin: 0 auto 18px;
    background: #555; box-shadow: 0 0 0 rgba(51,255,110,0); transition: all .3s;
    cursor: pointer; user-select: none; position: relative; z-index: 2;
  }
  #dot.live { background: #33FF6E; box-shadow: 0 0 18px rgba(51,255,110,.8); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(51,255,110,.55); }
    70% { box-shadow: 0 0 0 14px rgba(51,255,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(51,255,110,0); }
  }
  h1 {
    margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: .5px;
    cursor: pointer; user-select: none; transition: color .25s; position: relative; z-index: 2;
  }
  h1:hover { color: #33FF6E; }
  #status { margin: 0; color: #9a9aa2; font-size: 14px; min-height: 20px; cursor: pointer; user-select: none; transition: color .25s; position: relative; z-index: 2; }
  #status:hover { color: #33FF6E; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #err { margin-top: 18px; color: #f66; font-size: 12px; white-space: pre-wrap; min-height: 16px; }
  #vis {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: 330px; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity .5s;
  }
  #vis.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div id="dot"></div>
    <h1 id="title">CNBC Audio</h1>
    <p id="status">Loading&hellip;</p>
    <div id="err"></div>
  </div>
  <canvas id="vis"></canvas>
  <video id="video" controls muted playsinline preload="auto"></video>
</div>
<script>
  const video = document.getElementById('video');
  const dot = document.getElementById('dot');
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const errBox = document.getElementById('err');
  const vis = document.getElementById('vis');
  const ctx = vis.getContext('2d');
  let VW = 420, VH = 150;
  let PERIOD = 96, baseAmp = 40;
  let midY = 75, hist = null, pen = 0, period = PERIOD, amp = baseAmp;
  let raf = 0;
  const src = 'https://vofile.ru/usa/CNBC/playlist.m3u8';
  let started = false;

  let N = 52, BW = 6, GAP = 3;
  let levels = new Float32Array(N);
  let vel = new Float32Array(N);
  let tgt = new Float32Array(N);
  function rebuildBars() {
    N = Math.min(140, Math.max(36, Math.round(VW / 24)));
    GAP = VW > 1600 ? 8 : VW > 1000 ? 6 : 4;
    BW = (VW - (N - 1) * GAP) / N;
    levels = new Float32Array(N);
    vel = new Float32Array(N);
    tgt = new Float32Array(N);
  }

  function rebuild() {
    midY = VH / 2;
    hist = new Float32Array(VW + 1);
    for (let i = 0; i <= VW; i++) hist[i] = midY;
    PERIOD = Math.max(48, VW / 4.4);
    baseAmp = VH * 0.27;
    period = PERIOD;
    amp = baseAmp;
    pen = 0;
    rebuildBars();
  }

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = vis.getBoundingClientRect();
    VW = Math.max(1, Math.round(r.width));
    VH = Math.max(1, Math.round(r.height));
    vis.width = VW * dpr;
    vis.height = VH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuild();
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function refresh() { location.reload(); }
  dot.addEventListener('click', refresh);

  function setError(msg) { errBox.textContent = 'Error: ' + msg; }
  function setLive() { dot.classList.add('live'); }
  function setStatus(t) { status.textContent = t; }

  function autoReload() {
    let n = parseInt(sessionStorage.getItem('cnbcAutoReload') || '0', 10);
    if (n >= 100) {
      sessionStorage.removeItem('cnbcAutoReload');
      setStatus('Stuck - click "CNBC Audio" to reload');
      return;
    }
    n++;
    sessionStorage.setItem('cnbcAutoReload', String(n));
    setStatus('Stuck - reloading\u2026');
    setTimeout(refresh, 600);
  }

  let lastTime = -1;
  let stuck = 0;
  setInterval(() => {
    if (!started || video.paused || video.ended) { stuck = 0; lastTime = video.currentTime; return; }
    if (video.currentTime === lastTime) {
      stuck++;
      if (stuck >= 2) { stuck = 0; autoReload(); }
    } else {
      stuck = 0;
      lastTime = video.currentTime;
    }
  }, 500);

  let audioCtx = null, analyser = null, dataArray = null;

  function ensureCtx() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }

  let wireTries = 0;
  function wireAnalyser() {
    if (analyser || !audioCtx || !started) return;
    try {
      let srcNode = null;
      if (video.captureStream) {
        const stream = video.captureStream();
        if (!stream.getAudioTracks().length) {
          if (wireTries++ < 12) setTimeout(wireAnalyser, 300);
          return;
        }
        srcNode = audioCtx.createMediaStreamSource(stream);
      } else {
        srcNode = audioCtx.createMediaElementSource(video);
        srcNode.connect(audioCtx.destination);
      }
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.82;
      srcNode.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) {
      analyser = null;
    }
  }

  let phase = 0, synthStart = 0, synthetic = false;

  function synthTarget(i, t) {
    const base = 0.18 + 0.35 * Math.abs(Math.sin(t * 1.4 + i * 0.6));
    const wob = 0.45 * Math.abs(Math.sin(t * 3.1 + Math.sin(i * 0.9 + t) * 2.2));
    const spike = Math.pow(Math.max(0, Math.sin(t * 0.7 + i * 1.3) - 0.86) / 0.14, 2) * 0.5;
    return Math.min(1, base + wob + spike);
  }

  function drawBar(x, y, w, h) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 4);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function render() {
    raf = requestAnimationFrame(render);
    phase += 0.016;
    const midY = VH / 2;
    ctx.clearRect(0, 0, VW, VH);

    let alive = 0;
    if (analyser && dataArray) {
      analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < dataArray.length; i++) alive += dataArray[i];
      if (alive > 2000) synthetic = false;
      if (alive === 0) {
        if (!synthStart) synthStart = performance.now();
        else if (performance.now() - synthStart > 700) synthetic = true;
      } else {
        synthStart = 0;
      }
    } else {
      synthStart = 0;
      synthetic = true;
    }

    ctx.globalAlpha = 0.85;
    for (let i = 0; i < N; i++) {
      if (analyser && dataArray && !synthetic) {
        const idx = Math.floor(Math.pow(i / N, 1.6) * (dataArray.length * 0.75));
        tgt[i] = dataArray[idx] / 255;
      } else {
        tgt[i] = synthTarget(i, phase);
      }
      vel[i] += (tgt[i] - levels[i]) * 0.22;
      vel[i] *= 0.78;
      levels[i] += vel[i];
      const h = Math.max(2, levels[i] * (midY - 10));
      const x = i * (BW + GAP);
      const y = midY - h / 2;
      const grad = ctx.createLinearGradient(0, midY - h, 0, midY + h);
      grad.addColorStop(0, '#3a6a4e');
      grad.addColorStop(0.5, '#234a33');
      grad.addColorStop(1, '#122a1d');
      ctx.fillStyle = grad;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(35,74,51,0.25)';
      drawBar(x, y, BW, h);
      ctx.fillStyle = 'rgba(150,200,170,0.25)';
      ctx.shadowBlur = 0;
      ctx.fillRect(x, y, BW, 2);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(35,74,51,0.08)';
    ctx.fillRect(0, midY - 0.5, VW, 1);
  }

  function startVis() {
    vis.classList.add('on');
    if (!raf) render();
  }
  function stopVis() {
    vis.classList.remove('on');
    cancelAnimationFrame(raf);
    raf = 0;
  }

  function togglePlay() {
    if (!started) {
      started = true;
      ensureCtx();
      video.muted = false;
      video.play()
        .then(() => { setStatus('Live'); startVis(); wireAnalyser(); sessionStorage.setItem('cnbcAutoReload', '0'); })
        .catch(() => { started = false; setStatus('Tap again'); stopVis(); });
    } else {
      refresh();
    }
  }
  title.addEventListener('click', togglePlay);
  status.addEventListener('click', togglePlay);

  function start() {
    const native = !!(video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl') !== '');
    if (native) {
      video.src = src;
      video.addEventListener('loadedmetadata', () => {
        setLive();
        setStatus('Click to play');
      });
      video.addEventListener('error', () => setError(video.error && video.error.message));
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) { setError(data.type + ': ' + data.details + ' - reloading'); autoReload(); }
      });
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setLive();
        setStatus('Click to play');
      });
      hls.loadSource(src);
      hls.attachMedia(video);
    } else {
      setError('HLS is not supported in this browser');
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    start();
  } else {
    window.addEventListener('DOMContentLoaded', start);
  }
</script>
</body>
</html>
