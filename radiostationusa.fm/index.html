<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="unsafe-url">
<title>CNBC Radio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin: 0; background: #0a0a0c; color: #e8e8ec;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(1200px 600px at 50% -10%, #1a1f24, #0a0a0c 60%); }
  #card { text-align: center; padding: 32px; }
  #dot {
    width: 16px; height: 16px; border-radius: 50%; margin: 0 auto 18px;
    background: #555; box-shadow: 0 0 0 rgba(51,255,110,0); transition: all .3s;
  }
  #dot.live { background: #33FF6E; box-shadow: 0 0 18px rgba(51,255,110,.8); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(51,255,110,.55); }
    70% { box-shadow: 0 0 0 14px rgba(51,255,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(51,255,110,0); }
  }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: .5px; }
  #status { margin: 0; color: #9a9aa2; font-size: 14px; min-height: 20px; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #err { margin-top: 18px; color: #f66; font-size: 12px; white-space: pre-wrap; min-height: 16px; }
  #pill {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 12px 22px; border-radius: 999px; cursor: pointer; z-index: 30;
    background: #16181d; border: 1px solid #2a2d34; color: #33FF6E;
    font-size: 14px; font-weight: 600; user-select: none;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #pill.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div id="dot"></div>
    <h1>CNBC Radio</h1>
    <p id="status">Starting&hellip;</p>
    <div id="err"></div>
  </div>
  <video id="video" controls muted playsinline preload="auto"></video>
  <div id="pill">Tap to enable sound</div>
</div>
<script>
  const video = document.getElementById('video');
  const dot = document.getElementById('dot');
  const status = document.getElementById('status');
  const errBox = document.getElementById('err');
  const pill = document.getElementById('pill');
  const src = 'https://vofile.ru/usa/CNBC/playlist.m3u8';

  function setError(msg) { errBox.textContent = 'Error: ' + msg; }
  function showPill() { pill.classList.add('show'); }
  function hidePill() { pill.classList.remove('show'); }
  function setLive() { dot.classList.add('live'); status.textContent = 'Live'; }
  function setStatus(t) { status.textContent = t; }

  function tryUnmute() {
    video.muted = false;
    setTimeout(() => {
      if (video.paused) {
        video.play()
          .then(() => { setStatus('Live'); })
          .catch(() => {
            video.muted = true;
            video.play().catch(() => {});
            showPill();
            setStatus('Muted');
          });
      } else {
        setStatus('Live');
      }
    }, 60);
  }

  function tryAutoplay() {
    video.play()
      .then(() => setStatus('Live'))
      .catch(() => {
        video.muted = true;
        video.play().then(() => {
          setStatus('Starting\u2026');
          setTimeout(tryUnmute, 1000);
        }).catch(() => showPill());
      });
  }

  function start() {
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) setError(data.type + ': ' + data.details);
      });
      hls.on(Hls.Events.MANIFEST_PARSED, tryAutoplay);
      hls.on(Hls.Events.MANIFEST_PARSED, setLive);
      hls.loadSource(src);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      video.addEventListener('loadedmetadata', tryAutoplay);
      video.addEventListener('loadedmetadata', setLive);
      video.addEventListener('error', () => setError(video.error && video.error.message));
    } else {
      setError('HLS is not supported in this browser');
    }
  }

  function unlock() {
    video.muted = false;
    video.play().catch(() => {});
  }
  ['pointerdown', 'keydown'].forEach(ev =>
    document.addEventListener(ev, unlock, { once: true, passive: true }));

  pill.addEventListener('click', () => { video.muted = false; video.play().catch(() => {}); hidePill(); });

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    start();
  } else {
    window.addEventListener('DOMContentLoaded', start);
  }
</script>
</body>
</html>
