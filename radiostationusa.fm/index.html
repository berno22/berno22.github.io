<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="unsafe-url">
<title>CNBC Audio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin: 0; background: #0a0a0c; color: #e8e8ec;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(1200px 600px at 50% -10%, #1a1f24, #0a0a0c 60%); }
  #card { text-align: center; padding: 32px; }
  #dot {
    width: 16px; height: 16px; border-radius: 50%; margin: 0 auto 18px;
    background: #555; box-shadow: 0 0 0 rgba(51,255,110,0); transition: all .3s;
    cursor: pointer; user-select: none;
  }
  #dot.live { background: #33FF6E; box-shadow: 0 0 18px rgba(51,255,110,.8); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(51,255,110,.55); }
    70% { box-shadow: 0 0 0 14px rgba(51,255,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(51,255,110,0); }
  }
  h1 {
    margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: .5px;
    cursor: pointer; user-select: none; transition: color .25s;
  }
  h1:hover { color: #33FF6E; }
  #status { margin: 0; color: #9a9aa2; font-size: 14px; min-height: 20px; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #err { margin-top: 18px; color: #f66; font-size: 12px; white-space: pre-wrap; min-height: 16px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div id="dot"></div>
    <h1 id="title">CNBC Audio</h1>
    <p id="status">Loading&hellip;</p>
    <div id="err"></div>
  </div>
  <video id="video" controls muted playsinline preload="auto"></video>
</div>
<script>
  const video = document.getElementById('video');
  const dot = document.getElementById('dot');
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const errBox = document.getElementById('err');
  const src = 'https://vofile.ru/usa/CNBC/playlist.m3u8';
  let started = false;

  function refresh() { location.reload(); }
  dot.addEventListener('click', refresh);

  function setError(msg) { errBox.textContent = 'Error: ' + msg; }
  function setLive() { dot.classList.add('live'); }
  function setStatus(t) { status.textContent = t; }

  title.addEventListener('click', () => {
    if (!started) {
      started = true;
      video.muted = false;
      video.play()
        .then(() => setStatus('Live'))
        .catch(() => { started = false; setStatus('Tap again'); });
    } else {
      refresh();
    }
  });

  function start() {
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) setError(data.type + ': ' + data.details);
      });
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setLive();
        setStatus('Click "CNBC Audio" to play');
      });
      hls.loadSource(src);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      video.addEventListener('loadedmetadata', () => {
        setLive();
        setStatus('Click "CNBC Audio" to play');
      });
      video.addEventListener('error', () => setError(video.error && video.error.message));
    } else {
      setError('HLS is not supported in this browser');
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    start();
  } else {
    window.addEventListener('DOMContentLoaded', start);
  }
</script>
</body>
</html>
