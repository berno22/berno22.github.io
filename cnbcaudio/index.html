<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="referrer" content="unsafe-url">
<title>CNBC Audio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin: 0; background: #f6f6f4; color: #111;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #f6f6f4; overflow-y: auto; box-sizing: border-box; padding-bottom: 60px; }
  #wrap::after { content: ""; height: 32px; }  /* balances #brand so the card stays 30px above dead-center */
  #card { position: relative; z-index: 1; text-align: center; padding: 32px; zoom: 1.69;
          margin: auto;
          background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 20px;
          box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
  h1 {
    margin: 12px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.2px; color: #62666a;
    cursor: pointer; user-select: none; transition: color .25s; position: relative; z-index: 2;
  }
  h1:hover { color: #2f3236; }
  #status { display: none; }
  #status:hover { color: #2f3236; }
  video, #lofi { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #err { margin: 12px auto 0; color: #e82127; font-size: 12px; white-space: pre-wrap; }
  #err:empty { display: none; }
  #np { display: none; text-align: center; }
  #np.on { display: block; animation: fadein .5s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  #art {
    display: block; margin: 0 auto; height: 173px; width: auto; max-width: 600px; border-radius: 12px; object-fit: contain;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    cursor: pointer; user-select: none; outline: none; -webkit-tap-highlight-color: transparent;
    transition: border-color .25s;
  }
  #art:hover { border-color: rgba(0,0,0,0.08); }
  #brand { position: relative; z-index: 2; width: 132px; aspect-ratio: 900 / 506;
          margin: 16px 0 2px; pointer-events: none;
          background: #a3a6aa;
          -webkit-mask-image: url('cnbc-logo.png'); -webkit-mask-size: contain;
          -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
          mask-image: url('cnbc-logo.png'); mask-size: contain;
          mask-repeat: no-repeat; mask-position: center; }
  #cut { margin: 12px auto 0; color: #5c5e62; font-size: 14px; max-width: 320px; }
  #cut:empty { display: none; }
  #cut.ad { font-style: italic; }
  #credits { margin: 12px auto 0; color: #83878c; font-size: 12px; line-height: 1.45; max-width: 360px; }
  #credits:empty { display: none; }
  #desc { margin: 12px auto 0; color: #83878c; font-size: 12px; line-height: 1.45; max-width: 360px; }
  #desc:empty { display: none; }
  #upnext { margin: 12px auto 0; color: #c9ccce; font-size: 12px; line-height: 1.45; max-width: 360px; }
  @media (max-width: 430px) {
    #card { zoom: 1; padding: 20px 12px; }
    #brand { width: 110px; }
    h1 { font-size: 24px; }
    #art { max-width: calc(100vw - 64px); }
    #cut, #credits, #desc, #upnext { max-width: calc(100vw - 64px); }
  }
  @media (min-width: 431px) and (max-width: 790px) {
    #card { zoom: 1; }
  }
  #upnext:empty { display: none; }
  #adctl {
    position: absolute; z-index: 2; left: 50%; top: calc(100% + 30px);
    transform: translateX(-50%); display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 4px; border-radius: 999px;
    background: rgba(140,143,148,0.32); backdrop-filter: blur(6px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    visibility: hidden; opacity: 0; pointer-events: none;
    transition: opacity .25s, visibility .25s;
  }
  #adctl.show { visibility: visible; opacity: 1; pointer-events: auto; }
  .seg {
    appearance: none; border: none; background: none; cursor: pointer;
    color: #a3a6aa; font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .3px; padding: 8px 14px; border-radius: 999px;
    -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s;
  }
  .seg:hover { color: #7c7f83; }
  .seg.on { background: #a3a6aa; color: #fff; }
  #gainctl {
    position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
    z-index: 15; display: flex; align-items: center; gap: 8px;
    padding: 12px 10px; border-radius: 16px;
    background: rgba(255,255,255,0.72); border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 4px 18px rgba(0,0,0,0.08); backdrop-filter: blur(6px);
    user-select: none;
  }
  .gcol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .gdiv { width: 1px; height: 132px; background: rgba(0,0,0,0.10); }
  #gainpct, #lofipct { font: 700 11px/1 ui-monospace, Menlo, monospace; color: #62666a; letter-spacing: .5px; }
  .glabel { font: 600 9px/1 system-ui; letter-spacing: 1.2px; text-transform: uppercase; color: #83878c; }
  #gainslider, #lofislider {
    writing-mode: vertical-lr; direction: rtl;
    -webkit-appearance: slider-vertical; appearance: slider-vertical;
    height: 132px; margin: 0; accent-color: #a3a6aa; cursor: pointer;
  }
  #vis {
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    width: 100%; height: 78vh; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity .5s;
  }
  #vis.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="brand" role="img" aria-label="CNBC"></div>
  <div id="card">
    <p id="status">Loading&hellip;</p>
    <div id="np">
      <img id="art" alt="">
    </div>
    <h1 id="title">CNBC Audio</h1>
    <div id="cut"></div>
    <div id="credits"></div>
    <div id="desc"></div>
    <div id="upnext"></div>
    <div id="err"></div>
    <div id="adctl" role="group" aria-label="Ad break audio">
      <button class="seg" type="button" data-mode="lofi">LoFi</button>
      <button class="seg" type="button" data-mode="mute">Mute</button>
      <button class="seg" type="button" data-mode="ads">Ads</button>
    </div>
  </div>
  <canvas id="vis"></canvas>
  <video id="video" controls muted playsinline preload="auto"></video>
  <audio id="lofi" crossorigin="anonymous" preload="none" playsinline></audio>
  <div id="gainctl">
    <div class="gcol">
      <input id="gainslider" type="range" min="50" max="800" step="5" value="800" aria-label="CNBC volume percent">
      <div id="gainpct">800%</div>
      <div class="glabel">CNBC</div>
    </div>
    <div class="gdiv"></div>
    <div class="gcol">
      <input id="lofislider" type="range" min="0" max="100" step="5" value="40" aria-label="LoFi volume percent">
      <div id="lofipct">40%</div>
      <div class="glabel">LoFi</div>
    </div>
  </div>
</div>
<script>
  const video = document.getElementById('video');
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const artEl = document.getElementById('art');
  const ART_LOGO = 'art/logo.png';
  const LOGO_SIZE = '1024x1024';
  let mediaMeta = null;
  const errBox = document.getElementById('err');
  const adctl = document.getElementById('adctl');
  const segs = Array.from(document.querySelectorAll('#adctl .seg'));
  const lofiEl = document.getElementById('lofi');
  const vis = document.getElementById('vis');
  const ctx = vis.getContext('2d');
  let VW = 420, VH = 150;
  let PERIOD = 96, baseAmp = 40;
  let midY = 75, hist = null, pen = 0, period = PERIOD, amp = baseAmp;
  let raf = 0;
  // Stream URL is never embedded (tokens expire). It is derived on every load:
  // cnbc.html (same origin) -> stable master playlist URL -> master playlist
  // -> current TYPE=AUDIO manifest URL (token included). No stale fallback:
  // if resolution fails, the failure is shown loudly and retried, never
  // silently played from a dead URL.
  const MASTER_FALLBACK = 'https://cnbc.mt.linear.viewlift.com/v1/master/dfe581e0a446a1e548014078b2d81b62b917979d/usanetwork-linear-external-hls-primary-cnbc-v2/Content/Channel/886a397d-ff30-4021-eb16-bb73c658c033/HLS_CLEAR/master_5m.m3u8';
  let src = null;
  let started = false;
  let resolving = false, resolveTimer = 0;

  // --- ad-break state (matched to playback program time, not the live edge) ---
  let hlsInst = null;                 // hls.js instance (null for native/Safari)
  let breakWindows = [];              // [{s, e, brk}] parsed from EXT-X-DATERANGE
  let edgePdt = null;                 // program time of the last segment in the playlist
  let lastSegDur = 0;                 // duration of the last segment (seconds)
  let inAd = false;                   // playback is currently inside a 0x22 break
  let userMuted = true;               // user's own mute preference (normal content)
  let wired = false;                  // analyser wired to the element's audio
  let outNode = null, cnbcGain = null; // Web Audio output path (lets CNBC exceed 100%)
  let userActivated = false;           // a real gesture happened (safe to route Web Audio)
  const CNBC_GAIN = 8.0;   // always 800%
  const AD_TICK = 250;
  const ADV_LOOKBACK = 0;             // extra ms to keep muting past planned end

  // --- car-test gain slider: real-time CNBC boost % (always starts at 800%) ---
  const gainctl = document.getElementById('gainctl');
  const gainslider = document.getElementById('gainslider');
  const gainpct = document.getElementById('gainpct');
  let gainPct = Math.round(CNBC_GAIN * 100);
  gainslider.value = gainPct;
  gainpct.textContent = gainPct + '%';
  gainslider.addEventListener('input', () => {
    const p = parseInt(gainslider.value, 10);
    gainpct.textContent = p + '%';
    if (cnbcGain && cnbcGain.gain) cnbcGain.gain.value = p / 100;
  });

  // --- car-test LoFi slider (always starts at 40%) ---
  const lofislider = document.getElementById('lofislider');
  const lofipct = document.getElementById('lofipct');
  let lofiPct = 40;
  lofislider.value = lofiPct;
  lofipct.textContent = lofiPct + '%';
  lofislider.addEventListener('input', () => {
    const p = parseInt(lofislider.value, 10);
    lofipct.textContent = p + '%';
    lofiEl.volume = p / 100;
  });

  // What to play during an ad break: 'lofi' | 'mute' | 'ads' (cached).
  const BREAK_MODES = ['lofi', 'mute', 'ads'];
  let breakMode = (function () {
    try { const m = localStorage.getItem('cnbcBreakMode'); if (BREAK_MODES.indexOf(m) >= 0) return m; } catch (e) {}
    return 'lofi';
  })();
  const LOFI_STREAMS = [
    'https://radio.loficafe.net/listen/chilling/radio.mp3',
    'https://radio.loficafe.net/listen/sleeping/radio.mp3',
    'https://radio.loficafe.net/listen/working/radio.mp3',
    'https://lofi.stream.laut.fm/lofi'
  ];
  let lofiTry = 0;
  let lofiAnalyser = null, lofiData = null, lofiWired = false, lofiTries = 0;

  function fetchText(url, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 10000);
    return fetch(url, { cache: 'no-store', signal: ctl.signal }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).finally(() => clearTimeout(t));
  }

  async function resolveStreamUrl() {
    const bust = u => u + (u.indexOf('?') < 0 ? '?' : '&') + 'ts=' + Date.now();
    let master = MASTER_FALLBACK;
    try {
      const html = await fetchText(bust('../cnbc.html'));
      const m = html.match(/https:\/\/cnbc\.mt\.linear\.viewlift\.com\/v1\/master\/[A-Za-z0-9_.\-\/]+?\.m3u8/);
      if (!m) throw new Error('master URL not found in cnbc.html');
      master = m[0];
    } catch (e) {
      master = MASTER_FALLBACK; // tokenless + stable, safe to keep hardcoded
    }
    const pl = await fetchText(bust(master));
    const media = pl.match(/EXT-X-MEDIA:[^\n]*TYPE=AUDIO[^\n]*/);
    const a = media && media[0].match(/URI="([^"]*\/7\.m3u8)"/);
    if (!a) throw new Error('audio entry not found in master playlist');
    return new URL(a[1], master).href; // RFC-resolve the ../../.. URI, same as hls.js does
  }

  function boot(fromTap) {
    if (resolving) return;
    resolving = true;
    clearTimeout(resolveTimer);
    resolveStreamUrl().then(url => {
      resolving = false;
      src = url;
      errBox.textContent = '';
      started = true;
      ensureCtx();
      attach(fromTap);
    }).catch(e => {
      resolving = false;
      started = false;
      setError('Could not resolve stream (' + ((e && e.message) || e) + ') - retrying. Tap "CNBC Audio" to retry now.');
      clearTimeout(resolveTimer);
      resolveTimer = setTimeout(() => boot(false), 15000);
    });
  }

  let N = 52, BW = 6, GAP = 3;
  let levels = new Float32Array(N);
  let vel = new Float32Array(N);
  let tgt = new Float32Array(N);
  function rebuildBars() {
    N = Math.min(140, Math.max(36, Math.round(VW / 24)));
    GAP = VW > 1600 ? 8 : VW > 1000 ? 6 : 3;
    const halfW = VW / 2;
    if ((N - 1) * GAP >= halfW) GAP = Math.max(1, Math.round(halfW * 0.12 / N));
    BW = (halfW - (N - 1) * GAP) / N;
    levels = new Float32Array(N);
    vel = new Float32Array(N);
    tgt = new Float32Array(N);
  }

  function rebuild() {
    midY = VH / 2;
    hist = new Float32Array(VW + 1);
    for (let i = 0; i <= VW; i++) hist[i] = midY;
    PERIOD = Math.max(48, VW / 4.4);
    baseAmp = VH * 0.27;
    period = PERIOD;
    amp = baseAmp;
    pen = 0;
    rebuildBars();
  }

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = vis.getBoundingClientRect();
    VW = Math.max(1, Math.round(r.width));
    VH = Math.max(1, Math.round(r.height));
    vis.width = VW * dpr;
    vis.height = VH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuild();
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function refresh() { location.reload(); }

  function setError(msg) { errBox.textContent = 'Error: ' + msg; }
  function setLive() {}
  function setStatus(t) { status.textContent = t; }

  function autoReload() {
    let n = parseInt(sessionStorage.getItem('cnbcAutoReload') || '0', 10);
    if (n >= 100) {
      sessionStorage.removeItem('cnbcAutoReload');
      setStatus('Stuck - click "CNBC Audio" to reload');
      return;
    }
    n++;
    sessionStorage.setItem('cnbcAutoReload', String(n));
    setStatus('Stuck - reloading\u2026');
    setTimeout(refresh, 600);
  }

  let lastTime = -1;
  let stuck = 0;
  let establishedAt = 0;
  setInterval(() => {
    const t = video.currentTime;
    if (!started || video.paused || video.ended) { stuck = 0; lastTime = t; return; }
    if (t === lastTime) {
      if (establishedAt && performance.now() - establishedAt > 6000) {
        stuck++;
        if (stuck >= 6) { stuck = 0; video.play().catch(() => {}); autoReload(); }
      }
    } else {
      stuck = 0;
      lastTime = t;
      if (!establishedAt) establishedAt = performance.now();
    }
  }, 500);

  let audioCtx = null, analyser = null, dataArray = null;

  function ensureCtx() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }

  // Tap the element's own audio for the visualizer via captureStream(). Per spec
  // the capture keeps producing real samples even while the element is muted, so
  // the bars stay live during ad-break muting; the element still plays the sound.
  let wireTries = 0;
  function wireAnalyser() {
    if (wired || !started) return;
    ensureCtx();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    try {
      let srcNode = null;
      if (video.captureStream) {
        const stream = video.captureStream();
        if (!stream.getAudioTracks().length) {
          if (wireTries++ < 12) { setTimeout(wireAnalyser, 300); return; }
          return;
        }
        srcNode = audioCtx.createMediaStreamSource(stream);
      } else {
        if (!outNode) {
          outNode = audioCtx.createMediaElementSource(video);
          if (!cnbcGain) outNode.connect(audioCtx.destination);   // audible before boost
        }
        srcNode = outNode;
      }
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.82;
      srcNode.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      wired = true;
      if (userActivated) enableBoost();
      applyMute();
    } catch (e) {
      analyser = null; wired = false;
    }
  }

  // Route the element through a gain so CNBC can exceed 100%. Enabled only after
  // a real user gesture, so autoplay never ends up routed through a suspended
  // (silent) AudioContext. Idempotent: reuses an existing MediaElementSource
  // (created by the analyser during muted autoplay) instead of failing on it.
  function enableBoost() {
    if (!audioCtx || !userActivated) return;
    if (cnbcGain) return;
    try {
      if (!outNode) outNode = audioCtx.createMediaElementSource(video);
      outNode.disconnect();
      cnbcGain = audioCtx.createGain();
      cnbcGain.gain.value = gainPct / 100;   // slider % -> gain, honoring the car-test value
      // Limiter so the boost gets louder without clipping/distorting peaks.
      const lim = audioCtx.createDynamicsCompressor();
      lim.threshold.value = -2;
      lim.knee.value = 0;
      lim.ratio.value = 20;
      lim.attack.value = 0.003;
      lim.release.value = 0.25;
      outNode.connect(cnbcGain);
      cnbcGain.connect(lim);
      lim.connect(audioCtx.destination);
      if (analyser && !video.captureStream) outNode.connect(analyser);
    } catch (e) {
      outNode = null; cnbcGain = null;
    }
  }

  // A real user gesture happened: unlocks the context now and locks in the boost.
  function markActivated() {
    userActivated = true;
    ensureCtx();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(enableBoost).catch(() => {});
    else enableBoost();
  }
  document.addEventListener('pointerdown', markActivated, { once: true });
  document.addEventListener('keydown', markActivated, { once: true });

  // Tap the lofi <audio> for its own visualizer (CORS is reflected, so this works).
  function wireLofiAnalyser() {
    if (lofiWired || !audioCtx) return;
    try {
      let srcNode = null;
      if (lofiEl.captureStream) {
        const stream = lofiEl.captureStream();
        if (!stream.getAudioTracks().length) {
          if (lofiTries++ < 12) { setTimeout(wireLofiAnalyser, 300); return; }
          return;
        }
        srcNode = audioCtx.createMediaStreamSource(stream);
      } else {
        srcNode = audioCtx.createMediaElementSource(lofiEl);
        srcNode.connect(audioCtx.destination);
      }
      lofiAnalyser = audioCtx.createAnalyser();
      lofiAnalyser.fftSize = 256;
      lofiAnalyser.smoothingTimeConstant = 0.82;
      srcNode.connect(lofiAnalyser);
      lofiData = new Uint8Array(lofiAnalyser.frequencyBinCount);
      lofiWired = true;
    } catch (e) {
      lofiAnalyser = null; lofiWired = false;
    }
  }

  // silence = user mute, or an ad break the user hasn't chosen to hear
  function applyMute() {
    if (inAd) video.muted = breakMode !== 'ads';
    else video.muted = userMuted;
  }

  // Start/stop the lofi stream to match the current break + mode.
  function applyBreakAudio() {
    const want = inAd && breakMode === 'lofi';
    if (want) {
      if (lofiEl.paused) {
        if (!lofiEl.src) lofiEl.src = LOFI_STREAMS[lofiTry];
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        lofiEl.volume = lofiPct / 100;
        lofiEl.play().then(() => {
          wireLofiAnalyser();
        }).catch(() => {
          // No gesture yet / autoplay blocked: stay silent for this break.
          video.muted = true;
        });
      }
    } else if (!lofiEl.paused) {
      lofiEl.pause();
    }
  }

  function fmtTime(sec) {
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60), s = sec % 60;
    return s ? m + 'm' + s + 's' : m + 'm';
  }

  function drawBar(x, y, w, h) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 4);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function render() {
    raf = requestAnimationFrame(render);
    const midY = VH / 2;
    ctx.clearRect(0, 0, VW, VH);

    const lofiActive = inAd && breakMode === 'lofi';
    const a = lofiActive ? lofiAnalyser : analyser;
    const d = lofiActive ? lofiData : dataArray;
    if (a && d) a.getByteFrequencyData(d);

    ctx.globalAlpha = 0.85;
    for (let i = 0; i < N; i++) {
      if (a && d) {
        const idx = Math.floor(Math.pow(i / N, 1.6) * (d.length * 0.75));
        tgt[i] = d[idx] / 255;
      } else {
        tgt[i] = 0;
      }
      vel[i] += (tgt[i] - levels[i]) * 0.22;
      vel[i] *= 0.78;
      levels[i] += vel[i];
      const h = Math.max(2, levels[i] * (midY - 10));
      const y = midY - h / 2;
      const grad = ctx.createLinearGradient(0, midY - h, 0, midY + h);
      grad.addColorStop(0, '#d8d8d8');
      grad.addColorStop(0.5, '#c6c6c6');
      grad.addColorStop(1, '#b3b3b3');
      ctx.fillStyle = grad;
      ctx.shadowBlur = 6;
      ctx.shadowColor = 'rgba(0,0,0,0.12)';
      const xL = i * (BW + GAP);
      const xR = VW - xL - BW;
      drawBar(xL, y, BW, h);
      drawBar(xR, y, BW, h);
      ctx.fillStyle = 'rgba(90,90,90,0.25)';
      ctx.shadowBlur = 0;
      ctx.fillRect(xL, y, BW, 2);
      ctx.fillRect(xR, y, BW, 2);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function startVis() {
    vis.classList.add('on');
    if (!raf) render();
  }
  function stopVis() {
    vis.classList.remove('on');
    cancelAnimationFrame(raf);
    raf = 0;
  }

  let playTries = 0;
  function playWithRetry() {
    if (!started) return;
    if (video.paused === false) { playTries = 0; return; }
    video.play().then(() => {
      playTries = 0;
      setStatus('Live'); startVis();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(() => { enableBoost(); wireAnalyser(); applyMute(); });
      else { enableBoost(); wireAnalyser(); applyMute(); }
      sessionStorage.setItem('cnbcAutoReload', '0');
    }).catch(() => {
      playTries++;
      if (playTries < 15) {
        setTimeout(() => { if (started && video.paused) playWithRetry(); }, 800);
      } else {
        started = false;
        setStatus('Tap to play again');
      }
    });
  }

  function togglePlay() {
    if (!started) {
      ensureCtx();
      boot(true);
    } else if (video.paused === false && inAd) {
      // During a break, audio is controlled only by the LoFi | Mute | Ads selector.
    } else if (video.paused === false && userMuted) {
      userMuted = false;
      video.muted = false;
      ensureCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(() => { enableBoost(); wireAnalyser(); applyMute(); });
      else { enableBoost(); wireAnalyser(); applyMute(); }
      setStatus('Live');
    } else if (video.paused === false) {
      sessionStorage.setItem('cnbcClickReload', '1');
      refresh();
    } else if (userMuted === false) {
      started = true;
      ensureCtx();
      playWithRetry();
    }
  }
  title.addEventListener('click', togglePlay);
  status.addEventListener('click', togglePlay);
  artEl.addEventListener('click', togglePlay);
  if (navigator.mediaSession) {
    try {
      navigator.mediaSession.setActionHandler('play', () => { if (video.paused) togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (!video.paused) togglePlay(); });
    } catch (e) {}
  }
  updateMediaSession('CNBC Audio');

  function setBreakMode(mode) {
    if (BREAK_MODES.indexOf(mode) < 0 || mode === breakMode) return;
    breakMode = mode;
    try { localStorage.setItem('cnbcBreakMode', mode); } catch (e) {}
    syncSegs();
    ensureCtx();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    applyMute();
    applyBreakAudio();
    if (inAd) renderBreak();
  }
  function syncSegs() {
    for (const b of segs) b.classList.toggle('on', b.dataset.mode === breakMode);
  }
  for (const b of segs) {
    b.addEventListener('click', (e) => { e.stopPropagation(); setBreakMode(b.dataset.mode); });
  }
  lofiEl.addEventListener('error', () => {
    if (!inAd || breakMode !== 'lofi' || lofiTry >= LOFI_STREAMS.length - 1) return;
    lofiTry++;
    lofiEl.src = LOFI_STREAMS[lofiTry];
    lofiEl.play().catch(() => {});
  });
  syncSegs();

  function tryAutoplay() {
    if (video.paused === false) {
      started = true; startVis();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(() => wireAnalyser());
      else wireAnalyser();
      return;
    }
    started = true;
    const unmuted = sessionStorage.getItem('cnbcClickReload') === '1';
    sessionStorage.removeItem('cnbcClickReload');
    userMuted = !unmuted;
    video.muted = userMuted;
    video.play().then(() => {
      setStatus(unmuted ? 'Live' : 'Muted - tap to unmute');
      startVis();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(() => { enableBoost(); wireAnalyser(); });
      else { enableBoost(); wireAnalyser(); }
      sessionStorage.setItem('cnbcAutoReload', '0');
    }).catch(() => {
      started = false;
      video.muted = true;
      setStatus('Click to play');
    });
  }

  function playUnmuted() {
    userMuted = false;
    video.muted = false;
    playWithRetry();
  }

  function startHls(waited, fromTap) {
    if (!window.Hls) {
      if ((waited || 0) < 40) setTimeout(() => startHls((waited || 0) + 1, fromTap), 250);
      else setError('HLS is not supported in this browser');
      return;
    }
    if (!Hls.isSupported()) { setError('HLS is not supported in this browser'); return; }
    const hls = new Hls({ enableWorker: true });
    hlsInst = hls;
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) { setError(data.type + ': ' + data.details + ' - reloading'); autoReload(); }
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setLive();
      if (fromTap) playUnmuted(); else tryAutoplay();
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  }

  function attach(fromTap) {
    const native = !!(video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl') !== '');
    if (native) {
      video.src = src;
      const onMeta = () => {
        video.removeEventListener('loadedmetadata', onMeta);
        video.removeEventListener('error', onErr);
        setLive();
        if (fromTap) playUnmuted(); else tryAutoplay();
      };
      const onErr = () => {
        video.removeEventListener('loadedmetadata', onMeta);
        video.removeEventListener('error', onErr);
        startHls(0, fromTap);
      };
      video.addEventListener('loadedmetadata', onMeta);
      video.addEventListener('error', onErr);
    } else {
      startHls(0, fromTap);
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    boot(false);
  } else {
    window.addEventListener('DOMContentLoaded', () => boot(false));
  }

  const GUIDE_URL = 'https://webql-redesign.cnbcfm.com/graphql';
  let artMap = {};
  const np = document.getElementById('np');
  const cutEl = document.getElementById('cut');
  const creditsEl = document.getElementById('credits');
  const descEl = document.getElementById('desc');
  const upNextEl = document.getElementById('upnext');

function sqArt(u) {
    if (!/image\.cnbcfm\.com/.test(u)) return u;
    const i = u.indexOf('?');
    const q = new URLSearchParams(i < 0 ? '' : u.slice(i + 1));
    q.set('w', '640'); q.set('h', '640');
    return (i < 0 ? u : u.slice(0, i)) + '?' + q.toString();
}

  function updateMediaSession(title_, artist_, album_, artSrc) {
    if (!(navigator.mediaSession && window.MediaMetadata)) return;
    const title = title_ || '';
    const artist = artist_ || '';
    const album = album_ || '';
    if (!mediaMeta) {
      mediaMeta = new MediaMetadata({
        title: title,
        artist: artist,
        album: album,
        artwork: [{ src: ART_LOGO, sizes: LOGO_SIZE, type: 'image/png' }]
      });
      navigator.mediaSession.metadata = mediaMeta;
    } else {
      mediaMeta.title = title;
      mediaMeta.artist = artist;
      mediaMeta.album = album;
    }
  }

  let lastAdText = '';
  function breakLeft() {
    const t = playingProgramTime();
    for (const w of breakWindows) {
      if (w.brk && t >= w.s && t < w.e + ADV_LOOKBACK) return Math.max(0, Math.ceil((w.e - t) / 1000));
    }
    return null;
  }
  const BREAK_LABELS = { lofi: 'LoFi', mute: 'Mute', ads: 'Ads' };
  function adText() {
    const left = breakLeft();
    return 'Ad break \u00b7 ' + (left != null ? fmtTime(left) : '--') + ' \u00b7 ' + (BREAK_LABELS[breakMode] || breakMode);
  }
  // Drives both the on-page description and the mini-player / lock-screen metadata.
  function renderAdText() {
    const s = adText();
    if (s === lastAdText) return;
    lastAdText = s;
    cutEl.textContent = s;
    updateMediaSession('CNBC - ' + s, '', '', ART_LOGO);
  }

  function renderBreak() {
    lastAdText = '';
    renderAdText();
    cutEl.classList.add('ad');
    artEl.src = ART_LOGO;
  }

  function renderShow(live) {
    if (!live || !live.title) return;
    lastLive = live;
    title.textContent = live.title;
    document.title = live.title + ' \u00b7 CNBC Audio';
    if (inAd) {
      renderAdText();
      cutEl.classList.add('ad');
    } else {
      cutEl.textContent = '';
      cutEl.classList.remove('ad');
    }
    creditsEl.textContent = fmtCredits(live.credits);
    descEl.textContent = live.description || '';
    const nu = (lastComingUp && lastComingUp[0]) || null;
    const tm = nu && (nu.startTimeFormatted || '').match(/(\d{1,2})(?::(\d\d))?\s*(am|pm)/i);
    const at = tm ? ' at ' + parseInt(tm[1], 10) + (tm[2] && tm[2] !== '00' ? ':' + tm[2] : '') + tm[3][0].toLowerCase() : '';
    upNextEl.textContent = nu ? 'Next' + at + ' | ' + (nu.shortTitle || '') : '';
    const slug = (live.url || '').replace(/\/+$/, '');
    const norm = x => (x || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    const tN = norm(live.shortTitle || live.title), sN = norm(slug);
    const raw = artMap[slug];
    const okRaw = raw && tN && (sN.indexOf(tN) === 0 || tN.indexOf(sN) === 0);
    const localArt = okRaw ? (raw.local || null) : null;
    const splashUrl = (okRaw && raw.url) || null;
    artEl.src = inAd ? ART_LOGO : (splashUrl || ART_LOGO);
    const lockImg = ART_LOGO;
    updateMediaSession(
      'CNBC - ' + (inAd ? adText() : live.title), '',
      live.displayGenre || '',
      ART_LOGO
    );
    np.classList.add('on');
  }

  function fmtCredits(c) {
    if (!c) return '';
    if (typeof c === 'string') return c;
    if (Array.isArray(c)) return c.map(x =>
      typeof x === 'string' ? x
      : [x.name || x.person || x.title, x.role].filter(Boolean).join(' \u2013 ')
    ).filter(Boolean).join(', ');
    if (typeof c === 'object') return c.text || c.summary || '';
    return '';
  }

  let guideBusy = false, pendingGuide = false, guideTimer = null, lastComingUp = null;
  function fetchGuide() {
    if (guideBusy) return;
    guideBusy = true;
    clearTimeout(guideTimer);
    guideTimer = setTimeout(() => { guideBusy = false; maybeGuide(); }, 9000);
    fetch(GUIDE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        operationName: 'showsSchedule',
        variables: { primeTime: false, scheduleDateStart: 0, scheduleDateEnd: 0 },
        query: 'query showsSchedule($primeTime: Boolean, $scheduleDateStart: Int, $scheduleDateEnd: Int) { showsSchedule(primeTime: $primeTime, scheduleDateStart: $scheduleDateStart, scheduleDateEnd: $scheduleDateEnd) { live { episodeGuid title shortTitle url startTimeFormatted endTimeFormatted description displayGenre credits tvSeasonNumber seriesEpisodeNumber } comingUp { shortTitle startTimeFormatted } } }'
      })
    }).then(r => r.json()).then(d => {
      guideBusy = false;
      const g = d.data && d.data.showsSchedule;
      lastComingUp = (g && g.comingUp) || null;
      renderShow(g && g.live);
      if (pendingGuide) { pendingGuide = false; fetchGuide(); }
    }).catch(() => { guideBusy = false; });
  }

  function maybeGuide() {
    if (!guideBusy) { pendingGuide = false; fetchGuide(); }
    else pendingGuide = true;
  }

  artEl.onerror = () => artEl.src = ART_LOGO;

  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.m !== 'pl') return;
    plBusy = false;
    handlePl(d);
  });

  let plBusy = false;
  function pollPlaylist() {
    if (plBusy || !started) return;
    plBusy = true;
    const js = "fetch('" + src + "',{mode:'cors',cache:'no-store'}).then(r=>r.text())"
      + ".then(t=>parent.postMessage({m:'pl',text:t},'*'))"
      + ".catch(e=>parent.postMessage({m:'pl',err:String(e)},'*'));";
    const f = document.createElement('iframe');
    f.sandbox = 'allow-scripts';
    f.style.display = 'none';
    f.srcdoc = '<scr' + 'ipt>' + js + '</scr' + 'ipt>';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 20000);
    setTimeout(() => { plBusy = false; }, 8000);
  }

  let plEp = null;

  function parsePlaylist(t) {
    const pdtMatches = t.match(/#EXT-X-PROGRAM-DATE-TIME:([^\r\n]+)/g) || [];
    let pdt = null;
    for (const line of pdtMatches) {
      const v = Date.parse(line.slice(line.indexOf(':') + 1).trim());
      if (!isNaN(v)) pdt = v;
    }
    const ext = t.match(/#EXTINF:([0-9.]+)/g) || [];
    const segDur = ext.length
      ? parseFloat(ext[ext.length - 1].slice(ext[ext.length - 1].indexOf(':') + 1))
      : 0;

    const ranges = [];
    let ep = null;
    const re = /#EXT-X-DATERANGE:[^\n]*/g;
    let m;
    while ((m = re.exec(t))) {
      const line = m[0];
      const sm = line.match(/START-DATE="([^"]+)"/);
      if (!sm) continue;
      const st = Date.parse(sm[1]);
      if (isNaN(st)) continue;
      const dm = line.match(/PLANNED-DURATION=([0-9.]+)/);
      const dur = dm ? parseFloat(dm[1]) : 0;
      const em = line.match(/END-DATE="([^"]+)"/);
      const en = em ? Date.parse(em[1]) : (dur > 0 ? st + dur * 1000 : null);
      if (en === null) continue;
      const idm = line.match(/ID="([^"]+)"/);
      const brk = !!(idm && /^0x22/.test(idm[1]));   // 0x22 = SCTE-35 Break Start
      ranges.push({ s: st, e: en, brk });
      if (!brk && dur > 900 && ep === null && pdt !== null && pdt >= st && pdt < st + dur * 1000) {
        const hm = line.match(/SCTE35(?:-OUT)?=0x([0-9a-fA-F]+)/);
        if (hm) {
          let s = '';
          const hex = hm[1];
          for (let i = 0; i + 1 < hex.length; i += 2) s += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
          const mm = s.match(/EP[0-9A-Za-z]+/);
          if (mm) ep = mm[0];
        }
      }
    }
    return { pdt, segDur, ranges, ep };
  }

  // Program time of what is actually being heard, not the live edge.
  function playingProgramTime() {
    if (hlsInst && hlsInst.playingDate) return hlsInst.playingDate.getTime();
    if (edgePdt !== null) {
      let lead = 0;
      try {
        const b = video.buffered;
        if (b.length) lead = Math.max(0, b.end(b.length - 1) - video.currentTime);
      } catch (e) {}
      return edgePdt + lastSegDur * 1000 - lead * 1000;
    }
    return Date.now();
  }

  let lastLive = null;
  function handlePl(d) {
    window.__plg = window.__plg || { n: 0 };
    window.__plg.n++;
    if (d.err) { plBusy = false; window.__plg.last = { err: d.err }; return; }
    const p = parsePlaylist(d.text || '');
    breakWindows = p.ranges;
    edgePdt = p.pdt;
    lastSegDur = p.segDur;
    const epChanged = p.ep && plEp !== null && p.ep !== plEp;
    if (p.ep) plEp = p.ep;
    window.__plg.last = { windows: breakWindows.length, inAd: inAd };
    if (epChanged) maybeGuide();
    plBusy = false;
  }

  function tickAd() {
    const t = playingProgramTime();
    let hit = null;
    for (const w of breakWindows) {
      if (w.brk && t >= w.s && t < w.e + ADV_LOOKBACK) { hit = w; break; }
    }
    const now = !!hit;
    if (now !== inAd) {
      inAd = now;
      applyMute();
      applyBreakAudio();
      adctl.classList.toggle('show', inAd);
      if (inAd) renderBreak();
      else { cutEl.textContent = ''; cutEl.classList.remove('ad'); lastAdText = ''; maybeGuide(); }
    }
    if (inAd) renderAdText();
  }

  artEl.src = ART_LOGO;
  updateMediaSession('CNBC Audio', '', '', ART_LOGO);
  np.classList.add('on');
  setInterval(tickAd, AD_TICK);
  let tick = 0;
  setInterval(() => {
    tick++;
    const playing = !video.paused;
    if (playing || tick % 15 === 0) pollPlaylist();
    const wantGuide = (playing && tick % 15 === 0) || (!playing && tick % 30 === 0);
    if ((wantGuide || pendingGuide || tick % 900 === 0) && !guideBusy) { pendingGuide = false; fetchGuide(); }
  }, 4000);
  fetch('art.json').then(r => r.json()).then(m => { for (const k in m) artMap[k] = typeof m[k] === 'string' ? { url: m[k] } : m[k]; }).catch(() => {}).finally(() => fetchGuide());
</script>
</body>
