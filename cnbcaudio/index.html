<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="referrer" content="unsafe-url">
<title>CNBC Audio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  body { margin: 0; background: #f6f6f4; color: #111;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #f6f6f4; overflow-y: auto; box-sizing: border-box; padding-bottom: 60px; }
  #wrap::after { content: ""; height: 32px; }  /* balances #brand so the card stays 30px above dead-center */
  #card { position: relative; z-index: 1; text-align: center; padding: 32px; zoom: 1.69;
          margin: auto;
          background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 20px;
          box-shadow: 0 8px 40px rgba(0,0,0,0.06); }
  h1 {
    margin: 12px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.2px; color: #62666a;
    cursor: pointer; user-select: none; transition: color .25s; position: relative; z-index: 2;
  }
  h1:hover { color: #2f3236; }
  #status { display: none; }
  #status:hover { color: #2f3236; }
  video, #lofi { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #err { margin: 12px auto 0; color: #e82127; font-size: 12px; white-space: pre-wrap; }
  #err:empty { display: none; }
  #np { display: none; text-align: center; }
  #np.on { display: block; animation: fadein .5s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  #art {
    display: block; margin: 0 auto; height: 173px; width: auto; max-width: 600px; border-radius: 12px; object-fit: contain;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    cursor: pointer; user-select: none; outline: none; -webkit-tap-highlight-color: transparent;
    transition: border-color .25s;
  }
  #art:hover { border-color: rgba(0,0,0,0.08); }
  #brand { position: relative; z-index: 2; width: 132px; aspect-ratio: 900 / 506;
          margin: 16px 0 2px; pointer-events: none;
          background: #a3a6aa;
          -webkit-mask-image: url('cnbc-logo.png'); -webkit-mask-size: contain;
          -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
          mask-image: url('cnbc-logo.png'); mask-size: contain;
          mask-repeat: no-repeat; mask-position: center; }
  #cut { margin: 12px auto 0; color: #5c5e62; font-size: 14px; max-width: 320px; }
  #cut:empty { display: none; }
  #cut.ad { font-style: italic; }
  #credits { margin: 12px auto 0; color: #83878c; font-size: 12px; line-height: 1.45; max-width: 360px; }
  #credits:empty { display: none; }
  #desc { margin: 12px auto 0; color: #83878c; font-size: 12px; line-height: 1.45; max-width: 360px; }
  #desc:empty { display: none; }
  body.stills #desc { display: none !important; }  /* hide program blurb while live stills show in #art */
  body.stills #art { height: 260px; }  /* 50% bigger live still only; splash stays standard */
  #upnext { margin: 12px auto 0; color: #c9ccce; font-size: 12px; line-height: 1.45; max-width: 360px; }
  @media (max-width: 430px) {
    #card { zoom: 1; padding: 20px 12px; }
    #brand { width: 110px; }
    h1 { font-size: 24px; }
    #art { max-width: calc(100vw - 64px); }
    #cut, #credits, #desc, #upnext { max-width: calc(100vw - 64px); }
  }
  @media (min-width: 431px) and (max-width: 790px) {
    #card { zoom: 1; }
  }
  #upnext:empty { display: none; }
  #adctl {
    display: flex; align-items: center; justify-content: center; width: fit-content;
    gap: 4px; padding: 0; margin: 0 auto;
    border-radius: 999px;
    background: rgba(140,143,148,0.32); backdrop-filter: blur(6px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-height: 0; overflow: hidden;
    visibility: hidden; opacity: 0; pointer-events: none;
    transition: max-height .3s ease, margin .3s ease, padding .3s ease, opacity .25s ease, visibility .25s ease;
  }
  #adctl.show {
    max-height: 60px; margin: 14px auto 0; padding: 4px;
    visibility: visible; opacity: 1; pointer-events: auto;
  }
  .seg {
    appearance: none; border: none; background: none; cursor: pointer;
    color: #a3a6aa; font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .3px; padding: 8px 14px; border-radius: 999px;
    -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s;
  }
  .seg:hover { color: #7c7f83; }
  .seg.on { background: #a3a6aa; color: #fff; }
  #gainctl {
    position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
    z-index: 15; display: flex; align-items: center; gap: 8px;
    padding: 12px 10px; border-radius: 16px;
    background: rgba(255,255,255,0.72); border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 4px 18px rgba(0,0,0,0.08); backdrop-filter: blur(6px);
    user-select: none;
  }
  .gcol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .gdiv { width: 1px; height: 132px; background: rgba(0,0,0,0.10); }
  #gainpct, #lofipct { font: 700 11px/1 ui-monospace, Menlo, monospace; color: #62666a; letter-spacing: .5px; }
  .glabel { font: 600 9px/1 system-ui; letter-spacing: 1.2px; text-transform: uppercase; color: #83878c; }
  #gainslider, #lofislider {
    writing-mode: vertical-lr; direction: rtl;
    -webkit-appearance: slider-vertical; appearance: slider-vertical;
    height: 132px; margin: 0; accent-color: #a3a6aa; cursor: pointer;
  }
  #vis {
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    width: 100%; height: 78vh; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity .5s;
  }
  #vis.on { opacity: 1; }
</style>
</head>
<body>
<div id="wrap">
  <div id="brand" role="img" aria-label="CNBC"></div>
  <div id="card">
    <p id="status">Loading&hellip;</p>
    <div id="np">
      <img id="art" alt="">
    </div>
    <h1 id="title">CNBC Audio</h1>
    <div id="cut"></div>
    <div id="credits"></div>
    <div id="desc"></div>
    <div id="upnext"></div>
    <div id="adctl" role="group" aria-label="Ad break audio">
      <button class="seg" type="button" data-mode="lofi">LoFi</button>
      <button class="seg" type="button" data-mode="mute">Mute</button>
      <button class="seg" type="button" data-mode="ads">Ads</button>
    </div>
    <div id="err"></div>
  </div>
  <canvas id="vis"></canvas>
  <video id="video" controls muted playsinline preload="auto"></video>
  <audio id="lofi" crossorigin="anonymous" preload="none" playsinline></audio>
  <div id="gainctl">
    <div class="gcol">
      <input id="gainslider" type="range" min="50" max="800" step="5" value="250" aria-label="CNBC volume percent">
      <div id="gainpct">250%</div>
      <div class="glabel">CNBC</div>
    </div>
    <div class="gdiv"></div>
    <div class="gcol">
      <input id="lofislider" type="range" min="0" max="100" step="5" value="70" aria-label="LoFi volume percent">
      <div id="lofipct">70%</div>
      <div class="glabel">LoFi</div>
    </div>
  </div>
</div>
<script>
  const video = document.getElementById('video');
  window.__cnbcMedia = function () {
    const st = video.seekable;
    return {
      cur: video.currentTime,
      start: st && st.length ? st.start(0) : NaN,
      end: st && st.length ? st.end(st.length - 1) : NaN
    };
  };
  // Wall-clock (ms) of the audio currently playing, straight from hls.js's
  // EXT-X-PROGRAM-DATE-TIME bookkeeping for the fragment under the playhead.
  window.__cnbcWall = function () {
    if (!hlsInst) return null;
    try {
      const lv = hlsInst.levels;
      if (!lv || !lv.length) return null;
      const li = hlsInst.currentLevel >= 0 ? hlsInst.currentLevel : 0;
      const det = lv[li] && lv[li].details;
      if (!det || !det.fragments || !det.fragments.length) return null;
      const cur = video.currentTime;
      if (isNaN(cur)) return null;
      for (let i = det.fragments.length - 1; i >= 0; i--) {
        const f = det.fragments[i];
        if (cur >= f.start - 0.5 && cur < f.start + (f.duration || 0)) {
          if (f.programDateTime) return f.programDateTime + (cur - f.start) * 1000;
          break;
        }
      }
    } catch (e) {}
    return null;
  };
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const artEl = document.getElementById('art');
  const ART_LOGO = 'art/logo.png';
  const LOGO_SIZE = '1024x1024';
  let mediaMeta = null;
  const errBox = document.getElementById('err');
  const adctl = document.getElementById('adctl');
  const segs = Array.from(document.querySelectorAll('#adctl .seg'));
  const lofiEl = document.getElementById('lofi');
  const vis = document.getElementById('vis');
  const ctx = vis.getContext('2d');
  let VW = 420, VH = 150;
  let PERIOD = 96, baseAmp = 40;
  let midY = 75, hist = null, pen = 0, period = PERIOD, amp = baseAmp;
  let raf = 0;
  // Stream URL is never embedded (tokens expire). It is derived on every load:
  // cnbc.html (same origin) -> stable master playlist URL -> master playlist
  // -> current TYPE=AUDIO manifest URL (token included). No stale fallback:
  // if resolution fails, the failure is shown loudly and retried, never
  // silently played from a dead URL.
  const MASTER_FALLBACK = 'https://cnbc.mt.linear.viewlift.com/v1/master/dfe581e0a446a1e548014078b2d81b62b917979d/usanetwork-linear-external-hls-primary-cnbc-v2/Content/Channel/886a397d-ff30-4021-eb16-bb73c658c033/HLS_CLEAR/master_5m.m3u8';
  let src = null;
  let started = false;
  let resolving = false, resolveTimer = 0;

  // --- ad-break state (matched to playback program time, not the live edge) ---
  let hlsInst = null;                 // hls.js instance (null for native/Safari)
  let breakWindows = [];              // [{s, e, brk}] parsed from EXT-X-DATERANGE
  let edgePdt = null;                 // program time of the last segment in the playlist
  let lastSegDur = 0;                 // duration of the last segment (seconds)
  let inAd = false;                   // playback is currently inside a 0x22 break
  let userMuted = true;               // user's own mute preference (normal content)
  let wired = false;                  // analyser wired to the element's audio
  let outNode = null, cnbcGain = null; // Web Audio output path (lets CNBC exceed 100%)
  let userActivated = false;           // a real gesture happened (safe to route Web Audio)
  const CNBC_GAIN = 2.5;
  const AD_TICK = 250;
  const ADV_LOOKBACK = 0;             // extra ms to keep muting past planned end

  // --- car-test gain slider: real-time CNBC boost %, persisted per device ---
  const gainctl = document.getElementById('gainctl');
  const gainslider = document.getElementById('gainslider');
  const gainpct = document.getElementById('gainpct');
  let gainPct = 600;
  try {
    const s = localStorage.getItem('cnbcGainPct');
    if (s) { const v = parseInt(s, 10); if (v >= 50 && v <= 800) gainPct = v; }
  } catch (e) {}
  gainslider.value = gainPct;
  gainpct.textContent = gainPct + '%';
  gainslider.addEventListener('input', () => {
    const p = parseInt(gainslider.value, 10);
    gainpct.textContent = p + '%';
    try { localStorage.setItem('cnbcGainPct', String(p)); } catch (e) {}
    if (cnbcGain && cnbcGain.gain) cnbcGain.gain.value = p / 100;
  });

  // --- car-test LoFi slider ---
  const lofislider = document.getElementById('lofislider');
  const lofipct = document.getElementById('lofipct');
  let lofiPct = 70;
  try {
    const s = localStorage.getItem('cnbcLoFiPct');
    if (s) { const v = parseInt(s, 10); if (v >= 0 && v <= 100) lofiPct = v; }
  } catch (e) {}
  lofislider.value = lofiPct;
  lofipct.textContent = lofiPct + '%';
  lofislider.addEventListener('input', () => {
    const p = parseInt(lofislider.value, 10);
    lofipct.textContent = p + '%';
    try { localStorage.setItem('cnbcLoFiPct', String(p)); } catch (e) {}
    lofiEl.volume = p / 100;
  });

  // What to play during an ad break: 'lofi' | 'mute' | 'ads' (cached).
  const BREAK_MODES = ['lofi', 'mute', 'ads'];
  let breakMode = (function () {
    try { const m = localStorage.getItem('cnbcBreakMode'); if (BREAK_MODES.indexOf(m) >= 0) return m; } catch (e) {}
    return 'lofi';
  })();
  let boostDefaulted = false;
  function boostAtStart() {
    if (boostDefaulted) return;
    boostDefaulted = true;
    gainPct = 600;
    gainslider.value = '600';
    gainpct.textContent = '600%';
    try { localStorage.setItem('cnbcGainPct', '600'); } catch (e) {}
    if (cnbcGain && cnbcGain.gain) cnbcGain.gain.value = 6;
    if (window.__stillsGo) window.__stillsGo();
  }
  const LOFI_STREAMS = [
    'https://radio.loficafe.net/listen/chilling/radio.mp3',
    'https://radio.loficafe.net/listen/sleeping/radio.mp3',
    'https://radio.loficafe.net/listen/working/radio.mp3',
    'https://lofi.stream.laut.fm/lofi'
  ];
  let lofiTry = 0;
  let lofiAnalyser = null, lofiData = null, lofiWired = false, lofiTries = 0;

  function fetchText(url, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 10000);
    return fetch(url, { cache: 'no-store', signal: ctl.signal }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).finally(() => clearTimeout(t));
  }

  async function resolveStreamUrl() {
    const bust = u => u + (u.indexOf('?') < 0 ? '?' : '&') + 'ts=' + Date.now();
    let master = MASTER_FALLBACK;
    try {
      const html = await fetchText(bust('../cnbc.html'));
      const m = html.match(/https:\/\/cnbc\.mt\.linear\.viewlift\.com\/v1\/master\/[A-Za-z0-9_.\-\/]+?\.m3u8/);
      if (!m) throw new Error('master URL not found in cnbc.html');
      master = m[0];
    } catch (e) {
      master = MASTER_FALLBACK; // tokenless + stable, safe to keep hardcoded
    }
    const pl = await fetchText(bust(master));
    const media = pl.match(/EXT-X-MEDIA:[^\n]*TYPE=AUDIO[^\n]*/);
    const a = media && media[0].match(/URI="([^"]*\/7\.m3u8)"/);
    if (!a) throw new Error('audio entry not found in master playlist');
    return new URL(a[1], master).href; // RFC-resolve the ../../.. URI, same as hls.js does
  }

  function boot(fromTap) {
    if (resolving) return;
    resolving = true;
    clearTimeout(resolveTimer);
    resolveStreamUrl().then(url => {
      resolving = false;
      src = url;
      errBox.textContent = '';
      started = true;
      ensureCtx();
      attach(fromTap);
    }).catch(e => {
      resolving = false;
      started = false;
      setError('Could not resolve stream (' + ((e && e.message) || e) + ') - retrying. Tap "CNBC Audio" to retry now.');
      clearTimeout(resolveTimer);
      resolveTimer = setTimeout(() => boot(false), 15000);
    });
  }

  let N = 52, BW = 6, GAP = 3;
  let levels = new Float32Array(N);
  let vel = new Float32Array(N);
  let tgt = new Float32Array(N);
  function rebuildBars() {
    N = Math.min(140, Math.max(36, Math.round(VW / 24)));
    GAP = VW > 1600 ? 8 : VW > 1000 ? 6 : 3;
    const halfW = VW / 2;
    if ((N - 1) * GAP >= halfW) GAP = Math.max(1, Math.round(halfW * 0.12 / N));
    BW = (halfW - (N - 1) * GAP) / N;
    levels = new Float32Array(N);
    vel = new Float32Array(N);
    tgt = new Float32Array(N);
  }

  function rebuild() {
    midY = VH / 2;
    hist = new Float32Array(VW + 1);
    for (let i = 0; i <= VW; i++) hist[i] = midY;
    PERIOD = Math.max(48, VW / 4.4);
    baseAmp = VH * 0.27;
    period = PERIOD;
    amp = baseAmp;
    pen = 0;
    rebuildBars();
  }

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const r = vis.getBoundingClientRect();
    VW = Math.max(1, Math.round(r.width));
    VH = Math.max(1, Math.round(r.height));
    vis.width = VW * dpr;
    vis.height = VH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rebuild();
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function refresh() { location.reload(); }

  function setError(msg) { errBox.textContent = 'Error: ' + msg; }
  function setLive() {}
  function setStatus(t) { status.textContent = t; }

  function autoReload() {
    let n = parseInt(sessionStorage.getItem('cnbcAutoReload') || '0', 10);
    if (n >= 100) {
      sessionStorage.removeItem('cnbcAutoReload');
      setStatus('Stuck - click "CNBC Audio" to reload');
      return;
    }
    n++;
    sessionStorage.setItem('cnbcAutoReload', String(n));
    setStatus('Stuck - reloading\u2026');
    setTimeout(refresh, 600);
  }

  let lastTime = -1;
  let stuck = 0;
  let establishedAt = 0;
  setInterval(() => {
    const t = video.currentTime;
    if (!started || video.paused || video.ended) { stuck = 0; lastTime = t; return; }
    if (t === lastTime) {
      if (establishedAt && performance.now() - establishedAt > 6000) {
        stuck++;
        if (stuck >= 6) { stuck = 0; video.play().catch(() => {}); autoReload(); }
      }
    } else {
      stuck = 0;
      lastTime = t;
      if (!establishedAt) establishedAt = performance.now();
    }
  }, 500);

  let audioCtx = null, analyser = null, dataArray = null;

  function ensureCtx() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }

  // Tap the element's own audio for the visualizer via captureStream(). Per spec
  // the capture keeps producing real samples even while the element is muted, so
  // the bars stay live during ad-break muting; the element still plays the sound.
  let wireTries = 0;
  function wireAnalyser() {
    if (wired || !started) return;
    ensureCtx();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    try {
      let srcNode = null;
      if (video.captureStream) {
        const stream = video.captureStream();
        if (!stream.getAudioTracks().length) {
          if (wireTries++ < 12) { setTimeout(wireAnalyser, 300); return; }
          return;
        }
        srcNode = audioCtx.createMediaStreamSource(stream);
      } else {
        if (!outNode) {
          outNode = audioCtx.createMediaElementSource(video);
          if (!cnbcGain) outNode.connect(audioCtx.destination);   // audible before boost
        }
        srcNode = outNode;
      }
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.82;
      srcNode.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      wired = true;
      if (userActivated) enableBoost();
      applyMute();
    } catch (e) {
      analyser = null; wired = false;
    }
  }

  // Route the element through a gain so CNBC can exceed 100%. Enabled only after
  // a real user gesture, so autoplay never ends up routed through a suspended
  // (silent) AudioContext. Idempotent: reuses an existing MediaElementSource
  // (created by the analyser during muted autoplay) instead of failing on it.
  function enableBoost() {
    if (!audioCtx || !userActivated) return;
    if (cnbcGain) return;
    try {
      if (!outNode) outNode = audioCtx.createMediaElementSource(video);
      outNode.disconnect();
      cnbcGain = audioCtx.createGain();
      cnbcGain.gain.value = gainPct / 100;   // slider % -> gain, honoring the car-test value
      // Limiter so the boost gets louder without clipping/distorting peaks.
      const lim = audioCtx.createDynamicsCompressor();
      lim.threshold.value = -2;
      lim.knee.value = 0;
      lim.ratio.value = 20;
      lim.attack.value = 0.003;
      lim.release.value = 0.25;
      outNode.connect(cnbcGain);
      cnbcGain.connect(lim);
      lim.connect(audioCtx.destination);
      if (analyser && !video.captureStream) outNode.connect(analyser);
    } catch (e) {
      outNode = null; cnbcGain = null;
    }
  }

  // A real user gesture happened: unlocks the context now and locks in the boost.
  function markActivated() {
    userActivated = true;
    ensureCtx();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(enableBoost).catch(() => {});
    else enableBoost();
  }
  document.addEventListener('pointerdown', markActivated, { once: true });
  document.addEventListener('keydown', markActivated, { once: true });

  // Tap the lofi <audio> for its own visualizer (CORS is reflected, so this works).
  function wireLofiAnalyser() {
    if (lofiWired || !audioCtx) return;
    try {
      let srcNode = null;
      if (lofiEl.captureStream) {
        const stream = lofiEl.captureStream();
        if (!stream.getAudioTracks().length) {
          if (lofiTries++ < 12) { setTimeout(wireLofiAnalyser, 300); return; }
          return;
        }
        srcNode = audioCtx.createMediaStreamSource(stream);
      } else {
        srcNode = audioCtx.createMediaElementSource(lofiEl);
        srcNode.connect(audioCtx.destination);
      }
      lofiAnalyser = audioCtx.createAnalyser();
      lofiAnalyser.fftSize = 256;
      lofiAnalyser.smoothingTimeConstant = 0.82;
      srcNode.connect(lofiAnalyser);
      lofiData = new Uint8Array(lofiAnalyser.frequencyBinCount);
      lofiWired = true;
    } catch (e) {
      lofiAnalyser = null; lofiWired = false;
    }
  }

  // silence = user mute, or an ad break the user hasn't chosen to hear
  function applyMute() {
    if (inAd) video.muted = breakMode !== 'ads';
    else video.muted = userMuted;
  }

  // Start/stop the lofi stream to match the current break + mode.
  function applyBreakAudio() {
    const want = inAd && breakMode === 'lofi';
    if (want) {
      if (lofiEl.paused) {

      return null;
    }
    return walk(0, data.length);
  }

  function findMdhdTs(data) {
    const view = dv(data);
    function walk(start, end) {
      for (const b of boxes(data, start, end)) {
        if (b.type === 'moov' || b.type === 'trak' || b.type === 'mdia') {
          const r = walk(b.h + 8, b.h + b.s); if (r !== null) return r;
        } else if (b.type === 'mdhd') {
          const p = b.h + 8;
          return (view.getUint8(p) === 1) ? view.getUint32(p + 20) : view.getUint32(p + 12);
        }
      }
      return null;
    }
    return walk(0, data.length);
  }

  function parseFragment(data) {
    const view = dv(data); const samples = []; let firstDec = null;
    const mdats = boxes(data, 0, data.length).filter(function (b) { return b.type === 'mdat'; });
    const mdatP = mdats.length ? mdats[0].h + 8 : null;
    for (const moof of boxes(data, 0, data.length)) {
      if (moof.type !== 'moof') continue;
      for (const traf of boxes(data, moof.h + 8, moof.h + moof.s)) {
        if (traf.type !== 'traf') continue;
        let tfhd = null, tfdt = null, trun = null;
        for (const c of boxes(data, traf.h + 8, traf.h + traf.s)) {
          if (c.type === 'tfhd') tfhd = c;
          else if (c.type === 'tfdt') tfdt = c;
          else if (c.type === 'trun') trun = c;
        }
        if (!tfhd || !trun) continue;
        const tfp = tfhd.h + 8;
        const tfF = view.getUint32(tfp) & 0xffffff;
        let base = moof.h, p = tfp + 4, defDur = null, defSize = null, defFl = null;
        if (tfF & 0x1) { base = Number(view.getBigUint64(p)); p += 8; }
        else if (tfF & 0x10) { base = view.getUint32(p); p += 4; }
        if (tfF & 0x2) { defDur = view.getUint32(p); p += 4; }
        if (tfF & 0x4) { defSize = view.getUint32(p); p += 4; }
        if (tfF & 0x8) { defFl = view.getUint32(p); p += 4; }
        let decBase = 0;
        if (tfdt) {
          const q = tfdt.h + 8;
          decBase = (view.getUint8(q) === 1) ? Number(view.getBigUint64(q + 4)) : view.getUint32(q + 4);
        }
        if (firstDec === null) firstDec = decBase;
        const trp = trun.h + 8;
        const trF = view.getUint32(trp) & 0xffffff;
        const n = view.getUint32(trp + 4);
        p = trp + 8;
        let dataOff = 0, firstFl = null;
        if (trF & 0x1) { dataOff = view.getInt32(p); p += 4; }
        if (trF & 0x4) { firstFl = view.getUint32(p); p += 4; }
        let off = base + dataOff;
        if (off < 0 && mdatP) off = mdatP;
        let dec = decBase;
        for (let i = 0; i < n; i++) {
          let dur = 0;
          if (trF & 0x100) { dur = view.getUint32(p); p += 4; }
          else if (tfF & 0x2) dur = defDur;
          let size = 0;
          if (trF & 0x200) { size = view.getUint32(p); p += 4; }
          else if (tfF & 0x4) size = defSize;
          let fl = 0;
          if (trF & 0x400) { fl = view.getUint32(p); p += 4; }
          else if (i === 0 && firstFl !== null) fl = firstFl;
          else if (tfF & 0x8) fl = defFl;
          let cts = 0;
          if (trF & 0x800) { cts = view.getInt32(p); p += 4; }
          samples.push({ off: off, size: size, dur: dur, fl: fl, dec: dec, cts: cts });
          off += size; dec += dur;
        }
      }
    }
    return { samples: samples, firstDec: firstDec };
  }

  function bump(u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + 'ts=' + Date.now(); }
  function fetchTxt(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }); }
  function fetchBytes(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }); }

  function pickVariant(t, base) {
    let cur = null, best = null, fb = null;
    const lines = t.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (/^#EXT-X-STREAM-INF:/.test(line)) { cur = line; continue; }
      if (cur && line && !line.startsWith('#')) {
        const res = /RESOLUTION=([0-9]+)x([0-9]+)/.exec(cur);
        let bw = 0; const bm = /BANDWIDTH=([0-9]+)/.exec(cur); if (bm) bw = parseInt(bm[1], 10);
        if (res && res[1] === '960' && res[2] === '540') {
          const o = { uri: new URL(line, base).href, bw: bw };
          if (/avc1\.64001f/.test(cur)) { if (!best || bw > best.bw) best = o; }
          else if (!fb || bw > fb.bw) fb = o;
        }
        cur = null;
      }
    }
    return best || fb;
  }

  function parseVariant(t, base) {
    let init = null, pdt = null, inf = 0; const segs = [];
    for (const raw of t.split('\n')) {
      const line = raw.trim();
      if (line.indexOf('#EXT-X-MAP:') === 0) {
        const m = /URI="([^"]+)"/.exec(line); if (m) init = new URL(m[1], base).href;
      } else if (line.indexOf('#EXT-X-PROGRAM-DATE-TIME:') === 0) {
        const v = Date.parse(line.slice(line.indexOf(':') + 1).trim()); if (!isNaN(v)) pdt = v;
      } else if (line.indexOf('#EXTINF:') === 0) {
        const c = line.indexOf(','); const d = line.slice(line.indexOf(':') + 1, c < 0 ? undefined : c);
        inf = parseFloat(d) || 0;
      } else if (line && line.charAt(0) !== '#') {
        segs.push({ uri: new URL(line, base).href, pdt: pdt, dur: inf }); pdt = null; inf = 0;
      }
    }
    return { init: init, segs: segs };
  }

  // The TYPE=AUDIO rendition (7.m3u8) from the master's #EXT-X-MEDIA list.
  function pickAudio(t, base) {
    for (const raw of t.split('\n')) {
      const line = raw.trim();
      if (line.indexOf('#EXT-X-MEDIA:') === 0 && /TYPE=AUDIO/.test(line)) {
        const m = /URI="([^"]+7\.m3u8)"/.exec(line);
        if (m) return new URL(m[1], base).href;
      }
    }
    return null;
  }

  // Build a playhead->wall-clock table with cumulative starts.
  function parseTimeline(t, base) {
    let pdt = null, inf = 0, acc = 0; const segs = [];
    for (const raw of t.split('\n')) {
      const line = raw.trim();
      if (line.indexOf('#EXT-X-PROGRAM-DATE-TIME:') === 0) {
        const v = Date.parse(line.slice(line.indexOf(':') + 1).trim()); if (!isNaN(v)) pdt = v;
      } else if (line.indexOf('#EXTINF:') === 0) {
        const c = line.indexOf(','); const d = line.slice(line.indexOf(':') + 1, c < 0 ? undefined : c);
        inf = parseFloat(d) || 0;
      } else if (line && line.charAt(0) !== '#') {
        segs.push({ pdt: pdt, dur: inf, startMs: acc * 1000, durMs: inf * 1000 }); acc += inf; pdt = null; inf = 0;
      }
    }
    return segs;
  }

  // Last fully-written segment (PDT + duration already in the past), else 2nd-to-last.
  function pickSeg(segs) {
    if (!segs.length) return null;
    const now = Date.now() + 2500;
    for (let i = segs.length - 1; i >= 0; i--) {
      const s = segs[i];
      if (s.pdt && s.pdt + s.dur * 1000 <= now) return s;
    }
    return segs[segs.length - 2] || segs[segs.length - 1];
  }

  function ensureDecoder() {
    if (dec) return true;
    try {
      dec = new VideoDecoder({
        output: function (f) {
          if (f.timestamp > targetU) { f.close(); if (!latched) latched = f; return; }
          if (latched) latched.close();
          latched = f;
        },
        error: function (e) { S.lastErr = 'decode:' + (e && e.message); dec = null; initBytes = null; avcC = null; dbg(); }
      });
      dec.configure({
        codec: 'avc1.64001f', description: avcC,
        codedWidth: 960, codedHeight: 540
      });
      S.info = 'decoder configured';
      return true;
    } catch (e) {
      S.lastErr = 'config:' + (e && e.message); dec = null; dbg();
      return false;
    }
  }

  function draw() {
    if (!latched) return;
    try { c2.drawImage(latched, 0, 0, 960, 540); } catch (e) { S.lastErr = 'draw:' + e; }
    lastFrameWall = curSegPdt + Math.round(latched.timestamp) / 1000;
    try { latched.close(); } catch (e) {}
    latched = null; bestPts = -1;
    cv.toBlob(function (b) {
      if (b) {
        try { if (blobUrl) URL.revokeObjectURL(blobUrl); } catch (e) {}
        blobUrl = URL.createObjectURL(b);
        artElStills.src = blobUrl;
        S.okFrames++;
      }
      document.body.classList.add('stills');
      S.on = true; dbg();
      if (b) {
        try {
          const img = new Image();
          img.onload = function () {
            try {
              const cc = document.createElement('canvas'); cc.width = 960; cc.height = 540;
              const gg = cc.getContext('2d'); gg.drawImage(img, 0, 0);
              const dd = gg.getImageData(0, 0, 960, 540).data; let s = 0, n = 0;
              for (let y = 0; y < 540; y += 68) for (let x = 0; x < 960; x += 120) { const i = (y * 960 + x) * 4; s += (dd[i] + dd[i + 1] + dd[i + 2]) / 3; n++; }
              window.__stillsDbg = window.__stillsDbg || {}; __stillsDbg.blob = Math.round(s / n);
            } catch (e) {}
          };
          img.src = blobUrl;
        } catch (e) {}
      }
    }, 'image/jpeg', 0.72);
  }

  function fail(err) {
    failN++;
    S.fails = failN;
    S.lastErr = String((err && (err.message || err.name)) || err).slice(0, 180);
    if (failN % 3 === 0) { /* backoff handled by schedule */ }
    dbg();
  }

  // fetch => parse => decode => draw one segment. Returns true when a new frame drew.
  function step() {
    if (!S.supported) { S.lastErr = 'WebCodecs unavailable'; dbg(); return; }
    if (gated || busy || document.hidden) return;
    busy = true;
    S.attempts++; S.stage = 'master';
    fetchTxt(bump(MASTER)).then(function (mt) {
      const base = MASTER.slice(0, MASTER.lastIndexOf('/') + 1);
      const v = pickVariant(mt, base);
      if (!v) throw new Error('no 960x540 variant');
      const audioUri = pickAudio(mt, base);
      S.stage = 'playlist';
      const plF = fetchTxt(bump(v.uri));
      const atF = audioUri ? fetchTxt(bump(audioUri)) : Promise.resolve(null);
      return Promise.all([plF, atF]).then(function (res) {
        const pt = res[0], at = res[1];
        const p = parseVariant(pt, v.uri.slice(0, v.uri.lastIndexOf('/') + 1));
        const aSeqs = at ? parseTimeline(at, audioUri.slice(0, audioUri.lastIndexOf('/') + 1)) : null;
        // Wall-clock at the audio playhead: prefer hls.js's own PDT math ('w'),
        // fall back to our audio-playlist cumulative mapping ('c').
        let wallMs = null, wallSrc = 'live';
        const c = window.__cnbcMedia ? window.__cnbcMedia() : null;
        const w = window.__cnbcWall ? window.__cnbcWall() : null;
        if (c && !isNaN(c.cur) && c.cur > curRef && c.cur < c.end) {
          if (w !== null) { wallMs = w - TRIM * 1000; wallSrc = 'w'; curRef = c.cur; }
          else if (aSeqs && aSeqs.length) {
            let acc = 0;
            for (let i = 0; i < aSeqs.length; i++) {
              const s = aSeqs[i];
              if (c.cur >= acc && c.cur < acc + s.dur) {
                if (s.pdt !== null) { wallMs = s.pdt + (c.cur - acc) * 1000 - TRIM * 1000; wallSrc = 'c'; }
                break;
              }
              acc += s.dur;
            }
            if (wallMs !== null) curRef = c.cur;
          }
        }
        window.__stillsDbg = {
          wallMs: Math.round(wallMs || 0),
          frameWall: Math.round(lastFrameWall || 0),
          dts: Math.round(Date.now() - lastFrameWall),
          src: wallMs !== null ? wallSrc : lastSrc,
          trim: TRIM,
          cur: c ? +c.cur.toFixed(2) : null
        };
        let seg, target = Infinity;
        if (wallMs !== null && p.segs.length) {
          seg = null; let bi = Infinity;
          for (const s of p.segs) {
            if (s.pdt === null) continue;
            const ad = Math.abs(s.pdt - wallMs);
            if (ad < bi) { bi = ad; seg = s; }
          }
          if (!seg) seg = pickSeg(p.segs);
          target = Math.max(0, (wallMs - seg.pdt) * 1000);
        } else {
          seg = pickSeg(p.segs);
        }
        targetU = target;
        lastWallMs = wallMs || 0; lastSrc = wallSrc; curSegPdt = seg.pdt;
        if (!seg) throw new Error('no segments');
        if (wallMs === null) return false;  // never show a live-edge frame that leads the audio; hold splash/last frame
        if (seg.uri === lastUri) { return false; }
        const initChain = initBytes ? Promise.resolve() : fetchBytes(p.init).then(function (ib) {
          initBytes = new Uint8Array(ib);
          avcC = findInit(initBytes);
          if (!avcC) throw new Error('no avcC in init');
          const t = findMdhdTs(initBytes); if (t) tsScale = t;
          S.stage = 'decoder';
          if (!ensureDecoder()) throw new Error('decoder unavailable');
        });
        return initChain.then(function () {
          S.stage = 'segment';
          if (!ensureDecoder()) throw new Error('decoder unavailable');
          return fetchBytes(seg.uri).then(function (sb) {
            const segb = new Uint8Array(sb);
            S.stage = 'parse';
            const r = parseFragment(segb);
            if (!r.samples.length) throw new Error('no samples');
            S.stage = 'decode';
            let tPrev = -1;
            for (const s of r.samples) {
              if (!dec) { S.lastErr = 'decoder-lost:' + (S.lastErr || 'unexpected'); initBytes = null; throw new Error(S.lastErr); }
              let ts = Math.round((s.dec - r.firstDec + (s.cts || 0)) / tsScale * 1e6);
              if (ts < 0) ts = 0;
              if (ts <= tPrev) ts = tPrev + 1;
              tPrev = ts;
              dec.decode(new EncodedVideoChunk({
                type: (s.fl & 0x00010000) === 0 ? 'key' : 'delta',
                timestamp: ts,
                data: segb.slice(s.off, s.off + s.size)
              }));
            }
            S.info = 'fed ' + r.samples.length + ' chunks Δ' + (wallMs !== null ? Math.round((wallMs - Date.now()) / 1000) + 's:' + wallSrc : 'live') + ' fΔ' + Math.round((Date.now() - (lastFrameWall || Date.now())) / 1000) + 's' + (TRIM ? ' t' + TRIM : '');
            const guard = new Promise(function (res) { setTimeout(res, 3000); });
            return Promise.race([dec.flush().catch(function (e) { S.lastErr = 'flush:' + (e && e.message); }), guard]);
          });
        }).then(function () {
          S.stage = 'draw';
          draw();
          if (S.on) {
            lastUri = seg.uri; failN = 0; S.lastErr = ''; dbg();
            return true;
          }
          return false;
        });
      });
    }).catch(function (e) {
      fail(e);
    }).then(function (ok) {
      busy = false;
      S.stage = 'idle';
      // reschedule with backoff: 4s on success, 12s..90s while failing
      const baseDelay = ok ? 4000 : Math.min(90000, Math.pow(2, Math.min(failN, 6)) * 4000);
      setTimeout(function () { if (!document.hidden) step(); }, S.on ? 4000 : baseDelay);
    });
  }

  // Stills stay off (old splash) until the user clicks the logo, which calls
  // window.__stillsGo() from the main script alongside the one-time 600% boost.
  window.__stillsGo = function () {
    if (!S.supported) { dbg(); return; }
    if (!gated) return;
    gated = false;
    S.stage = 'start';
    step();
  };
  if (!S.supported) dbg();
})();
</script>
