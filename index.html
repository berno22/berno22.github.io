<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>berno22</title>
    <style>
      :root {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --text: #1a1a1a;
        --muted: #777777;
        --line: #d0d0d0;
        --accent: #2f2f2f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(440px, 90vw);
      }
      a {
        position: relative;
        display: block;
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 17px 44px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s,
                    color 0.25s, background 0.25s;
      }
      a::after {
        content: "\2192";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%) translateX(-6px);
        color: var(--accent);
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
      }
      a:hover {
        border-color: var(--accent);
        background: #f5f5f5;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      a:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
      a:active {
        transform: translateY(0) scale(0.98);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        a { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="links">
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/test/">Live TV</a>
      <a href="https://www.youtube.com/redirect?q=https://app.plex.tv/">Plex</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/cinestream.html">CineStream</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/test/f1.html">F1TV</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/cnbc.html">CNBC</a>
      <a href="https://berno22.github.io/radiostationusa.fm/">CNBC Audio</a>
      <a href="http://96.244.150.95:8787">SiriusXM</a>
    </div>
  </body>
</html>
