<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>berno22</title>
    <style>
      :root {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --text: #1a1a1a;
        --muted: #777777;
        --line: #d0d0d0;
        --accent: #2f2f2f;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(440px, 90vw);
      }
      a {
        position: relative;
        display: block;
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 17px 44px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s,
                    color 0.25s, background 0.25s;
      }
      a::after {
        content: "\2192";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%) translateX(-6px);
        color: var(--accent);
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
      }
      a:hover {
        border-color: var(--accent);
        background: #f5f5f5;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      a:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
      a:active {
        transform: translateY(0) scale(0.98);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      /* The Live TV row is split in two: the button itself opens the page the
         plain way, and a full-screen control in its right corner opens the
         redirect the other links on this page use. Two sibling anchors, because
         one <a> nested inside another is not valid and browsers will not
         reliably keep the inner link clickable. */
      .split {
        position: relative;
      }
      .split > .main {
        /* Equal padding on both sides, because the label is centred in the
           content box: with only the right side padded the text sits 12px left
           of the button's centre. The icon floats on top of the right padding. */
        padding-left: 68px;
        padding-right: 68px;
      }
      /* Move the hover arrow clear of the full-screen control instead of
         letting the two overlap. */
      .split > .main::after {
        right: 72px;
      }
      .split > .fs {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        box-shadow: none;
      }
      .split > .fs::after {
        content: none;
      }
      .split > .fs svg {
        width: 19px;
        height: 19px;
        display: block;
      }
      /* A full-screen button needs the same shape three more times. One symbol,
         referenced, beats four copies of the same four paths. */
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .split > .fs:hover {
        color: var(--text);
        border-color: var(--line);
        background: #f5f5f5;
        /* Keep the vertical centring: the base hover lifts by 2px, which would
           knock the glyph out of line with the label. */
        transform: translateY(-50%);
        box-shadow: none;
      }
      .split > .fs:active {
        transform: translateY(-50%) scale(0.94);
      }
      @media (max-width: 480px) {
        a { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="ico-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </symbol>
    </svg>

    <div class="links">
      <div class="split">
        <a class="main" href="https://berno22.github.io/livetv/">Live TV</a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://berno22.github.io/livetv/"
           title="Live TV full screen" aria-label="Live TV full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <div class="split">
        <a class="main" href="https://app.plex.tv/">Plex</a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://app.plex.tv/"
           title="Plex full screen" aria-label="Plex full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <div class="split">
        <a class="main" href="https://cinejoy.pk">Streaming</a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://cinejoy.pk"
           title="Streaming full screen" aria-label="Streaming full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <div class="split">
        <a class="main" href="https://berno22.github.io/cnbc.html">CNBC</a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://berno22.github.io/cnbc.html"
           title="CNBC full screen" aria-label="CNBC full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <a href="https://berno22.github.io/cnbcaudio/">CNBC Audio</a>
      <a href="http://96.244.150.95:8787">SiriusXM</a>
      <a href="https://berno22.github.io/garagedoor/">Garage Door</a>
      <a href="https://berno22.github.io/cnbcinmotion/">CNBC InMotion</a>
    </div>
  </body>
</html>
