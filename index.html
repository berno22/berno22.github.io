<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>berno22</title>
    <style>
      :root {
        --bg: #e8e8e8;
        --surface: #ffffff;
        --text: #1a1a1a;
        --muted: #777777;
        --line: #d0d0d0;
        --accent: #2f2f2f;
        /* One grey for both the button labels and the brand marks beside them,
           so a logo reads as part of its label rather than as a competing
           element. --text is still used for hover and for the All Media link. */
        --mark: #555555;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        font-weight: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(440px, 90vw);
      }
      a {
        position: relative;
        display: block;
        text-decoration: none;
        /* The label and any brand mark beside it share one colour, so a logo
           reads as part of the label rather than as a competing element. */
        color: var(--mark);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 17px 44px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s,
                    color 0.25s, background 0.25s;
      }
      a::after {
        content: "\2192";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%) translateX(-6px);
        color: var(--accent);
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
      }
      a:hover {
        border-color: var(--accent);
        background: #f5f5f5;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      a:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
      a:active {
        transform: translateY(0) scale(0.98);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      /* The Live TV row is split in two: the button itself opens the page the
         plain way, and a full-screen control in its right corner opens the
         redirect the other links on this page use. Two sibling anchors, because
         one <a> nested inside another is not valid and browsers will not
         reliably keep the inner link clickable. */
      .split {
        position: relative;
      }
      .split > .main,
      .has-logo {
        /* A flex row so a brand mark can sit beside the label and the pair still
           centres as one unit. */
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
      }
      .split > .main {
        /* Equal padding on both sides, because the label is centred in the
           content box: with only the right side padded the text sits 12px left
           of the button's centre. The icon floats on top of the right padding,
           so that side carries room for the control - now 44px plus a 13px
           inset. Both sides grow together, which is what keeps the label
           centred. The button's own width is unaffected either way. */
        padding-left: 72px;
        padding-right: 72px;
      }
      /* A brand mark in place of, or in front of, the label.
         logos/*.png are black silhouettes with clean alpha, used as a CSS mask
         so the colour comes from CSS rather than being baked into the file - a
         mark can then never drift out of step with the rest of the page.
         The marks are grey and the text is near-black, so a logo reads as
         artwork sitting beside a label rather than as more label. Tying it to a
         token rather than currentColor is the point: it stays the same shade
         whatever colour the link is in, so it does not flip to near-black on
         hover and lose that separation.
         ONE height for every mark, so a brand that appears more than once - CNBC
         is on three rows - is the same size in all of them. Widths follow each
         wordmark's own proportions, because "SiriusXM" at 6.4:1 and "plex" at
         2.2:1 cannot share a width. */
      .lg {
        flex: none;
        height: 18px;
        width: var(--w, 44px);
        background-color: var(--mark);
        -webkit-mask: var(--m) center / contain no-repeat;
        mask: var(--m) center / contain no-repeat;
      }
      .lg-plex     { --m: url(logos/plex.png);     --w: 39px; }
      .lg-cnbc     { --m: url(logos/cnbc.png);     --w: 56px; }
      .lg-siriusxm { --m: url(logos/siriusxm.png); --w: 116px; }
      .lg-live     { --m: url(logos/live-tv.png);  --w: 24px; }
      /* Where the mark is a prefix on a phrase - "CNBC Audio" as the mark plus
         "Audio" - the gap closes up so the two read as one phrase rather than a
         logo with a caption. The visible text is then only "Audio", so these
         rows carry an aria-label to keep the full name as the accessible name. */
      .has-logo-inline { gap: 7px; }
      /* When a brand mark stands in for the label, the label stays in the DOM so
         screen readers still announce "Plex", but is hidden from view. Every
         real brand mark for this page - Plex, CNBC, SiriusXM - is a wordmark, so
         putting one beside its own name reads as "plex>Plex". */
      .lbl-vh {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Move the hover arrow clear of the full-screen control instead of
         letting the two overlap. */
      .split > .main::after {
        right: 72px;
      }
      /* The full-screen control is absolutely positioned inside the row, so
         making it larger does not resize the URL button beside it - the button
         keeps its full column width and the label stays centred because the
         padding below grows on BOTH sides. */
      .split > .fs {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        /* 44px, not 48. The row itself is only 54px tall, so a 48px control is
           89% of it and reads as a competing element rather than as chrome.
           44 keeps the larger tap target without that. */
        width: 44px;
        height: 44px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        box-shadow: none;
      }
      .split > .fs::after {
        content: none;
      }
      .split > .fs svg {
        width: 21px;
        height: 21px;
        display: block;
      }
      /* A full-screen button needs the same shape three more times. One symbol,
         referenced, beats four copies of the same four paths. */
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .split > .fs:hover {
        color: var(--text);
        border-color: var(--line);
        background: #f5f5f5;
        /* Keep the vertical centring: the base hover lifts by 2px, which would
           knock the glyph out of line with the label. */
        transform: translateY(-50%);
        box-shadow: none;
      }
      .split > .fs:active {
        transform: translateY(-50%) scale(0.94);
      }
      @media (max-width: 480px) {
        a { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="ico-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </symbol>
    </svg>

    <div class="links">
      <div class="split">
        <a class="main" href="https://berno22.github.io/livetv/">
          <span class="lg lg-live" aria-hidden="true"></span
          ><span class="lbl-vh">Live TV</span>
        </a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://berno22.github.io/livetv/"
           title="Live TV full screen" aria-label="Live TV full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <div class="split">
        <a class="main" href="https://app.plex.tv/">
          <span class="lg lg-plex" aria-hidden="true"></span
          ><span class="lbl-vh">Plex</span>
        </a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://app.plex.tv/"
           title="Plex full screen" aria-label="Plex full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <div class="split">
        <a class="main" href="https://cinejoy.pk"><span>Streaming</span></a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://cinejoy.pk"
           title="Streaming full screen" aria-label="Streaming full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <div class="split">
        <a class="main" href="https://berno22.github.io/cnbc.html">
          <span class="lg lg-cnbc" aria-hidden="true"></span
          ><span class="lbl-vh">CNBC</span>
        </a>
        <a class="fs" href="https://www.youtube.com/redirect?q=https://berno22.github.io/cnbc.html"
           title="CNBC full screen" aria-label="CNBC full screen">
          <svg aria-hidden="true" focusable="false"><use href="#ico-fullscreen"></use></svg>
        </a>
      </div>
      <!-- CNBC Audio is hidden for now. Commented out rather than deleted, so
           it is one uncomment away. Note: a double hyphen is illegal inside an
           HTML comment and can end it early, so the markup below must not
           contain one, and neither may this note. -->
      <!--
      <a class="has-logo has-logo-inline" href="https://berno22.github.io/cnbcaudio/"
         aria-label="CNBC Audio">
        <span class="lg lg-cnbc" aria-hidden="true"></span><span>Audio</span>
      </a>
      -->
      <a class="has-logo" href="https://9dcba3301e02cb82.vpmbd45g3cfj.opentunnel.xyz">
        <span class="lg lg-siriusxm" aria-hidden="true"></span
        ><span class="lbl-vh">SiriusXM</span>
      </a>
      <a href="https://berno22.github.io/garagedoor/">Garage Door</a>
      <a class="has-logo has-logo-inline" href="https://berno22.github.io/cnbcinmotion/"
         aria-label="CNBC InMotion">
        <span class="lg lg-cnbc" aria-hidden="true"></span><span>InMotion</span>
      </a>
    </div>
  </body>
</html>
