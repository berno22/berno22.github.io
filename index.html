<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>berno22</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(51, 255, 110, 0.08), transparent),
          #000;
        color: #e8e8e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: min(420px, 90vw);
      }
      a {
        position: relative;
        display: block;
        text-decoration: none;
        color: #e8e8e8;
        background: #0d0d0d;
        border: 1px solid #262626;
        border-radius: 14px;
        padding: 18px 44px 18px 20px;
        font-size: 20px;
        font-weight: 500;
        text-align: center;
        letter-spacing: 0.02em;
        transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s,
                    color 0.25s, background 0.25s;
      }
      a::after {
        content: "\2192";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%) translateX(-6px);
        color: #33FF6E;
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
      }
      a:hover {
        border-color: #33FF6E;
        color: #fff;
        background: #131313;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(51, 255, 110, 0.15);
      }
      a:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
      a:active {
        transform: translateY(0) scale(0.98);
      }
      a:focus-visible {
        outline: 2px solid #33FF6E;
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        a { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <div class="links">
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/test/">Live TV</a>
      <a href="https://www.youtube.com/redirect?q=https://watchseries.bar/home">WatchSeries</a>
      <a href="https://www.youtube.com/redirect?q=https://webplay.serverguru.best/">Apollo Portal</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/test/f1.html">SSF1 (option)</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/cnbc.html">CNBC</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/radiostationusa.fm/">CNBC Radio</a>
    </div>
  </body>
</html>
