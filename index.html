<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>berno22</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse 70% 45% at 15% -10%, rgba(79, 110, 247, 0.10), transparent),
          radial-gradient(ellipse 70% 45% at 85% 110%, rgba(120, 140, 180, 0.12), transparent),
          linear-gradient(160deg, #f2f4f7 0%, #e2e6ec 55%, #d8dde4 100%);
        color: #232830;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: min(440px, 90vw);
      }
      a {
        position: relative;
        display: block;
        text-decoration: none;
        color: #2a3040;
        background: rgba(255, 255, 255, 0.82);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(35, 40, 48, 0.08);
        border-radius: 14px;
        padding: 17px 44px 17px 20px;
        font-size: 17px;
        font-weight: 600;
        text-align: center;
        letter-spacing: 0.01em;
        box-shadow: 0 1px 2px rgba(35, 40, 48, 0.05), 0 4px 14px rgba(35, 40, 48, 0.06);
        transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s,
                    color 0.25s, background 0.25s;
      }
      a::after {
        content: "\2192";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%) translateX(-6px);
        color: #4F6EF7;
        opacity: 0;
        transition: transform 0.25s, opacity 0.25s;
      }
      a:hover {
        border-color: rgba(79, 110, 247, 0.45);
        color: #1b2233;
        background: rgba(255, 255, 255, 0.97);
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(35, 40, 48, 0.12);
      }
      a:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }
      a:active {
        transform: translateY(0) scale(0.98);
      }
      a:focus-visible {
        outline: 2px solid #4F6EF7;
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        a { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="links">
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/test/">Live TV</a>
      <a href="https://www.youtube.com/redirect?q=https://watchseries.bar/home">WatchSeries</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/cinestream.html">CineStream</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/test/f1.html">SSF1 (option)</a>
      <a href="https://www.youtube.com/redirect?q=https://berno22.github.io/cnbc.html">CNBC</a>
      <a href="https://berno22.github.io/radiostationusa.fm/">CNBC Audio</a>
      <a href="http://96.244.150.95:8787">SiriusXM</a>
    </div>
  </body>
</html>
