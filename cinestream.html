<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CineStream v7</title>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;--bg2:#12121e;--surface:#1a1a2e;--surface2:#22223a;
  --border:#2a2a44;--text:#e8e8f0;--text2:#9494b8;--text3:#6a6a8e;
  --accent:#7c6cf0;--accent2:#9d8df8;--accent-glow:rgba(124,108,240,.25);
  --danger:#ef4444;--success:#22c55e;
  --card-radius:14px;--modal-radius:18px;
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --nav-h:60px;color-scheme:dark;
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;
  padding-top:calc(var(--nav-h) + env(safe-area-inset-top));
  padding-bottom:env(safe-area-inset-bottom);transition:background .3s,color .3s;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--nav-h);padding:0 16px;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top);
}
.nav-brand{
  font-size:1.15rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  display:flex;align-items:center;gap:6px;
}
.ver-badge{
  font-size:.55rem;font-weight:700;letter-spacing:.05em;
  color:var(--text3);border:1px solid var(--border);
  padding:2px 5px;border-radius:5px;
  -webkit-text-fill-color:var(--text3);
}
.nav-search{flex:1;max-width:360px;position:relative}
.nav-search input{
  width:100%;height:38px;padding:0 38px 0 38px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.875rem;
  outline:none;transition:border-color .2s,background .2s;
}
.nav-search input:focus{border-color:var(--accent);background:var(--surface2)}
.nav-search input::placeholder{color:var(--text3)}
.nav-search .si{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text3);pointer-events:none;
}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text2);font-size:.65rem;line-height:1;
  display:none;align-items:center;justify-content:center;transition:all .2s;
}
.search-clear.show{display:flex}
.search-clear:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.tabs{display:flex;gap:4px;padding:16px 16px 0;max-width:1400px;margin:0 auto}
.tab{
  padding:10px 24px;border-radius:10px;font-size:.9rem;font-weight:600;
  color:var(--text2);background:transparent;transition:all .25s;
}
.tab:hover{color:var(--text);background:var(--surface)}
.tab.active{color:#fff;background:var(--accent);box-shadow:0 4px 16px var(--accent-glow)}

.grid-wrap{max-width:1400px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
@media(min-width:420px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:18px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}}
.grid-sep{
  grid-column:1/-1;display:flex;align-items:center;gap:10px;
  font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text3);margin:8px 0 2px;
}
.grid-sep::before,.grid-sep::after{content:'';flex:1;height:1px;background:var(--border)}
.ext-badge{
  position:absolute;bottom:8px;right:8px;z-index:4;
  padding:2px 6px;border-radius:5px;font-size:.55rem;font-weight:700;
  background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.2);
}

.card{
  position:relative;border-radius:var(--card-radius);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;
  aspect-ratio:2/3;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.card:active{transform:scale(.97)}
.card-bg{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;text-align:center;
}
.card-bg .bg-icon{font-size:2.5rem;margin-bottom:8px;opacity:.6}
.card-bg .bg-label{
  font-size:.75rem;font-weight:700;line-height:1.3;opacity:.8;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card-bg .bg-year{font-size:.65rem;opacity:.5;margin-top:4px}
.card-poster{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .5s ease;
}
.card-poster.show{opacity:1}
.card-overlay{
  position:absolute;inset:0;z-index:3;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px;opacity:0;transition:opacity .25s;
}
.card:hover .card-overlay{opacity:1}
@media(hover:none){.card-overlay{opacity:1}}
@media(max-width:640px){.card-title,.card-meta{display:none}}
.card-title{
  font-size:.8rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:.7rem;color:var(--text2)}
.card-resume{
  position:absolute;top:8px;right:8px;z-index:4;
  padding:3px 8px;border-radius:6px;font-size:.6rem;font-weight:700;
  background:var(--success);color:#fff;
}

.load-more{display:flex;justify-content:center;padding:24px 16px 40px}
.load-btn{
  padding:12px 32px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:.9rem;font-weight:600;transition:all .25s;
}
.load-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 16px var(--accent-glow)}
.load-btn:disabled{opacity:.5;cursor:not-allowed}
.spinner{
  width:20px;height:20px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .6s linear infinite;display:inline-block;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.modal-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
}
.modal-backdrop.open{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:900px;max-height:90dvh;
  background:var(--bg2);border-radius:var(--modal-radius);
  border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  transform:translateY(20px) scale(.95);transition:transform .3s;
}
.modal-backdrop.open .modal{transform:translateY(0) scale(1)}
.modal-close{
  position:absolute;top:12px;right:12px;z-index:10;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;backdrop-filter:blur(8px);transition:background .2s;
}
.modal-close:hover{background:var(--accent)}
.modal-player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.modal-player iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.resume-overlay{
  position:absolute;inset:0;z-index:2;background:#05050c;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;text-align:center;animation:overlayIn .25s ease;
}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.resume-options{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modal-info{padding:20px;overflow-y:auto;flex:1}
.modal-title{font-size:1.3rem;font-weight:800;line-height:1.3;margin-bottom:8px}
.modal-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.modal-badge{
  padding:4px 10px;border-radius:8px;font-size:.75rem;font-weight:600;
  background:var(--surface);border:1px solid var(--border);color:var(--text2);
}
.sub-sync{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sub-sync-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-right:4px}
.sub-sync-btn{padding:4px 10px;border-radius:8px;font-size:.72rem;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--text2);transition:all .2s}
.sub-sync-btn:hover{border-color:var(--accent);color:var(--accent)}
.sub-sync-val{font-size:.75rem;font-weight:700;color:var(--accent);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.modal-badge#subSyncBadge{cursor:pointer}
.modal-badge.accent{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
.modal-badge#modalQuality{cursor:pointer}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{
  padding:10px 20px;border-radius:10px;font-size:.85rem;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:all .2s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);box-shadow:0 4px 16px var(--accent-glow)}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.tv-picker{margin-top:16px}
.tv-label{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.season-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:8px;-webkit-overflow-scrolling:touch}
.season-chip{flex:0 0 auto;padding:7px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:.8rem;font-weight:600;color:var(--text2);transition:all .2s}
.season-chip:hover{color:var(--text);border-color:var(--accent)}
.season-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:180px;overflow-y:auto;margin-top:8px}
.ep-btn{padding:9px 0;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:.75rem;font-weight:600;color:var(--text2);transition:all .2s}
.ep-btn:hover{color:var(--text);border-color:var(--accent)}
.ep-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ep-btn.done{color:var(--success)}

.status-msg{text-align:center;padding:60px 20px;color:var(--text2)}
.status-msg .icon{font-size:3rem;margin-bottom:12px}
.status-msg h3{font-size:1.1rem;color:var(--text);margin-bottom:6px}
.status-msg p{font-size:.85rem}
.retry-btn{
  margin-top:16px;padding:10px 24px;border-radius:10px;
  background:var(--accent);color:#fff;font-weight:600;font-size:.85rem;
}

.toast-container{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 20px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-size:.8rem;font-weight:500;
  box-shadow:var(--shadow);pointer-events:auto;
  animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px)}}

@media(max-width:480px){
  .nav-brand{font-size:1rem}
  .tab{padding:8px 16px;font-size:.8rem}
  .modal{max-width:100%;max-height:100dvh;border-radius:0}
  .modal-info{padding:14px}
  .modal-title{font-size:1.1rem}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">CineStream <span class="ver-badge">v7</span></div>
  <div class="nav-search">
    <svg class="si" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search movies & shows..." autocomplete="off" spellcheck="false">
    <button class="search-clear" id="searchClear" aria-label="Clear search">&#x2715;</button>
  </div>
</nav>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="movies">Movies</button>
  <button class="tab" data-tab="tv">TV Shows</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
  <div class="load-more" id="loadMore">
    <button class="load-btn" id="loadBtn">Load More</button>
  </div>
  <div class="status-msg" id="statusMsg" style="display:none"></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">&#x2715;</button>
    <div class="modal-player" id="modalPlayer"></div>
    <div class="modal-info">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="sub-sync" id="subSync" style="display:none">
        <span class="sub-sync-label">Sub sync</span>
        <button class="sub-sync-btn" data-o="-1">-1s</button>
        <button class="sub-sync-btn" data-o="-0.5">-0.5s</button>
        <span class="sub-sync-val" id="subOffsetLabel">0.0s</span>
        <button class="sub-sync-btn" data-o="0.5">+0.5s</button>
        <button class="sub-sync-btn" data-o="1">+1s</button>
        <button class="sub-sync-btn" data-o="reset">Reset</button>
      </div>
      <div class="tv-picker" id="tvPicker" style="display:none"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
(function(){
  'use strict';

  var API = 'https://vidsrcme.ru';
  var TMDB = 'https://api.themoviedb.org/3';
  var TMDB_KEY = 'dc34f6b9c0d6ef3e86d01e75d9919663';
  var IMG = 'https://image.tmdb.org/t/p/w500';
  var STORAGE_PREFIX = 'cs_';

  var currentTab = 'movies';
  var pages = { movies: 1, tv: 1 };
  var totalPages = { movies: Infinity, tv: Infinity };
  var loading = false;
  var allItems = { movies: [], tv: [] };
  var extResults = { movies: [], tv: [] };
  var currentModalItem = null;
  var posterCache = {};

  var $grid = document.getElementById('grid');
  var $loadBtn = document.getElementById('loadBtn');
  var $loadMore = document.getElementById('loadMore');
  var $statusMsg = document.getElementById('statusMsg');
  var $modal = document.getElementById('modal');
  var $modalPlayer = document.getElementById('modalPlayer');
  var $modalTitle = document.getElementById('modalTitle');
  var $modalMeta = document.getElementById('modalMeta');
  var $modalActions = document.getElementById('modalActions');
  var $tvPicker = document.getElementById('tvPicker');
  var $modalClose = document.getElementById('modalClose');
  var $searchInput = document.getElementById('searchInput');
  var $toasts = document.getElementById('toasts');

  try {
    var cached = localStorage.getItem(STORAGE_PREFIX + 'posters');
    if (cached) {
      var parsed = JSON.parse(cached);
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) posterCache = parsed;
    }
  } catch(e) {}
  function savePosterCache() {
    try { localStorage.setItem(STORAGE_PREFIX + 'posters', JSON.stringify(posterCache)); } catch(e) {}
  }

  var qualityCache = {};
  try {
    var qcached = localStorage.getItem(STORAGE_PREFIX + 'quality');
    if (qcached) {
      var qparsed = JSON.parse(qcached);
      if (qparsed && typeof qparsed === 'object' && !Array.isArray(qparsed)) qualityCache = qparsed;
    }
  } catch(e) {}
  function saveQualityCache() {
    try { localStorage.setItem(STORAGE_PREFIX + 'quality', JSON.stringify(qualityCache)); } catch(e) {}
  }
  function qualityKey(item) {
    var imdb = item.imdb_id || item.imdb || '';
    if (imdb.indexOf('tt') === 0) return imdb;
    return 'tmdb_' + (item.tmdb_id || item.tmdb || '');
  }
  function fileBase(name) {
    if (!name) return '';
    return String(name).replace(/\\/g, '/').split('/').pop();
  }
  function parseQuality(filename) {
    if (!filename) return null;
    filename = fileBase(filename);
    var res = filename.match(/(\d{3,4})p/i);
    var src = filename.match(/(WEB-?DL|WEB-?RIP|BRRIP|BLURAY|BDREMUX|HDTV|HDTS|CAM|TS|TELESYNC)/i);
    var r = res ? res[0].toUpperCase() : '';
    var s = src ? src[0].toUpperCase() : '';
    if (!r && !s) return null;
    return { raw: (r + (r && s ? ' ' : '') + s) || '', filename: filename };
  }
  function fetchItemQuality(item) {
    var key = qualityKey(item);
    if (!key) return Promise.resolve(null);
    var cachedQ = qualityCache[key];
    if (cachedQ && typeof cachedQ === 'object' && cachedQ.filename) return Promise.resolve(cachedQ);
    var type = item.type === 'tv' ? 'tv' : 'movie';
    var imdb = item.imdb_id || item.imdb || '';
    var idParam = imdb.indexOf('tt') === 0 ? 'imdb=' + imdb : 'tmdb=' + (item.tmdb_id || item.tmdb || '');
    if (!idParam) return Promise.resolve(null);
    return fetch(DATA + '/api.php?type=' + type + '&' + idParam)
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) {
        var q = parseQuality(d.data && d.data.file_name);
        if (q && q.raw) {
          qualityCache[key] = q;
          saveQualityCache();
          return q;
        }
        return null;
      })
      .catch(function() { return null; });
  }

  // ─── Tabs ───
  document.getElementById('tabs').addEventListener('click', function(e) {
    var tab = e.target.closest('.tab');
    if (!tab || tab.classList.contains('active')) return;
    document.querySelector('.tab.active').classList.remove('active');
    tab.classList.add('active');
    currentTab = tab.getAttribute('data-tab');
    $searchInput.value = '';
    extResults.movies = [];
    extResults.tv = [];
    updateClearBtn();
    renderGrid();
    if (allItems[currentTab].length === 0) loadPage();
  });

  // ─── API ───
  function fetchTimeout(url, ms) {
    return new Promise(function(resolve, reject) {
      var ctrl = 'AbortController' in window ? new AbortController() : null;
      var t = setTimeout(function() {
        if (ctrl) ctrl.abort();
        reject(new Error('Request timed out'));
      }, ms || 15000);
      fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
        .then(function(r) { clearTimeout(t); resolve(r); })
        .catch(function(e) { clearTimeout(t); reject(e); });
    });
  }
  function fetchUsReleases(type, page) {
    var path, params;
    if (type === 'tv') {
      path = '/discover/tv';
      params = '&with_origin_country=US';
    } else {
      path = '/discover/movie';
      params = '&region=US&with_release_type=2|3|6';
    }
    return fetchTimeout(TMDB + path + '?api_key=' + TMDB_KEY + params + '&sort_by=popularity.desc&page=' + page)
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) {
        var items = [];
        var res = d.results || [];
        for (var i = 0; i < res.length; i++) {
          var s = res[i];
          if (!s.id) continue;
          var date = type === 'tv' ? (s.first_air_date || '') : (s.release_date || '');
          var year = date.slice(0, 4);
          var key = 'tmdb_' + s.id;
          if (s.poster_path) posterCache[key] = IMG + s.poster_path;
          items.push({
            imdb_id: '',
            tmdb_id: s.id,
            title: (s.title || s.name || '') + (year ? ' ' + year : ''),
            quality: '',
            embed_url: API + '/embed/' + (type === 'tv' ? 'tv?tmdb=' : 'movie?tmdb=') + s.id,
            embed_url_tmdb: '',
            release_date: date,
            vote_average: s.vote_average || 0,
            _posterKey: key
          });
        }
        return { result: items, pages: Math.min(d.total_pages || 1, 500) };
      });
  }

  function loadPage() {
    if (loading) return;
    if (pages[currentTab] > totalPages[currentTab]) return;
    loading = true;
    $loadBtn.innerHTML = '<span class="spinner"></span>Loading...';
    $loadBtn.disabled = true;

    var fetcher = fetchUsReleases(currentTab === 'tv' ? 'tv' : 'movie', pages[currentTab]);

    fetcher
      .then(function(data) {
        totalPages[currentTab] = data.pages || Infinity;
        var items = data.result || [];
        for (var i = 0; i < items.length; i++) items[i].type = currentTab;
        allItems[currentTab] = allItems[currentTab].concat(items);
        pages[currentTab]++;
        renderGrid();
        fetchPostersForItems(items);
      })
      .catch(function(e) {
        showStatus('<div class="icon">\u26A0\uFE0F</div><h3>Failed to load</h3><p>' + esc(e.message) + '</p><button class="retry-btn" onclick="location.reload()">Retry</button>');
      })
      .then(function() {
        loading = false;
        $loadBtn.innerHTML = 'Load More';
        $loadBtn.disabled = false;
        $loadMore.style.display = (pages[currentTab] > totalPages[currentTab] || ($searchInput.value || '').trim()) ? 'none' : '';
      });
  }

  function showStatus(html) {
    $statusMsg.style.display = 'block';
    $statusMsg.innerHTML = html;
  }
  function hideStatus() {
    $statusMsg.style.display = 'none';
  }

  // ─── Posters via TMDB (95% coverage, cached) ───
  function fetchPostersForItems(items) {
    var jobs = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var key = it.imdb_id || (it.tmdb_id ? 'tmdb_' + it.tmdb_id : '');
      if (!key || key in posterCache) continue;
      jobs.push({ key: key, tmdb_id: it.tmdb_id || null, imdb_id: it.imdb_id || null, tv: it.type === 'tv' });
    }
    if (!jobs.length) return;
    var batch = 10, idx = 0;
    function next() {
      if (idx >= jobs.length) return;
      var end = Math.min(idx + batch, jobs.length);
      var ps = [];
      for (var j = idx; j < end; j++) ps.push(fetchOnePoster(jobs[j]));
      idx = end;
      Promise.all(ps).then(function() { setTimeout(next, 100); });
    }
    next();
  }

  function fetchOnePoster(job) {
    if (job.key in posterCache) return Promise.resolve(posterCache[job.key] || null);
    var url;
    if (job.tmdb_id) {
      url = TMDB + '/' + (job.tv ? 'tv' : 'movie') + '/' + job.tmdb_id + '?api_key=' + TMDB_KEY;
    } else {
      url = TMDB + '/find/' + encodeURIComponent(job.imdb_id) + '?api_key=' + TMDB_KEY + '&external_source=imdb_id';
    }
    return fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var p;
        if (job.tmdb_id) {
          p = d.poster_path || null;
        } else {
          var res = (d.movie_results && d.movie_results[0]) || (d.tv_results && d.tv_results[0]) || null;
          p = (res && res.poster_path) || null;
        }
        if (p) {
          posterCache[job.key] = IMG + p;
          savePosterCache();
          setPosterSrc(job.key, posterCache[job.key]);
          return posterCache[job.key];
        }
        posterCache[job.key] = '';
        savePosterCache();
        removePosterImgs(job.key);
        return null;
      })
      .catch(function() { return null; });
  }

  var IMG_FALLBACK = 'https://img.omdbapi.com/?apikey=trilogy&h=600&i=';

  function removePosterImgs(imdbId) {
    var imgs = $grid.querySelectorAll('.card-poster[data-imdb="' + imdbId + '"]');
    for (var i = 0; i < imgs.length; i++) {
      if (!imgs[i].src) imgs[i].remove();
    }
  }

  function setPosterSrc(imdbId, url) {
    var imgs = $grid.querySelectorAll('.card-poster[data-imdb="' + imdbId + '"]');
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      if (img.src && img.src !== url) continue;
      img.onload = function() { this.classList.add('show'); };
      img.onerror = function() { posterFallback(this, imdbId); };
      img.src = url;
    }
  }

  function posterFallback(img, key) {
    if (key.indexOf('tt') !== 0) { img.remove(); return; }
    var alt = IMG_FALLBACK + encodeURIComponent(key);
    img.onload = function() {
      this.classList.add('show');
      posterCache[key] = alt;
      savePosterCache();
    };
    img.onerror = function() {
      this.remove();
      posterCache[key] = '';
      savePosterCache();
    };
    img.src = alt;
  }

  function applyCachedPosters() {
    var imgs = $grid.querySelectorAll('.card-poster[data-imdb]');
    for (var i = 0; i < imgs.length; i++) {
      var img = imgs[i];
      var id = img.getAttribute('data-imdb');
      if (!(id in posterCache)) continue;
      var url = posterCache[id];
      if (!url) { img.remove(); continue; }
      img.onload = function() { this.classList.add('show'); };
      img.onerror = function() { posterFallback(this, id); };
      if (!img.src) img.src = url;
      if (img.complete && img.naturalWidth > 0) img.classList.add('show');
    }
  }

  // ─── TMDB universal search (movies + shows) ───
  function mapResults(d, type) {
    var out = [];
    var res = d.results || [];
    var tv = type === 'tv';
    for (var i = 0; i < res.length; i++) {
      var s = res[i];
      if (!s.id) continue;
      var year = (s.release_date || s.first_air_date || '').slice(0, 4);
      var title = (s.title || s.name || '') + (year ? ' ' + year : '');
      var key = 'tmdb_' + s.id;
      if (s.poster_path) posterCache[key] = IMG + s.poster_path;
      out.push({
        imdb_id: '',
        tmdb_id: s.id,
        title: title,
        quality: '',
        embed_url: API + '/embed/' + (tv ? 'tv?tmdb=' : 'movie?tmdb=') + s.id,
        embed_url_tmdb: '',
        _ext: true,
        type: type,
        vote_average: s.vote_average || 0,
        _posterKey: key
      });
    }
    return out;
  }

  function universalSearch(q) {
    Promise.all([
      fetch(TMDB + '/search/movie?api_key=' + TMDB_KEY + '&query=' + encodeURIComponent(q)).then(function(r) { return r.json(); }).catch(function() { return { results: [] }; }),
      fetch(TMDB + '/search/tv?api_key=' + TMDB_KEY + '&query=' + encodeURIComponent(q)).then(function(r) { return r.json(); }).catch(function() { return { results: [] }; })
    ]).then(function(res) {
      extResults.movies = mapResults(res[0], 'movie');
      extResults.tv = mapResults(res[1], 'tv');
      savePosterCache();
      renderGrid();
    });
  }

  // ─── Helpers ───
  function esc(s) { return s ? String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }
  function escA(s) { return s ? String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;') : ''; }

  var gradients = [
    ['#1a1a3e','#2d1b69'], ['#1a2a3e','#1b4b69'], ['#2a1a3e','#691b4b'],
    ['#1a3e2a','#1b6945'], ['#3e1a1a','#69291b'], ['#2a2a1a','#695e1b'],
    ['#1a2e3e','#1b5669'], ['#3e1a2e','#691b56'], ['#2e3e1a','#56691b'],
    ['#1a1a2e','#3d3d69'], ['#2e1a3e','#563d69'], ['#3e2e1a','#69563d']
  ];
  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i) | 0; return Math.abs(h); }
  function getGradient(title) { var g = gradients[hashStr(title) % gradients.length]; return 'linear-gradient(145deg,' + g[0] + ',' + g[1] + ')'; }

  function getYear(title) {
    var m = title.match(/(\d{4})/);
    return m ? parseInt(m[1], 10) : 0;
  }
  function getCleanTitle(title) {
    return title.replace(/\s*\(?(?:TV Series|TV Mini Series)?\s*\d{4}(?:\u2013\s*)?\)?\s*$/i, '').trim() || title;
  }
  function sortItems(items) {
    return items.slice().sort(function(a, b) {
      return getYear(b.title || b.show_title || '') - getYear(a.title || a.show_title || '');
    });
  }

  // ─── Render Grid ───
  function renderGrid() {
    var q = ($searchInput.value || '').trim().toLowerCase();
    var local = [], extM = [], extT = [];

    if (q) {
      var merged = allItems.movies.concat(allItems.tv);
      var sorted = sortItems(merged);
      for (var i = 0; i < sorted.length; i++) {
        var t = (sorted[i].title || sorted[i].show_title || '').toLowerCase();
        if (t.indexOf(q) !== -1) local.push(sorted[i]);
      }
      extM = extResults.movies;
      extT = extResults.tv;
    } else {
      local = sortItems(allItems[currentTab]);
    }

    if (q && local.length === 0 && extM.length === 0 && extT.length === 0) {
      $grid.innerHTML = '';
      $loadMore.style.display = 'none';
      showStatus('<div class="icon">\u{1F50D}</div><h3>Nothing found</h3><p>No match for "' + esc(q) + '"</p>');
      return;
    }

    hideStatus();
    $loadMore.style.display = q ? 'none' : '';

    var html = '';
    if (q) {
      if (local.length) {
        html += '<div class="grid-sep">Recent</div>';
        for (var li = 0; li < local.length; li++) html += cardHtml(local[li]);
      }
      if (extM.length) {
        html += '<div class="grid-sep">Movies</div>';
        for (var mi = 0; mi < extM.length; mi++) html += cardHtml(extM[mi]);
      }
      if (extT.length) {
        html += '<div class="grid-sep">TV Shows</div>';
        for (var ti = 0; ti < extT.length; ti++) html += cardHtml(extT[ti]);
      }
    } else {
      for (var gi = 0; gi < local.length; gi++) html += cardHtml(local[gi]);
    }

    $grid.innerHTML = html;
    applyCachedPosters();
  }

  function cardHtml(item) {
    var rawTitle = item.title || item.show_title || 'Untitled';
    var id = item.imdb_id || item.tmdb_id || '';
    var type = item.type || (currentTab === 'tv' ? 'tv' : 'movie');
    var resume = type === 'tv' ? getShowResume(id) : getResume(STORAGE_PREFIX + 'r_' + id);
    var quality = item.quality || '';
    if (!quality) {
      var qc = qualityCache[qualityKey(item)];
      if (qc && typeof qc === 'object') quality = qc.raw || '';
    }
    var year = item.release_date ? (parseInt(item.release_date.slice(0, 4), 10) || 0) : getYear(rawTitle);
    var rating = item.vote_average >= 5 ? '\u2605 ' + item.vote_average.toFixed(1) : '';
    var cleanTitle = getCleanTitle(rawTitle);
    var icon = type === 'tv' ? '\u{1F4FA}' : '\u{1F3AC}';
    var gradient = getGradient(rawTitle);
    var imdbId = item.imdb_id || '';

    var mins = resume ? Math.floor(resume.progress / 60) : 0;
    var secs = resume ? Math.floor(resume.progress % 60) : 0;
    var resumeText = resume ? (resume.season ? 'S' + resume.season + 'E' + resume.episode + ' ' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs : '';

    var h = '<div class="card" data-id="' + escA(id) + '" data-tmdb="' + escA(item.tmdb_id || '') + '" data-imdb="' + escA(imdbId) + '" data-title="' + escA(cleanTitle) + '" data-year="' + year + '" data-quality="' + escA(quality) + '" data-rating="' + (item.vote_average || '') + '" data-type="' + type + '" data-embed="' + escA(item.embed_url || '') + '" data-embed-tmdb="' + escA(item.embed_url_tmdb || '') + '">';

    h += '<div class="card-bg" style="background:' + gradient + '">';
    h += '<div class="bg-icon">' + icon + '</div>';
    h += '<div class="bg-label">' + esc(cleanTitle) + '</div>';
    if (year) h += '<div class="bg-year">' + year + '</div>';
    h += '</div>';

    var posterKey = imdbId || item._posterKey || '';

    if (posterKey) {
      h += '<img class="card-poster" data-imdb="' + escA(posterKey) + '" alt="' + escA(cleanTitle) + '" loading="lazy">';
    }

    if (resume) h += '<div class="card-resume">\u25B6 ' + resumeText + '</div>';
    h += '<div class="card-overlay">';
    h += '<div class="card-title">' + esc(cleanTitle) + '</div>';
    h += '<div class="card-meta">';
    if (year) h += '<span>' + year + '</span>';
    if (item.season) h += '<span>S' + item.season + 'E' + (item.episode || '?') + '</span>';
    h += '</div></div>';
    h += '</div>';
    return h;
  }

  // ─── Search ───
  var searchTimer = null;
  var $searchClear = document.getElementById('searchClear');

  function updateClearBtn() {
    $searchClear.classList.toggle('show', !!($searchInput.value || '').trim());
  }

  $searchClear.addEventListener('click', function() {
    $searchInput.value = '';
    extResults.movies = [];
    extResults.tv = [];
    renderGrid();
    updateClearBtn();
    $searchInput.focus();
  });

  $searchInput.addEventListener('input', function() {
    if (searchTimer) clearTimeout(searchTimer);
    updateClearBtn();
    searchTimer = setTimeout(function() {
      renderGrid();
      var q = ($searchInput.value || '').trim();
      if (q) universalSearch(q);
      else { extResults.movies = []; extResults.tv = []; }
    }, 300);
  });

  // ─── Load More ───
  $loadBtn.addEventListener('click', loadPage);

  // ─── Infinite Scroll ───
  if ('IntersectionObserver' in window) {
    var scrollObs = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting && !loading && !($searchInput.value || '').trim()) {
        loadPage();
      }
    }, { rootMargin: '400px' });
    scrollObs.observe($loadMore);
  }

  // ─── Card Click ───
  $grid.addEventListener('click', function(e) {
    var card = e.target.closest('.card');
    if (!card) return;
    openModal({
      id: card.getAttribute('data-id'),
      tmdb: card.getAttribute('data-tmdb'),
      imdb: card.getAttribute('data-imdb'),
      title: card.getAttribute('data-title'),
      year: card.getAttribute('data-year'),
      quality: card.getAttribute('data-quality'),
      rating: parseFloat(card.getAttribute('data-rating')) || 0,
      type: card.getAttribute('data-type'),
      embedUrl: card.getAttribute('data-embed'),
      embedUrlTmdb: card.getAttribute('data-embed-tmdb')
    });
  });

  // ─── Modal ───
  var tvSeasons = [], tvEpisodes = [], selSeason = 1, selEpisode = 1, tvTmdbId = null;

  function openModal(item) {
    currentModalItem = item;
    tvSeasons = []; tvEpisodes = []; tvTmdbId = null;
    selSeason = 1; selEpisode = 1;
    var resume = item.type === 'tv' ? getShowResume(item.id) : getResume(STORAGE_PREFIX + 'r_' + item.id);
    if (resume && resume.season) {
      selSeason = resume.season;
      selEpisode = resume.episode;
    }

    $modalTitle.textContent = item.title + (item.year && item.year !== '0' ? ' (' + item.year + ')' : '');

    renderModalMeta(item);

    var resumeHtml = '';
    $modalPlayer.innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer" id="playerStart">' +
      '<div style="text-align:center;color:#fff"><div style="font-size:3rem;margin-bottom:8px">\u25B6</div>' +
      '<div style="font-size:.9rem;opacity:.7">Click to play</div></div></div>';

    if (resume) {
      var rm = Math.floor(resume.progress / 60);
      var rs = Math.floor(resume.progress % 60);
      var rLabel = item.type === 'tv' ? 'S' + resume.season + 'E' + resume.episode + ' ' : '';
      $modalPlayer.innerHTML +=
        '<div class="resume-overlay" id="resumeOverlay">' +
        '<div style="font-size:.95rem;font-weight:700;color:#fff;margin-bottom:6px">' + esc(item.title) + '</div>' +
        '<div style="font-size:.8rem;color:#fff;opacity:.75;margin-bottom:16px">You watched ' + rLabel + 'up to ' + rm + ':' + (rs < 10 ? '0' : '') + rs + '</div>' +
        '<div class="resume-options">' +
        '<button class="btn btn-primary" id="resumeBtn">\u25B6 Resume at ' + rm + ':' + (rs < 10 ? '0' : '') + rs + '</button>' +
        '<button class="btn btn-ghost" id="startBtn">Play from start</button>' +
        '</div></div>';
    }

    $modalActions.innerHTML =
      (item.imdb && item.imdb.indexOf('tt') === 0 ? '<a class="btn btn-ghost" href="https://www.imdb.com/title/' + escA(item.imdb) + '" target="_blank" rel="noopener">IMDB \u2197</a>' : '');

    if (item.type === 'tv') {
      $tvPicker.style.display = 'block';
      $tvPicker.innerHTML = '<div class="tv-label">Season</div><div class="season-row" id="tvSeasons"></div>' +
        '<div class="tv-label" style="margin-top:12px">Episode</div>' +
        '<div class="ep-grid" id="tvEpisodes"><div class="tv-label" style="grid-column:1/-1">Loading episodes...</div></div>';
      loadTvMeta(item);
    } else {
      $tvPicker.style.display = 'none';
    }

    document.getElementById('playerStart').addEventListener('click', function() { startPlayer(false); });
    $subSync.style.display = 'none';
    $subOffsetLabel.textContent = '0.0s';
    subOffset = 0;
    subActiveLang = '';
    desiredSubLang = '';
    var badge = document.getElementById('subSyncBadge');
    if (badge) badge.classList.remove('accent');
    var ro = document.getElementById('resumeOverlay');
    if (ro) {
      var rb = document.getElementById('resumeBtn');
      var sb = document.getElementById('startBtn');
      if (rb) rb.addEventListener('click', function() { ro.style.display = 'none'; startPlayer(true); });
      if (sb) sb.addEventListener('click', function() { ro.style.display = 'none'; startPlayer(false); });
    }

    $modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    if (!item.quality) {
      fetchItemQuality(item).then(function(q) {
        if (q && q.raw) {
          item.quality = q.raw;
          renderModalMeta(item);
          renderGrid();
        }
      });
    }
  }

  function renderModalMeta(item) {
    $modalMeta.innerHTML =
      (item.quality ? '<div class="modal-badge" id="modalQuality">' + esc(item.quality) + '</div>' : '') +
      (item.rating >= 5 ? '<div class="modal-badge">\u2605 ' + item.rating.toFixed(1) + '</div>' : '') +
      '<div class="modal-badge">' + (item.type === 'tv' ? 'TV Show' : 'Movie') + '</div>' +
      (item.year && item.year !== '0' ? '<div class="modal-badge">' + esc(item.year) + '</div>' : '') +
      '<div class="modal-badge sub-sync-badge" id="subSyncBadge">SUB SYNC</div>' +
      (item.imdb && item.imdb.indexOf('tt') === 0 ? '<div class="modal-badge">IMDB: ' + esc(item.imdb) + '</div>' : '');
  }

  $modalMeta.addEventListener('click', function(e) {
    if (e.target.closest('#subSyncBadge')) {
      var shown = $subSync.style.display === 'flex';
      $subSync.style.display = shown ? 'none' : 'flex';
      e.target.closest('#subSyncBadge').classList.toggle('accent', !shown);
      return;
    }
    if (!e.target.closest('#modalQuality')) return;
    var item = currentModalItem;
    if (!item) return;
    var cached = qualityCache[qualityKey(item)];
    if (cached && typeof cached === 'object' && cached.filename) {
      showToast(fileBase(cached.filename), 5000);
      return;
    }
    fetchItemQuality(item).then(function(q) {
      if (q && q.filename) showToast(fileBase(q.filename), 5000);
    });
  });

  function loadTvMeta(item) {
    if (item.tmdb) {
      tvTmdbId = item.tmdb;
      fetchTvSeasons();
    } else if (item.imdb) {
      fetch(TMDB + '/find/' + encodeURIComponent(item.imdb) + '?api_key=' + TMDB_KEY + '&external_source=imdb_id')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var res = (d.tv_results && d.tv_results[0]) || (d.movie_results && d.movie_results[0]);
          if (res && res.id) {
            tvTmdbId = res.id;
            fetchTvSeasons();
          } else {
            $tvPicker.innerHTML = '<div class="tv-label">Episodes unavailable</div>';
          }
        })
        .catch(function() { $tvPicker.innerHTML = '<div class="tv-label">Episodes unavailable</div>'; });
    } else {
      $tvPicker.innerHTML = '<div class="tv-label">Episodes unavailable</div>';
    }
  }

  function fetchTvSeasons() {
    fetch(TMDB + '/tv/' + tvTmdbId + '?api_key=' + TMDB_KEY)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        tvSeasons = (d.seasons || []).filter(function(s) { return s.season_number > 0 && s.episode_count > 0; })
          .map(function(s) { return { n: s.season_number, count: s.episode_count }; });
        if (!tvSeasons.length) {
          $tvPicker.innerHTML = '<div class="tv-label">Episodes unavailable</div>';
          return;
        }
        if (!tvSeasons.some(function(s) { return s.n === selSeason; })) {
          selSeason = tvSeasons[0].n;
          selEpisode = 1;
        }
        loadTvEpisodes(selSeason);
      })
      .catch(function() { $tvPicker.innerHTML = '<div class="tv-label">Episodes unavailable</div>'; });
  }

  function loadTvEpisodes(seasonN) {
    fetch(TMDB + '/tv/' + tvTmdbId + '/season/' + seasonN + '?api_key=' + TMDB_KEY)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        tvEpisodes = (d.episodes || []).map(function(e) { return { n: e.episode_number, name: e.name }; });
        if (tvEpisodes.length && !tvEpisodes.some(function(e) { return e.n === selEpisode; })) {
          selEpisode = tvEpisodes[0].n;
        }
        renderTvPicker();
      })
      .catch(function() { $tvPicker.innerHTML = '<div class="tv-label">Episodes unavailable</div>'; });
  }

  function renderTvPicker() {
    var seasonsHtml = tvSeasons.map(function(s) {
      return '<button class="season-chip' + (s.n === selSeason ? ' active' : '') + '" data-s="' + s.n + '">S' + s.n + '</button>';
    }).join('');
    var epsHtml = tvEpisodes.map(function(e) {
      return '<button class="ep-btn' + (e.n === selEpisode ? ' active' : '') + '" data-e="' + e.n + '" title="' + escA(e.name || '') + '">' + e.n + '</button>';
    }).join('');
    if (!epsHtml) epsHtml = '<div class="tv-label" style="grid-column:1/-1">No episodes</div>';
    $tvPicker.innerHTML =
      '<div class="tv-label">Season</div><div class="season-row" id="tvSeasons">' + seasonsHtml + '</div>' +
      '<div class="tv-label" style="margin-top:12px">Episode</div>' +
      '<div class="ep-grid" id="tvEpisodes">' + epsHtml + '</div>';
  }

  $tvPicker.addEventListener('click', function(e) {
    var sc = e.target.closest('.season-chip');
    if (sc) {
      selSeason = parseInt(sc.getAttribute('data-s'), 10);
      selEpisode = 1;
      tvEpisodes = [];
      renderTvPicker();
      loadTvEpisodes(selSeason);
      return;
    }
    var eb = e.target.closest('.ep-btn');
    if (eb) {
      selEpisode = parseInt(eb.getAttribute('data-e'), 10);
      renderTvPicker();
    }
  });

  function currentResumeKey() {
    if (!currentModalItem) return '';
    if (currentModalItem.type === 'tv') {
      return STORAGE_PREFIX + 'r_' + currentModalItem.id + '_' + selSeason + '_' + selEpisode;
    }
    return STORAGE_PREFIX + 'r_' + currentModalItem.id;
  }

  // ─── Native ad-free player (direct HLS stream, no iframe) ───
  var DATA = 'https://data.vidsrcme.ru';
  var nativeVideo = null;
  var nativeAttempts = 0;

  function b64ToU8(b64) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  function decryptStreams(j) {
    if (j && j.data && Array.isArray(j.data.stream_urls)) return Promise.resolve(j.data.stream_urls);
    if (!(j && j.vs && typeof j.data.stream_urls === 'string')) return Promise.reject(new Error('No streams in API response'));
    var modP;
    if (j.vs.wasm_url) {
      modP = fetch(j.vs.wasm_url, { credentials: 'omit' })
        .then(function(r) { return r.arrayBuffer(); })
        .then(function(b) { return WebAssembly.compile(b); });
    } else if (j.vs.wasm) {
      var bytes = b64ToU8(j.vs.wasm);
      modP = WebAssembly.compile(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
    } else {
      return Promise.reject(new Error('No decryptor'));
    }
    return modP
      .then(function(mod) { return WebAssembly.instantiate(mod, {}); })
      .then(function(inst) {
        var ex = inst.exports, enc = b64ToU8(j.data.stream_urls);
        var ptr = ex.alloc(enc.length);
        new Uint8Array(ex.memory.buffer, ptr, enc.length).set(enc);
        var outLen = ex.decrypt(ptr, enc.length);
        return new TextDecoder().decode(new Uint8Array(ex.memory.buffer, ptr + 12, outLen));
      })
      .then(function(txt) { return txt.split('\n').filter(function(s) { return s; }); });
  }

  function streamApiUrl(item, season, episode) {
    var type = item.type === 'tv' ? 'tv' : 'movie';
    var idPart = item.imdb && item.imdb.indexOf('tt') === 0 ? 'imdb=' + item.imdb : 'tmdb=' + (item.tmdb || '');
    var u = DATA + '/api.php?type=' + type + '&' + idPart;
    if (type === 'tv') u += '&season=' + season + '&episode=' + episode;
    return u + '&stream_urls';
  }

  function showNativeError(msg, item, season, episode) {
    var embedUrl = buildEmbedUrl(item, season, episode);
    $modalPlayer.innerHTML =
      '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;padding:20px;text-align:center">' +
      '<div style="font-size:2.2rem;margin-bottom:10px">\u26A0\uFE0F</div>' +
      '<div style="font-size:.9rem;margin-bottom:4px">' + esc(msg) + '</div>' +
      '<div style="font-size:.75rem;opacity:.55;margin-bottom:16px">Streams may be temporarily unavailable, or this browser blocks direct playback (Safari recommended)</div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">' +
      '<button class="btn btn-primary" id="nativeRetry">Try Again</button>' +
      '<button class="btn btn-ghost" id="nativeWebPlayer">Open Web Player</button>' +
      '</div></div>';
    document.getElementById('nativeRetry').addEventListener('click', function() { playNative(item, season, episode, 0); });
    document.getElementById('nativeWebPlayer').addEventListener('click', function() { window.open(embedUrl, '_blank', 'noopener'); });
  }

  function fetchStreamsRetry(url, attempts) {
    attempts = attempts || 3;
    return fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(j) {
        if (j && j.status_code === 404 && attempts > 1) {
          return new Promise(function(res) { setTimeout(res, 1500); })
            .then(function() { return fetchStreamsRetry(url, attempts - 1); });
        }
        return j;
      });
  }

  function pickBestVariant(text) {
    var lines = String(text || '').split('\n');
    var best = null;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf('#EXT-X-STREAM-INF') !== 0) continue;
      var uri = lines[i + 1] ? lines[i + 1].trim() : '';
      if (!uri || uri.charAt(0) === '#') continue;
      var bw = 0, res = 0, fps = 0;
      var m = lines[i].match(/BANDWIDTH=(\d+)/);
      if (m) bw = parseInt(m[1], 10);
      var r = lines[i].match(/RESOLUTION=(\d+)x(\d+)/);
      if (r) res = parseInt(r[2], 10);
      var f = lines[i].match(/FRAME-RATE=([\d.]+)/);
      if (f) fps = parseFloat(f[1]);
      if (!best || bw > best.bw) best = { uri: uri, bw: bw, res: res, fps: fps };
    }
    return best;
  }

  function playNative(item, season, episode, resumeSeconds) {
    if (nativeAttempts > 1) { showNativeError('Stream unavailable', item, season, episode); return; }
    nativeAttempts++;
    var started = false;

    $modalPlayer.innerHTML =
      '<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff">' +
      '<div class="spinner" style="width:34px;height:34px;border-width:3px"></div>' +
      '<div style="font-size:.85rem;opacity:.7;margin-top:14px">Loading stream...</div></div>';

    fetchStreamsRetry(streamApiUrl(item, season, episode))
      .then(function(j) {
        subImdbId = (j && j.data && j.data.imdb_id) || '';
        return decryptStreams(j);
      })
      .then(function(urls) {
        var master = urls[0];
        var origin = new URL(master).origin;
        return fetch(origin + '/generate.php', { credentials: 'omit' })
          .then(function(r) { return r.text(); })
          .then(function(tk) { return (tk || '').trim(); })
          .then(function(tk) { return master + (master.indexOf('?') > -1 ? '&' : '?') + 'token=' + encodeURIComponent(tk); });
      })
      .then(function(playUrl) {
        return fetch(playUrl).then(function(r) { return r.text(); }).then(function(text) {
          var v = pickBestVariant(text);
          videoFps = v ? (v.fps || 0) : 0;
          if (!v) return playUrl;
          var params = playUrl.indexOf('?') > -1 ? playUrl.split('?')[1] : '';
          var bestUrl;
          if (/^https?:\/\//i.test(v.uri)) {
            bestUrl = v.uri;
          } else {
            var origin = new URL(playUrl).origin;
            bestUrl = origin + (v.uri.charAt(0) === '/' ? '' : '/') + v.uri;
          }
          if (params && bestUrl.indexOf('?') === -1) bestUrl += '?' + params;
          return bestUrl;
        });
      })
      .then(function(playUrl) {
        if (!currentModalItem) return;
        started = true;
        $modalPlayer.innerHTML = '<video id="nativeVideo" controls autoplay playsinline preload="auto" style="width:100%;height:100%;background:#000"></video>';
        nativeVideo = document.getElementById('nativeVideo');
        hookNativeEvents(item, season, episode, resumeSeconds);
        nativeVideo.src = playUrl;
        if (subImdbId) loadSubsForVideo(nativeVideo, subImdbId, item.type === 'tv' ? season : null, item.type === 'tv' ? episode : null);
      })
      .catch(function(e) {
        if (!started) nativeFail(item, season, episode, 'Stream unavailable');
      });
  }

  function nativeFail(item, season, episode, msg) {
    if (!currentModalItem) return;
    destroyNativePlayer();
    showNativeError(msg, item, season, episode);
  }

  function destroyNativePlayer() {
    if (nativeVideo) { nativeVideo.pause(); nativeVideo.removeAttribute('src'); nativeVideo.load(); clearSubTracks(nativeVideo); nativeVideo = null; }
    subCues = {}; subTracks = {}; videoFps = 0; subActiveLang = '';
  }

  // ─── Subtitles (OpenSubtitles REST API, CORS-enabled) ───
  var subCache = {};
  var subImdbId = '';
  var subCues = {};
  var subTracks = {};
  var subOffset = 0;
  var videoFps = 0;

  function fetchSubs(imdbId, season, episode) {
    imdbId = String(imdbId || '').replace(/^tt/i, '');
    if (!imdbId) return Promise.resolve([]);
    var key = imdbId + (season ? '_' + season + '_' + episode : '');
    if (subCache[key]) return Promise.resolve(subCache[key]);
    var url = 'https://rest.opensubtitles.org/search/imdbid-' + imdbId;
    if (season && episode) url = 'https://rest.opensubtitles.org/search/episode-' + episode + '/imdbid-' + imdbId + '/season-' + season;
    return fetch(url, { headers: { 'X-User-Agent': 'trailers.to-UA' } })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d) { subCache[key] = Array.isArray(d) ? d : []; return subCache[key]; })
      .catch(function() { return []; });
  }

  function srtToVtt(text) {
    if (!text) return '';
    text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    if (/^WEBVTT/i.test(text.trim())) return text;
    var lines = text.split('\n');
    var out = ['WEBVTT\n'];
    var tsRe = /((?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3})\s*-->\s*((?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3})(.*)/;
    function fix(ts) {
      ts = ts.replace(',', '.');
      if (ts.indexOf(':') === ts.lastIndexOf(':')) ts = '00:' + ts;
      return ts;
    }
    var i = 0;
    while (i < lines.length) {
      var m = lines[i].trim().match(tsRe);
      if (!m) { i++; continue; }
      var start = fix(m[1]), end = fix(m[2]), settings = m[3] || '';
      i++;
      var cueText = [];
      while (i < lines.length) {
        var line = lines[i].trim();
        if (!line) { i++; continue; }
        if (tsRe.test(line)) break;
        if (/^\d+$/.test(line)) {
          var j = i + 1;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j < lines.length && tsRe.test(lines[j].trim())) { i = j; break; }
        }
        cueText.push(line);
        i++;
      }
      if (cueText.length) out.push(start + ' --> ' + end + settings + '\n' + cueText.join('\n') + '\n');
    }
    return out.join('\n');
  }

  function subToVtt(sub) {
    return fetch(sub.SubDownloadLink, { credentials: 'omit' })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function(buf) {
        var u8 = new Uint8Array(buf);
        if (u8.length > 2 && u8[0] === 0x1f && u8[1] === 0x8b) {
          if (!('DecompressionStream' in window)) throw new Error('No gzip support');
          return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
        }
        return buf;
      })
      .then(function(buf) {
        var enc = String(sub.SubEncoding || 'UTF-8').toUpperCase();
        if (enc === 'ASCII' || enc === 'UTF-8' || enc === 'UTF8') enc = 'utf-8';
        else if (enc === 'CP1252') enc = 'windows-1252';
        else if (enc === 'CP1253') enc = 'windows-1253';
        var text;
        try { text = new TextDecoder(enc).decode(buf); } catch (e) { text = new TextDecoder('utf-8').decode(buf); }
        if (text.indexOf('\uFFFD') > -1) text = new TextDecoder('utf-8').decode(buf);
        return srtToVtt(text);
      })
      .catch(function() { return ''; });
  }

  function parseVttCues(vttText) {
    var cues = [];
    if (!vttText) return cues;
    var lines = vttText.split('\n');
    var tsRe = /^((?:\d{1,2}:)?\d{2}:\d{2}\.\d{1,3})\s*-->\s*((?:\d{1,2}:)?\d{2}:\d{2}\.\d{1,3})(.*)$/;
    function toSec(ts) {
      var p = ts.split(':');
      while (p.length < 3) p.unshift('0');
      var parts = p[2].split('.');
      return (+p[0]) * 3600 + (+p[1]) * 60 + (+parts[0]) + (+('0.' + (parts[1] || '0')));
    }
    var i = 0;
    while (i < lines.length) {
      var m = lines[i].trim().match(tsRe);
      if (!m) { i++; continue; }
      var start = toSec(m[1]), end = toSec(m[2]), settings = m[3] || '';
      i++;
      var text = [];
      while (i < lines.length && lines[i].trim() && lines[i].indexOf('-->') === -1) { text.push(lines[i]); i++; }
      if (text.length) cues.push({ start: start, end: end, settings: settings, text: text.join('\n') });
    }
    return cues;
  }

  function cuesToVtt(cues, offset) {
    function fmt(sec) {
      sec = Math.max(0, sec + (offset || 0));
      var h = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
      var ms = Math.round((sec % 1) * 1000);
      return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm + ':' + (s < 10 ? '0' : '') + s + '.' +
        (ms < 100 ? (ms < 10 ? '00' : '0') : '') + ms;
    }
    var out = ['WEBVTT\n'];
    for (var i = 0; i < cues.length; i++) {
      out.push(fmt(cues[i].start) + ' --> ' + fmt(cues[i].end) + cues[i].settings + '\n' + cues[i].text + '\n');
    }
    return out.join('\n');
  }

  function applySubOffset() {
    for (var lang in subCues) {
      if (!subCues.hasOwnProperty(lang) || !subTracks[lang]) continue;
      var vtt = cuesToVtt(subCues[lang], subOffset);
      var url = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
      var old = subTracks[lang].src;
      subTracks[lang].src = url;
      try { if (old) URL.revokeObjectURL(old); } catch (e) {}
    }
    if (subActiveLang) setSubLang(subActiveLang);
  }

  var $subSync = document.getElementById('subSync');
  var $subOffsetLabel = document.getElementById('subOffsetLabel');
  var subActiveLang = '';
  var desiredSubLang = '';

  function setSubLang(lang) {
    subActiveLang = lang;
    for (var l in subTracks) {
      if (!subTracks.hasOwnProperty(l)) continue;
      var tt2 = subTracks[l].track;
      if (tt2) { try { tt2.mode = (l === lang) ? 'showing' : 'disabled'; } catch (e) {} }
    }
  }

  $subSync.addEventListener('click', function(e) {
    var b = e.target.closest('button[data-o]');
    if (!b || !nativeVideo) return;
    var o = b.getAttribute('data-o');
    if (o === 'reset') subOffset = 0;
    else subOffset = Math.round((subOffset + parseFloat(o)) * 10) / 10;
    if (subOffset > 60) subOffset = 60;
    if (subOffset < -60) subOffset = -60;
    $subOffsetLabel.textContent = (subOffset > 0 ? '+' : '') + subOffset.toFixed(1) + 's';
    applySubOffset();
    try { localStorage.setItem(STORAGE_PREFIX + 'suboff_' + (subImdbId || ''), String(subOffset)); } catch (err) {}
  });

  function loadSubsForVideo(video, imdbId, season, episode) {
    subCues = {}; subTracks = {}; subActiveLang = '';
    var saved = 0;
    try { saved = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'suboff_' + imdbId)) || 0; } catch (e) {}
    subOffset = Math.round(saved * 10) / 10;
    if (subOffset) $subOffsetLabel.textContent = (subOffset > 0 ? '+' : '') + subOffset.toFixed(1) + 's';
    fetchSubs(imdbId, season, episode).then(function(list) {
      if (!list.length) return;
      var best = {};
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        if (!s || !s.SubDownloadLink) continue;
        if (String(s.SubFormat || '').toLowerCase() === 'ssa') continue;
        var lang = s.SubLanguageID || '?';
        var score = (parseInt(s.SubDownloadsCnt, 10) || 0) * 100 + (parseInt(s.SubRating, 10) || 0);
        if (String(s.SubBad, 10) !== '0' && String(s.SubBad) !== '0') score -= 1000000;
        var sf = parseFloat(s.MovieFPS);
        if (videoFps && sf && Math.abs(videoFps - sf) < 0.5) score += 100000000;
        if (!best[lang] || score > best[lang].score) best[lang] = { sub: s, score: score };
      }
      var langs = Object.keys(best).sort();
      desiredSubLang = 'eng';
      try {
        var savedLang = localStorage.getItem(STORAGE_PREFIX + 'sub_' + imdbId);
        if (savedLang && best[savedLang]) desiredSubLang = savedLang;
      } catch (e) {}
      var subLoadTotal = langs.length, subLoaded = 0;
      langs.forEach(function(lang) {
        var s = best[lang].sub;
        subToVtt(s).then(function(vtt) {
          if (!vtt || !currentModalItem) return;
          var cues = parseVttCues(vtt);
          if (!cues.length) return;
          var subFps = parseFloat(s.MovieFPS);
          if (videoFps && subFps && Math.abs(videoFps / subFps - 1) > 0.0005) {
            var ratio = videoFps / subFps;
            for (var ci = 0; ci < cues.length; ci++) {
              cues[ci].start *= ratio;
              cues[ci].end *= ratio;
            }
          }
          subCues[lang] = cues;
          var tr = document.createElement('track');
          tr.kind = 'subtitles';
          tr.srclang = s.ISO639 || (lang.length === 3 ? lang : 'en');
          tr.label = s.LanguageName || lang;
          tr.src = URL.createObjectURL(new Blob([cuesToVtt(cues, subOffset)], { type: 'text/vtt' }));
          if (lang === desiredSubLang) tr.default = true;
          video.appendChild(tr);
          subTracks[lang] = tr;
          if (lang === desiredSubLang) setSubLang(lang);
          if (subOffset) applySubOffset();
          subLoaded++;
          if (subLoaded === subLoadTotal) {
            var passes = 0;
            (function enforce() {
              setSubLang(subActiveLang || desiredSubLang);
              if (++passes < 3) setTimeout(enforce, 400);
            })();
          }
        });
      });
    });
  }

  function clearSubTracks(video) {
    if (!video) return;
    var tracks = video.querySelectorAll('track');
    for (var i = 0; i < tracks.length; i++) {
      try { if (tracks[i].src) URL.revokeObjectURL(tracks[i].src); } catch (e) {}
      tracks[i].remove();
    }
  }

  function hookNativeEvents(item, season, episode, resumeSeconds) {
    var v = nativeVideo;
    var lastSave = 0;
    var seekDone = false;
    v.addEventListener('loadedmetadata', function() {
      if (!seekDone && resumeSeconds > 1 && v.duration > resumeSeconds) {
        seekDone = true;
        try { v.currentTime = resumeSeconds; } catch (e) {}
      }
    });
    v.addEventListener('timeupdate', function() {
      var t = v.currentTime;
      if (t > 5 && t - lastSave >= 5) {
        lastSave = t;
        setResume(currentResumeKey(), {
          progress: t,
          duration: v.duration || 0,
          title: item.title,
          season: item.type === 'tv' ? season : null,
          episode: item.type === 'tv' ? episode : null,
          time: Date.now()
        });
      }
    });
    v.addEventListener('ended', function() {
      clearResume(currentResumeKey());
      showToast('Playback completed!');
    });
    v.addEventListener('error', function() {
      if (v.src && currentModalItem) nativeFail(item, season, episode, 'Stream error');
    });
  }

  function buildEmbedUrl(item, season, episode) {
    var embedUrl = item.embedUrlTmdb || item.embedUrl;
    if (!embedUrl) {
      embedUrl = item.type === 'tv'
        ? API + '/embed/tv/' + (item.tmdb || item.imdb)
        : API + '/embed/movie/' + (item.imdb || item.tmdb);
    }
    var base = embedUrl.split('?')[0];
    var params = (embedUrl.split('?')[1] || '').split('&').filter(function(p) {
      return p && p.indexOf('season=') !== 0 && p.indexOf('episode=') !== 0;
    });
    if (item.type === 'tv') {
      params.push('season=' + season);
      params.push('episode=' + episode);
    }
    params.push('autonext=1');
    return base + '?' + params.join('&');
  }

  function startPlayer(withResume) {
    if (!currentModalItem) return;
    var item = currentModalItem;
    var season = item.type === 'tv' ? selSeason : null;
    var episode = item.type === 'tv' ? selEpisode : null;
    var resumeSeconds = 0;
    if (withResume) {
      var resume = getResume(currentResumeKey());
      if (resume && resume.progress) resumeSeconds = resume.progress;
    }
    nativeAttempts = 0;
    playNative(item, season, episode, resumeSeconds);
  }

  function closeModal() {
    $modal.classList.remove('open');
    document.body.style.overflow = '';
    $modalPlayer.innerHTML = '';
    currentModalItem = null;
    destroyNativePlayer();
  }

  $modalClose.addEventListener('click', closeModal);
  $modal.addEventListener('click', function(e) { if (e.target === $modal) closeModal(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

  // ─── Resume ───
  function getResume(key) {
    try { return JSON.parse(localStorage.getItem(key)); }
    catch (e) { return null; }
  }
  function getShowResume(showId) {
    var best = null, bestTime = 0;
    try {
      var prefix = STORAGE_PREFIX + 'r_' + showId + '_';
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(prefix) === 0) {
          try {
            var d = JSON.parse(localStorage.getItem(k));
            if (d && d.time && d.time >= bestTime) { bestTime = d.time; best = d; }
          } catch (e) {}
        }
      }
    } catch (e) {}
    return best;
  }
  function setResume(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  }
  function clearResume(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // ─── Toast ───
  function showToast(msg, ms) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $toasts.appendChild(el);
    setTimeout(function() { el.remove(); }, ms || 3000);
  }

  // ─── Init ───
  loadPage();
})();
</script>
</body>
</html>
